<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="native-bridge.js?v=1786510338"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Indicação — Apex</title>
  <style>
    /* Public, no-login page. Same rule as referral.html: everything is
       self-contained, no app JS/CSS is pulled in, and this page must never
       grow a dependency on authenticated code.

       Deliberately simpler than referral.html in exactly two ways, both
       because this is APEX'S OWN page rather than a client's:
         * PT only — no language toggle. Rafa and Alice are both Brazilian and
           this page represents Apex itself.
         * Apex's own black-and-gold, hardcoded. No per-partner branding, so
           there are no CSS custom-property overrides to apply at runtime. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #C9A43A; --ink: #1a1a1d; --muted: #6b6660;
      --border: #e3ded6; --bg: #f7f4ee; --red: #b44040; --green: #3f7d4e;
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 0 40px;
    }
    .brandbar {
      background: var(--ink); width: 100%;
      padding: 22px 14px 24px; text-align: center; margin-bottom: 4px;
    }
    /* Apex's own logo — the same asset nav.js already uses across the admin
       UI. Referenced, never re-uploaded. */
    .brandbar img { height: 34px; width: auto; display: block; margin: 0 auto 12px; }
    .brandbar .eyebrow {
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); font-weight: 700;
    }
    .brandbar h1 { font-size: 21px; color: #fff; margin-top: 5px; }
    .brandbar .sub { color: rgba(255,255,255,0.72); font-size: 14px; margin-top: 7px; line-height: 1.45; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 18px; width: 100%; max-width: 440px; margin: 14px 14px 0;
      box-shadow: 0 2px 10px rgba(26,26,29,0.06);
    }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="tel"], input[type="email"] {
      width: 100%; min-height: 48px; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border); border-radius: 10px; background: #fff;
    }
    input:focus { outline: none; border-color: var(--gold); }
    .btn {
      width: 100%; min-height: 52px; margin-top: 18px; border: none; border-radius: 10px;
      background: var(--gold); color: #1a1a1d; font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .btn[disabled] { opacity: 0.6; }
    .err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 18px; }
    .done { text-align: center; padding: 10px 0; }
    .done .check { font-size: 44px; color: var(--green); }
    .done h2 { font-size: 20px; margin: 10px 0 8px; }
    .done p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    /* Honeypot: visually removed but present in the DOM for bots. */
    .hp-field { position: absolute; left: -9999px; top: -9999px; height: 0; overflow: hidden; }
    .loading, .notfound { text-align: center; color: var(--muted); padding: 30px 0; font-size: 15px; }
  </style>
</head>
<body>
  <div class="brandbar">
    <img src="https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png" alt="Apex">
    <div class="eyebrow">Indicação</div>
    <h1>Apex Business</h1>
    <div class="sub" id="introLine"></div>
  </div>

  <div class="card" id="cardLoading">
    <div class="loading">Carregando…</div>
  </div>

  <div class="card" id="cardNotFound" hidden>
    <div class="notfound">Link de indicação inválido ou expirado.</div>
  </div>

  <div class="card" id="cardForm" hidden>
    <label for="fNome">Seu nome *</label>
    <input type="text" id="fNome" autocomplete="name">
    <label for="fTel">Telefone</label>
    <input type="tel" id="fTel" autocomplete="tel">
    <label for="fEmail">Email</label>
    <input type="email" id="fEmail" autocomplete="email">
    <!-- Honeypot: humans never see or fill this. -->
    <div class="hp-field" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="err" id="formErr"></div>
    <button type="button" class="btn" id="btnSend" onclick="submitReferral()">Enviar</button>
  </div>

  <div class="card" id="cardDone" hidden>
    <div class="done">
      <div class="check">&#10003;</div>
      <h2>Recebido!</h2>
      <p>Obrigado! A equipe da Apex recebeu seus dados e vai entrar em contato em breve.</p>
    </div>
  </div>

  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";
    var slug = (window.location.search.match(/[?&]p=([a-z2-7]{10,40})/) || [])[1] || null;
    var loadedAt = Date.now();

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function showCard(id) {
      ["cardLoading", "cardNotFound", "cardForm", "cardDone"].forEach(function(c) {
        document.getElementById(c).hidden = (c !== id);
      });
    }

    function loadForm() {
      if (!slug) { showCard("cardNotFound"); return; }
      fetch(WORKER_URL + "/api/apex-referral/" + slug)
        .then(function(res) {
          if (!res.ok) { throw new Error("nf"); }
          return res.json();
        })
        .then(function(d) {
          document.getElementById("introLine").innerHTML =
            (d.partner_name ? escHtml(d.partner_name) + " indicou você. " : "") +
            "Deixe seus dados e a equipe entra em contato.";
          showCard("cardForm");
        })
        .catch(function() { showCard("cardNotFound"); });
    }

    function submitReferral() {
      var err = document.getElementById("formErr");
      err.textContent = "";
      var nome = document.getElementById("fNome").value.trim();
      if (!nome) { err.textContent = "Preencha seu nome."; return; }
      var btn = document.getElementById("btnSend");
      btn.disabled = true;
      fetch(WORKER_URL + "/api/apex-referral/" + slug, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome: nome,
          telefone: document.getElementById("fTel").value.trim() || null,
          email: document.getElementById("fEmail").value.trim() || null,
          website: document.getElementById("website").value || null,
          elapsed_ms: Date.now() - loadedAt
        })
      })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) {
          btn.disabled = false;
          if (!r.ok) { throw new Error(r.data.error || "Erro"); }
          showCard("cardDone");
          window.scrollTo(0, 0);
        })
        .catch(function(e) {
          btn.disabled = false;
          err.textContent = e.message;
        });
    }

    loadForm();
  </script>
</body>
</html>
