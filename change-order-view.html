  <style>
    /* CONTRACT page (contracts build, checkpoint B3). Copied from
       estimate-view.html (fix build): hero band + logo tile + brand pill,
       meta area, amount tile, payment tiles, signature pad, signed block.
       Public, no-login page for a client's CUSTOMER. Modelled on
       referral.html: self-contained, no app JS/CSS, the CLIENT's brand only.
       No Apex name, logo, colours or URL anywhere on this page.
       --brand-bg / --brand-accent are overridden from the client's settings;
       the defaults are a neutral dark gray and white, never Apex's palette.
       Text on a brand colour is chosen at runtime for 4.5:1 (textOn).
       Header reworked in the 2026-09-26 fix build after templates/

    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {

    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; min-height: 100vh; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
    /* ---- HERO BAND + TILE ROW: doc-hero.css (shared with the PDF templates

    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; }

    .meta-area { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .meta-left { flex: 1; min-width: 0; font-size: 14px; }
    .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-left .who { font-size: 17px; font-weight: 700; }
    .meta-left .from { margin-top: 10px; font-size: 13px; color: #444; line-height: 1.55; }
    .meta-right { flex: 0 1 260px; text-align: right; }

    .meta-right .num { font-size: 15px; font-weight: 700; color: var(--brand-accent); margin-bottom: 6px; }

    .consent input { width: 22px; height: 22px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--brand-accent); }
    .err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 18px; font-weight: 600; }
    .ok { color: var(--green); font-weight: 700; }
    .state { text-align: center; padding: 20px 0; }
    .state h3 { font-size: 20px; margin-bottom: 8px; }
    .state p { color: var(--muted); }

    @media (max-width: 400px) { .signed-grid { grid-template-columns: 1fr; } }
    .banner { border-radius: 10px; padding: 12px 14px; font-size: 14px; }

    .muted { color: var(--muted); }

    .hidden { display: none !important; }
    @media (max-width: 400px) { .option-head { flex-wrap: wrap; } }
    /* ---- Contract sections. Clause text is Markdown-light: **bold** and
       blank-line paragraphs, rendered by richHtml(). ---- */
    .clause { margin-top: 14px; }
    .clause .clause-title { font-weight: 800; font-size: 15px; padding: 8px 0 4px; border-bottom: 2px solid var(--brand-accent); margin-bottom: 6px; }
    .clause p { font-size: 14px; margin: 0 0 8px; line-height: 1.55; }
    .clause.locked p { font-weight: 700; }
    /* L1: 12pt+ bold capitals, its own card, its own signature (statute format). */
    .lien-card p { font-size: 16px; font-weight: 800; text-transform: uppercase; line-height: 1.45; }
    .lien-card .lien-sign { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }

    .noc-copy p { font-weight: 700; font-size: 13.5px; margin: 0 0 8px; }
    .docs a { display: block; min-height: 44px; line-height: 44px; font-weight: 700; color: var(--brand-accent); text-decoration: underline; }
    .disclaimer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 12px; }
    .preview-banner { background: #fff4d6; border: 1px solid #e8cf8a; color: #6b4d00; border-radius: 10px; padding: 10px 14px; font-weight: 700; text-align: center; margin-top: 14px; }
    .step { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 12px; }
    .step h3 { font-size: 15px; margin-bottom: 4px; }
    .sig-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    @media (max-width: 520px) { .sig-pair { grid-template-columns: 1fr; } }
    /* Change order (one-page addendum): the items table and the totals rows. */
    .co-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    .co-table th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 0; border-bottom: 2px solid var(--brand-accent); }
    .co-table td { padding: 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .co-table td.n, .co-table th.n { text-align: right; white-space: nowrap; }

    .co-table .credit { color: inherit; }
    .co-totals { margin-top: 12px; }
    .co-totals .row { display: flex; justify-content: space-between; padding: 6px 0; gap: 12px; }
    .co-totals .grand { font-size: 17px; font-weight: 500; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 4px; }
    .co-totals .grand span:last-child { font-weight: 300; }
    .co-line { font-size: 14px; margin-top: 12px; }
    @media (max-width: 420px) { .co-table { font-size: 13px; } .co-table td.n, .co-table th.n { white-space: normal; } .co-table td.n { word-break: keep-all; } }
  </style>

<body>
  <div class="hero-band doc-screen" id="hero" role="banner">
    <img class="hero-img" id="heroImg" alt="" hidden>
    <div class="header-tile-row">
      <div class="client-logo-tile"><img id="bizLogo" alt="" hidden><span class="client-name-mark" id="bizMark" hidden></span></div>
      <span class="brand-pill" id="bizName" hidden></span>
    </div>
  </div>

  <div class="wrap" role="main">
    <div class="card" id="cardLoading" role="status"><div class="state"><p>Loading...</p></div></div>
    <div class="card hidden" id="cardNotFound"><div class="state"><h3 role="heading" aria-level="1">Change order not found</h3><p>This link is not valid or is no longer available.</p></div></div>

    <div id="doc" class="hidden">
      <div class="preview-banner hidden" id="previewBanner">PREVIEW - not sent. This is exactly what the homeowner will see.</div>
      <div class="card" id="cardMeta"></div>
      <div class="card hidden" id="cardStateBanner"></div>
      <div class="card" id="cardBody"></div>
      <div class="card" id="cardActions"></div>
      <div class="card" style="margin-top:28px;"><button type="button" class="btn secondary" id="btnPdf">Download change order (PDF)</button><div class="err" role="alert" id="pdfErr"></div><p class="disclaimer" id="disclaimerEnd"></p></div>
    </div>
    <div class="legal-links no-print" style="text-align:center;font-size:12px;color:var(--muted, #6b7280);padding:10px 0 4px;"><a href="/privacy.html" target="_blank" rel="noopener" style="color:inherit;">Privacy Policy</a> &middot; <a href="/terms.html" target="_blank" rel="noopener" style="color:inherit;">Terms</a></div>
  </div>

  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";
    var token = (window.location.search.match(/[?&]t=([a-f0-9]{48})/) || [])[1] || null;
    // Portal preview (the builder's Preview button): the same payload through
    // the owner's session, rendered with a banner and no signing controls.
    var previewId = (window.location.search.match(/[?&]preview=([A-Za-z0-9-]+)/) || [])[1] || null;
    // Local mock for offline checks only (mock=path.json); never used in production.
    var mockUrl = (window.location.search.match(/[?&]mock=([A-Za-z0-9_.\/-]+)/) || [])[1] || null;
    function escHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
    function money(c) { var n = (Number(c) || 0) / 100; var neg = n < 0; n = Math.abs(n); var p = n.toFixed(2).split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (neg ? "-" : "") + "$" + p.join("."); }
    // Plain YYYY-MM-DD dates print as they are; a UTC timestamp from D1 is
    // first converted to the Eastern calendar date (a 10 PM Eastern signature
    // is still that day, never tomorrow).
    function fmtDate(v) {
      if (!v) { return ""; }
      var s = String(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { var p = s.split("-"); return p[1] + "/" + p[2] + "/" + p[0]; }
      var iso = s.replace(" ", "T"); if (!/[Zz]|[+-]\d\d:?\d\d$/.test(iso)) { iso += "Z"; }
      var d = new Date(iso); if (isNaN(d.getTime())) { return s; }
      try {
        var q = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d).reduce(function(a, x) { a[x.type] = x.value; return a; }, {});
        return q.month + "/" + q.day + "/" + q.year;
      } catch (e) { return s.slice(0, 10); }
    }
    // F46: iPhone Safari prints the page URL in its print header/footer, and
    // this URL carries the private ?t= access token. Everything is already
    // loaded, so the token is taken out of the address bar
    // (history.replaceState, same path, other parameters kept) for the
    // duration of the print and put back afterwards. Hooked on
    // beforeprint/afterprint AND a print media-query listener (Safari fires
    // one or the other depending on how printing was started), and wrapped
    // around this page's own print() calls.
    var printUrlSaved = null;
    function printUrlHide() {
      if (printUrlSaved !== null) { return; }
      try {
        var href = window.location.href;
        if (!/[?&]t=[a-f0-9]{48}/.test(href)) { return; }
        var q = window.location.search.replace(/([?&])t=[a-f0-9]{48}&?/, "$1").replace(/[?&]$/, "");
        printUrlSaved = href;
        history.replaceState(history.state, "", window.location.pathname + q + window.location.hash);
      } catch (e) { printUrlSaved = null; console.error(e); }
    }
    function printUrlRestore() {
      if (printUrlSaved === null) { return; }
      try { history.replaceState(history.state, "", printUrlSaved); } catch (e) { console.error(e); }
      printUrlSaved = null;
    }
    function printWithoutToken() { printUrlHide(); window.print(); }
    window.addEventListener("beforeprint", printUrlHide);
    window.addEventListener("afterprint", printUrlRestore);
    if (window.matchMedia) {
      try {
        var printMql = window.matchMedia("print");
        var onPrintMql = function(m) { if (m.matches) { printUrlHide(); } else { printUrlRestore(); } };
        if (printMql.addEventListener) { printMql.addEventListener("change", onPrintMql); } else if (printMql.addListener) { printMql.addListener(onPrintMql); }
      } catch (e) { console.error(e); }
    }
    // UTC from D1 -> Eastern, 12-hour.
    function fmtDateTime(iso) {
      if (!iso) { return ""; }
      var s = String(iso).replace(" ", "T"); if (!/[Zz]|[+-]\d\d:?\d\d$/.test(s)) { s += "Z"; }
      var d = new Date(s); if (isNaN(d.getTime())) { return iso; }
      try { var p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(d).reduce(function(a, x) { a[x.type] = x.value; return a; }, {});
        return p.month + "/" + p.day + "/" + p.year + " " + p.hour + ":" + p.minute + " " + (p.dayPeriod || "").toUpperCase() + " ET"; } catch (e) { return iso; }
    }
    function fmtPhone(tel) { var d = String(tel || "").replace(/\D/g, ""); if (d.length === 11 && d.charAt(0) === "1") { d = d.slice(1); } if (d.length === 10) { return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6); } return String(tel || ""); }
    function lum(hex) { var h = hex.replace("#", ""); var rgb = [0, 2, 4].map(function(i) { var c = parseInt(h.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]; }
    function textOn(hex) { return (1.05 / (lum(hex) + 0.05)) >= 4.5 ? "#ffffff" : "#111111"; }
    var PM_LABEL = { zelle: "Zelle", check: "Check", cash: "Cash", money_order: "Money order", bank_transfer: "Bank transfer / ACH", card_link: "Card", card: "Card", other: "Other" };
    function byId(id) { return document.getElementById(id); }

    // Docs PDF build: the PDF is printed by Chrome on the server from the same
    // template and opened as a real https PDF (on iPhone, Safari's own PDF
    // viewer, where Share / Save to Files works). No blob: URL, no
    // <a download>, never window.print() on the phone. A preview (owner
    // signed in to the portal) first asks the Worker for a one-document link.
    function openPdf(kind) {
      var err = byId("pdfErr"); if (err) { err.textContent = ""; }
      if (!previewId) {
        var url = WORKER_URL + "/api/public/pdf/" + kind + "/" + token;
        var w0 = window.open(url, "_blank");
        if (!w0) { window.location.href = url; }
        return;
      }
      var cid = null, tok = null;
      try { cid = localStorage.getItem("apex_client_id"); tok = localStorage.getItem("apex_client_token"); } catch (e) { cid = null; }
      if (!cid || !tok) { if (err) { sayErr(err, "Open this preview from the portal to download it."); } return; }
      var w = window.open("", "_blank");
      fetch(WORKER_URL + "/api/clients/" + encodeURIComponent(cid) + "/gm/pdf-link", { method: "POST", headers: { "Authorization": "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ kind: kind, id: previewId }) })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) {
          if (!r.ok || !r.data.url) { throw new Error((r.data && (r.data.error_en || r.data.error)) || "Could not prepare the PDF. Please try again."); }
          if (w) { w.location.href = r.data.url; } else { window.location.href = r.data.url; }
        })
        .catch(function(e) { if (w) { w.close(); } if (err) { sayErr(err, e.message); } console.error(e); });
    }
    // Markdown-light: **bold** and blank-line paragraphs; single newlines stay
    // as line breaks (the statutory forms rely on them).
    function richHtml(text) {
      var paras = String(text || "").split(/\n\s*\n/);
      return paras.map(function(p) {
        var h = escHtml(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
        return h.trim() ? "<p>" + h + "</p>" : "";
      }).join("");
    }

    function applyBranding(b) {
      var hex = /^#[0-9a-fA-F]{6}$/;
      var root = document.documentElement.style;
      var primary = hex.test(b.brand_primary || "") ? b.brand_primary : null;
      var accent = hex.test(b.brand_accent || "") ? b.brand_accent : primary;
      if (primary) { root.setProperty("--brand-bg", primary); root.setProperty("--on-brand-bg", textOn(primary)); }
      if (accent) {
        root.setProperty("--brand-accent", accent); root.setProperty("--on-brand-accent", textOn(accent));
        root.setProperty("--accent-on-dark", lum(accent) > 0.18 ? accent : "#ffffff");
      }
      var name = b.name || "";
      var mark = byId("bizMark");
      var logo = byId("bizLogo");
      if (mark) { mark.textContent = name; mark.className = "client-name-mark" + (name.length > 22 ? " is-long" : ""); mark.hidden = false; }
      if (b.logo_url && logo) {
        logo.onload = function() { logo.hidden = false; if (mark) { mark.hidden = true; } };
        logo.onerror = function() { logo.hidden = true; if (mark) { mark.hidden = false; } };
        logo.src = b.logo_url;
      }
      var hero = byId("heroImg");
      if (b.hero_url && hero) { hero.onload = function() { hero.hidden = false; }; hero.src = b.hero_url; }
      if (typeof docHeroApply === "function") { docHeroApply(byId("hero"), hero, b.hero); }
      var pill = byId("bizName");
      if (pill) { pill.textContent = name; pill.hidden = !name; }
    }
    function fromHtml(b) {
      var lines = [];
      if (b.name) { lines.push('<strong>' + escHtml(b.name) + '</strong>'); }
      (b.license_numbers || []).forEach(function(l) { lines.push("License " + escHtml(l)); });
      if (b.address) { lines.push(escHtml(b.address)); }
      if (b.phone) { lines.push(escHtml(fmtPhone(b.phone))); }
      if (b.email) { lines.push(escHtml(b.email)); }
      return '<div class="from"><div class="k">From</div>' + lines.join("<br>") + '</div>';
    }
    function metaHtml(leftLabel, who, whoLines, b, title, num, rows, stamp, tile) {
      var t = '<table>' + rows.map(function(r) { return '<tr><td class="fl">' + r[0] + '</td><td class="fv">' + r[1] + '</td></tr>'; }).join("") + '</table>';
      return '<div class="meta-area"><div class="meta-left"><div class="k">' + leftLabel + '</div><div class="who">' + escHtml(who || "") + '</div>' +
        (whoLines.length ? '<div class="small muted">' + whoLines.map(escHtml).join("<br>") + '</div>' : "") + fromHtml(b) + '</div>' +
        '<div class="meta-right"><div class="title" role="heading" aria-level="1">' + title + '</div><div class="num">' + escHtml(num) + '</div>' + t + (stamp || "") + '</div></div>' +
        (tile ? '<div class="amount-due-tile"><div class="adt-label">' + tile.label + '</div><div class="adt-value">' + tile.value + '</div></div>' : "");
    }
    function paymentTilesHtml(methods) {
      return '<div class="payment-tiles">' + methods.map(function(m) {
        return '<div class="payment-tile"><div class="pt-label">' + escHtml(PM_LABEL[m.key] || m.key) + '</div>' + (m.detail ? '<div class="pt-detail">' + escHtml(m.detail) + '</div>' : "") + '</div>';
      }).join("") + '</div>';
    }
    function show(id) { ["cardLoading", "cardNotFound", "doc"].forEach(function(c) { var el = byId(c); if (el) { el.classList.toggle("hidden", c !== id); } }); }

    var con = null;
    var sigKind = "typed";
    var pads = {};   // canvas id -> { ctx, drew }

    function canRespond() { return !previewId && ["sent", "viewed"].indexOf(con.status) !== -1; }
    function isCredit(cents) { return (Number(cents) || 0) < 0; }
    function signedMoney(cents) { var n = Number(cents) || 0; return (n < 0 ? "-" : (n > 0 ? "+" : "")) + money(Math.abs(n)); }
    function refText() { return con.contract_display_number ? "Contract " + con.contract_display_number + (con.contract_date ? " dated " + fmtDate(con.contract_date) : "") : "the accepted estimate"; }

    // F4 final guard: no raw {token} ever reaches the homeowner.
    function stripTokens(html) { return String(html).replace(/\{([A-Za-z0-9_]+)\}/g, function(m, k) { console.error("[change order] unfilled placeholder removed from homeowner text: {" + k + "}"); return ""; }); }
    function sayErr(err, text) { err.textContent = text; if (err.scrollIntoView) { err.scrollIntoView({ block: "center" }); } }

    function renderMeta() {
      var b = con.business;
      var whoLines = [];
      if (con.property_address) { whoLines.push(con.property_address); }
      var rows = [["Date", escHtml(fmtDate(con.created_at))], ["To", escHtml(refText())], ["Job", escHtml(con.job_name || "")]];
      var stamp = "";
      if (con.status === "completed") { stamp = '<span class="stamp ok">SIGNED BY BOTH PARTIES</span>'; }
      else if (con.status === "declined") { stamp = '<span class="stamp bad">DECLINED</span>'; }
      var tile = { label: isCredit(con.amount_cents) ? "Credit to owner" : "Change", value: signedMoney(con.amount_cents) };
      var card = byId("cardMeta");
      if (card) { card.innerHTML = metaHtml("Owner", con.customer_name, whoLines, b, "Change order", con.number, rows, stamp, tile); }
    }

    // Rafael's one-page addendum: only what changed, the price before, the
    // change, the new price, the schedule effect, the payment schedule change.
    function renderBody() {
      var box = byId("cardBody");
      if (!box) { return; }
      var h = '<h2>Change Order ' + escHtml(con.number) + ' to ' + escHtml(refText()) + '</h2>';
      if (con.description) { h += '<p style="margin-top:6px;">' + stripTokens(escHtml(con.description)) + '</p>'; }
      h += '<table class="co-table"><thead><tr><th>Added or removed</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>';
      (con.items || []).forEach(function(it) {
        var credit = it.kind === "remove" || isCredit(it.amount_cents);
        h += '<tr><td>' + (credit ? '<span class="credit">Removed: </span>' : 'Added: ') + escHtml(it.item_name) + '</td>' +
          '<td class="n">' + escHtml(String(it.qty)) + (it.unit ? " " + escHtml(it.unit) : "") + '</td>' +
          '<td class="n">' + money(it.rate_cents) + '</td>' +
          '<td class="n' + (credit ? ' credit' : '') + '">' + signedMoney(it.amount_cents) + (credit ? ' (credit)' : '') + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="co-totals">' +
        '<div class="row"><span>Contract Price before this Change Order</span><span>' + money(con.price_before_cents) + '</span></div>' +
        '<div class="row"><span>' + (isCredit(con.amount_cents) ? 'Credit' : 'Change') + '</span><span>' + signedMoney(con.amount_cents) + '</span></div>' +
        '<div class="row grand"><span>New Contract Price</span><span>' + money(con.price_after_cents) + '</span></div></div>';
      var d = Number(con.schedule_days) || 0;
      h += '<p class="co-line"><strong>Effect on the schedule:</strong> ' + (d === 0 ? "no change to the schedule." : (Math.abs(d) + " working day" + (Math.abs(d) === 1 ? "" : "s") + (d > 0 ? " added to" : " removed from") + " the schedule.")) + '</p>';
      h += '<p class="co-line"><strong>Payment schedule:</strong> ' + (con.payment_change === "new_step" ? "A new invoice step is added for this amount." : "The remaining unpaid invoices are adjusted by this amount.") + (con.payment_note ? " " + escHtml(con.payment_note) : "") + '</p>';
      h += '<p class="co-line">Everything in the Contract not changed by this Change Order stays the same.</p>';
      box.innerHTML = h;
    }

    function signatureCell(label, sig, fallbackName) {
      if (!sig) { return '<div class="cell"><div class="k">' + label + '</div><div class="muted small">Not signed yet</div></div>'; }
      var drawn = sig.kind === "drawn";
      var visual = (drawn && sig.image_url) ? '<img class="sigimg" src="' + escHtml(sig.image_url) + '" alt="Signature">' : '<div class="typed-sig">' + escHtml(sig.signer_name || fallbackName || "") + '</div>';
      return '<div class="cell"><div class="k">' + label + '</div>' + visual +
        '<div class="k" style="margin-top:8px;">Signer</div>' + escHtml(sig.signer_name || "") +
        '<div class="k" style="margin-top:8px;">Date and time</div>' + escHtml(fmtDateTime(sig.signed_at)) +
        '<div class="k" style="margin-top:8px;">Method</div>' + (drawn ? "Signed electronically - drawn signature" : "Signed electronically - typed name") +
        (sig.device ? '<div class="k" style="margin-top:8px;">Device</div>' + escHtml(sig.device) : "") + '</div>';
    }
    function signedHtml() {
      var hs = con.homeowner_signature;
      var h = '<div class="state"><h3 class="ok" aria-level="2">Signed by both parties</h3>' +
        (hs ? '<p>Signed by ' + escHtml(hs.signer_name || "") + (hs.signed_at ? ' on ' + escHtml(fmtDateTime(hs.signed_at)) : "") + '.</p>' : "") +
        '<div class="signed-grid">' + signatureCell("Company signature", con.company_signature, con.business.name) + signatureCell("Owner signature", hs, con.customer_name) + '</div>';
      if (con.content_hash) { h += '<p class="hash" style="margin-top:10px;">Document hash (SHA-256): ' + escHtml(con.content_hash) + '</p>'; }
      return h + '</div>';
    }

    function renderActions() {
      var card = byId("cardActions");
      var banner = byId("cardStateBanner");
      if (!card || !banner) { return; }
      banner.classList.add("hidden");
      var disc = "";   // F10: printed once, at the foot of the page (#disclaimerEnd)
      var company = '<div class="signed-grid">' + signatureCell("Company signature", con.company_signature, con.business.name) + '</div>';
      if (previewId) {
        card.innerHTML = '<h2>Signing</h2>' + company + '<p class="muted">The homeowner signs here after the company has signed. Signing is not available in preview.</p>' + disc;
        return;
      }
      if (con.status === "completed") {
        banner.innerHTML = signedHtml();
        banner.classList.remove("hidden");
        card.innerHTML = '<p class="muted">You can download a copy of this signed change order at any time.</p>' + disc;
        return;
      }
      if (con.status === "declined") {
        // F17: a declined change order shows its state; no sign form.
        banner.innerHTML = '<div class="state"><h3 aria-level="2">Declined</h3><p>' + (previewId ? "The homeowner" : "You") + ' declined this change order' + (con.decline_reason ? ": " + escHtml(con.decline_reason) : "") + '.</p><p class="muted small">' + escHtml((con.business && con.business.name) || "The company") + ' will contact you if anything changes.</p></div>';
        banner.classList.remove("hidden");
        card.innerHTML = company + disc;
        return;
      }
      if (!canRespond()) {
        banner.innerHTML = '<div class="state"><h3 aria-level="2">Waiting for the company\'s signature</h3><p>The company signs first. You will be able to sign once it has.</p></div>';
        banner.classList.remove("hidden");
        card.innerHTML = disc;
        return;
      }
      var h = '<h2>Sign this change order</h2>' + company +
        '<label for="signer">Your full name</label><input type="text" id="signer" autocomplete="name" value="' + escHtml(con.customer_name || "") + '">' +
        '<label>Signature</label>' +
        '<div class="chips"><button type="button" id="chipTyped" class="sel" onclick="setSig(\'typed\')">Type my name</button><button type="button" id="chipDrawn" onclick="setSig(\'drawn\')">Draw</button></div>' +
        '<div id="sigTyped" style="margin-top:8px;"><p class="muted small">Your typed name above will be used as your signature.</p></div>' +
        '<div id="sigDrawn" class="hidden" style="margin-top:8px;"><canvas class="sig" id="sigCanvas"></canvas><button type="button" class="btn secondary" style="min-height:44px;margin-top:8px;" onclick="clearPad(\'sigCanvas\')">Clear</button></div>' +
        esignConsentHtml(con.business, "", "btnSign") +
        '<div class="err" role="alert" id="signErr"></div>' +
        '<button type="button" class="btn" id="btnSign" onclick="sign()" disabled>Sign change order</button>' + disc +
        '<h2 style="margin-top:22px;">Or</h2>' +
        '<label for="declineReason">Decline (optional reason)</label><input type="text" id="declineReason">' +
        '<button type="button" class="btn secondary" id="btnDecline" onclick="respond(\'decline\')">Decline this change order</button>' +
        '<div class="err" role="alert" id="respondErr"></div>';
      card.innerHTML = h;
      setupCanvas("sigCanvas", "main");
    }

    function setSig(kind) {
      sigKind = kind;
      var ct = byId("chipTyped"), cd = byId("chipDrawn"), st = byId("sigTyped"), sd = byId("sigDrawn");
      if (ct) { ct.className = kind === "typed" ? "sel" : ""; }
      if (cd) { cd.className = kind === "drawn" ? "sel" : ""; }
      if (st) { st.classList.toggle("hidden", kind !== "typed"); }
      if (sd) { sd.classList.toggle("hidden", kind !== "drawn"); }
      if (kind === "drawn") { setupCanvas("sigCanvas", "main"); }
    }
    function setupCanvas(id, key) {
      var c = byId(id);
      if (!c) { return; }
      var ratio = window.devicePixelRatio || 1;
      var w = c.clientWidth || 300, h = 160;
      if (c.width !== Math.round(w * ratio)) { c.width = Math.round(w * ratio); c.height = Math.round(h * ratio); }
      var ctx = c.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
      var pad = pads[id] || { drew: false, drawing: false };
      pad.ctx = ctx; pads[id] = pad;
      function pos(ev) { var r = c.getBoundingClientRect(); var t = ev.touches ? ev.touches[0] : ev; return { x: t.clientX - r.left, y: t.clientY - r.top }; }
      c.onpointerdown = function(ev) { pad.drawing = true; pad.drew = true; var p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); ev.preventDefault(); };
      c.onpointermove = function(ev) { if (!pad.drawing) { return; } var p = pos(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); ev.preventDefault(); };
      c.onpointerup = c.onpointerleave = function() { pad.drawing = false; };
    }
    function clearPad(id) { var c = byId(id); var pad = pads[id]; if (c && pad && pad.ctx) { pad.ctx.clearRect(0, 0, c.width, c.height); pad.drew = false; } }

    // Electronic signature consent (E-SIGN, 15 USC 7001(c); Florida UETA, 668.50).
    // The box comes BEFORE the sign control, and the control stays disabled
    // until it is ticked. The business name and contact are the ones this
    // document already shows. CHANGE THE VERSION whenever the words change:
    // it is stored with every signature.
    var ESIGN_CONSENT_VERSION = "2026-10-04.1";
    function esignConsentHtml(b, off, btnId) {
      b = b || {};
      var who = b.name ? String(b.name) : "the business named above";
      var parts = [];
      if (b.phone) { parts.push(fmtPhone(b.phone)); }
      if (b.email) { parts.push(String(b.email)); }
      var contact = parts.length ? parts.join(" or ") : "the business named above";
      var text = "I agree to receive, review and sign this document and related notices electronically. " +
        "I can view, download and print this document on this page. " +
        "I can ask " + who + " for a paper copy at no charge by contacting them at " + contact + ", " +
        "and I can withdraw this consent before signing by closing this page or contacting them. " +
        "To use this page I need a current web browser and a PDF viewer. " +
        "To change my contact details I contact " + who + ".";
      var points = [
        "Paper copy: you can ask " + who + " for a paper copy of this document at no charge.",
        "Withdrawing consent: you can withdraw your consent before signing by closing this page or by contacting " + who + ". Nothing is signed until you press the sign button.",
        "What this covers: this consent applies to this document and to notices related to it.",
        "What you need: a current web browser and a PDF viewer, to view, download and print this document.",
        "Your contact details: to change your phone number, email or address, contact " + who + (parts.length ? " at " + contact : "") + ".",
        "Your copy: you can view, download and print this document on this page at any time."
      ];
      var lis = "";
      for (var i = 0; i < points.length; i++) { lis += "<li>" + escHtml(points[i]) + "</li>"; }
      return '<label class="consent"><input type="checkbox" id="consent"' + (off || "") + ' onchange="esignConsentChanged(\'' + btnId + '\')"><span>' + escHtml(text) + '</span></label>' +
        '<details style="font-size:13px;margin-top:6px;"><summary style="cursor:pointer;">Read the electronic consent details</summary><ul style="margin:8px 0 0 18px;padding:0;">' + lis + '</ul></details>';
    }
    function esignConsentChanged(btnId) {
      var c = byId("consent"); var b = byId(btnId);
      if (b && !b.hasAttribute("data-busy")) { b.disabled = !(c && c.checked); }
    }
    function sign() {
      var err = byId("signErr"); if (!err) { return; }
      err.textContent = "";
      var signerEl = byId("signer");
      var signer = signerEl ? signerEl.value.trim() : "";
      if (!signer) { sayErr(err, "Please type your full name."); return; }
      var consent = byId("consent");
      if (!consent || !consent.checked) { sayErr(err, "Please agree to sign electronically."); return; }
      var body = { signer_name: signer, signature_kind: sigKind, consent: true, consent_text_version: ESIGN_CONSENT_VERSION };
      if (sigKind === "drawn") {
        var c = byId("sigCanvas"); var p = pads["sigCanvas"];
        if (!c || !p || !p.drew) { sayErr(err, "Please draw your signature."); return; }
        body.signature_png = c.toDataURL("image/png");
      }
      var btn = byId("btnSign"); if (btn) { btn.disabled = true; }
      fetch(WORKER_URL + "/api/public/change-orders/" + token + "/sign", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) { if (!r.ok) { throw new Error(r.data.error || "Could not sign"); } return load(); })
        .then(function() { window.scrollTo(0, 0); })
        .catch(function(e) { if (btn) { btn.disabled = false; } sayErr(err, e.message); console.error(e); });
    }

    function respond(kind) {
      var err = byId("respondErr"); if (!err) { return; }
      err.textContent = "";
      var src = byId("declineReason");
      var text = src ? src.value.trim() : "";
      var btn = byId("btnDecline"); if (btn) { btn.disabled = true; }
      fetch(WORKER_URL + "/api/public/change-orders/" + token + "/" + kind, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text || null }) })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) { if (!r.ok) { throw new Error(r.data.error || "Could not send"); } return load(); })
        .then(function() { window.scrollTo(0, 0); })
        .catch(function(e) { if (btn) { btn.disabled = false; } sayErr(err, e.message); console.error(e); });
    }

    function fetchChangeOrder() {
      if (mockUrl) { return fetch(mockUrl).then(function(res) { if (!res.ok) { throw new Error("nf"); } return res.json(); }); }
      if (previewId) {
        var cid = null, tok = null;
        try { cid = localStorage.getItem("apex_client_id"); tok = localStorage.getItem("apex_client_token"); } catch (e) { cid = null; }
        if (!cid || !tok) { return Promise.reject(new Error("nf")); }
        return fetch(WORKER_URL + "/api/clients/" + encodeURIComponent(cid) + "/gm/change-orders/" + encodeURIComponent(previewId), { headers: { "Authorization": "Bearer " + tok } })
          .then(function(res) { if (!res.ok) { throw new Error("nf"); } return res.json(); });
      }
      return fetch(WORKER_URL + "/api/public/change-orders/" + token).then(function(res) { if (!res.ok) { throw new Error("nf"); } return res.json(); });
    }

    function load() {
      if (!token && !previewId && !mockUrl) { show("cardNotFound"); return Promise.resolve(); }
      return fetchChangeOrder()
        .then(function(d) {
          con = d.change_order;
          applyBranding(con.business);
          document.title = "Change Order " + con.number + (con.business.name ? " - " + con.business.name : "");
          var pb = byId("previewBanner"); if (pb) { pb.classList.toggle("hidden", !previewId); }
          renderMeta(); renderBody(); renderActions();
          var de = byId("disclaimerEnd"); if (de) { de.textContent = con.disclaimer_line || ""; }
          var pdf = byId("btnPdf");
          if (pdf) { pdf.textContent = con.status === "completed" ? "Download your signed change order (PDF)" : "Download change order (PDF)"; pdf.onclick = function() { openPdf("change-order"); }; }
          show("doc");
        })
        .catch(function(e) { console.error(e); show("cardNotFound"); });
    }

    window.onload = function() { load(); };
  </script>
</body>
</html>
