<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aprenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Same palette and type as the portal (gm.css and portal.html :root). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --surface: #f9f7f4;
      --header: #1a1a1d;
      --gold: #C9A43A;
      --text: #1a1a1d;
      --muted: #6b6660;
      --border: #e8e2d9;
      --card: #ffffff;
      --red: #8f2f2f;
      --green: #2f6b3e;
      --radius: 12px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; line-height: 1.5; }
    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }
    [hidden] { display: none !important; }
    button { font-family: inherit; color: inherit; }
    button:disabled { opacity: 0.55; cursor: default; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    header { background: var(--header); height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .logo-img { height: 30px; width: auto; display: block; }
    .lang-btn { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 0.8px; padding: 6px 12px; min-height: 32px; border-radius: 20px; cursor: pointer; transition: transform 120ms ease-out, background-color 120ms ease-out; }
    .lang-btn:active { transform: scale(0.97); }

    main { max-width: 720px; margin: 0 auto; padding: 24px 20px calc(48px + env(safe-area-inset-bottom)); }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 14px; }

    .banner { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 12px 12px 12px 16px; margin-bottom: 22px; }
    .banner p { flex: 1; font-size: 14px; color: var(--muted); }
    .icon-btn { width: 44px; height: 44px; margin: -6px -4px -6px 0; flex: none; border: none; background: transparent; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform 120ms ease-out, background-color 120ms ease-out; }
    .icon-btn:active { transform: scale(0.97); }
    .icon-btn svg, .ico { width: 18px; height: 18px; flex: none; }

    /* The one hero: the search box. */
    .search { margin: 8px 0 14px; }
    .search form { display: flex; gap: 10px; }
    .search input { flex: 1; min-width: 0; min-height: 56px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 0 16px; font: 500 16px 'Inter', sans-serif; color: var(--text); }
    .btn-primary { min-height: 56px; padding: 0 20px; border: none; border-radius: var(--radius); background: var(--header); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform 120ms ease-out, background-color 120ms ease-out; }
    .btn-quiet { min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: transform 120ms ease-out, background-color 120ms ease-out; }
    .btn-primary:active, .btn-quiet:active { transform: scale(0.97); }
    .btn-primary.small { min-height: 44px; padding: 0 16px; font-size: 14px; }
    @media (hover: hover) { .btn-quiet:hover, .icon-btn:hover { background: #f3eee3; } .btn-primary:hover { background: #2b2b30; } .lang-btn:hover { background: rgba(201,164,58,0.14); } .card.click:hover { background: #fbf9f5; } }

    .state { font-size: 14px; margin: 14px 0; }
    .state.muted { color: var(--muted); }
    .state.error { color: var(--red); }
    .ok { color: var(--green); font-size: 13px; font-weight: 600; margin-top: 8px; }
    .ok.error { color: var(--red); }
    .reply { font-size: 15px; margin: 6px 0 14px; }

    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 14px 16px; margin-bottom: 10px; width: 100%; text-align: left; display: block; }
    .card.click { cursor: pointer; font: inherit; }
    .card.click:active { transform: scale(0.99); }
    .card-title { display: block; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .card-sum { display: block; font-size: 13px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .list-title { font-size: 15px; font-weight: 700; margin: 28px 0 10px; }

    .back { margin-bottom: 14px; }
    .guide-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .guide-sum { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .sec-title { font-size: 17px; font-weight: 700; margin: 26px 0 8px; }
    .step { padding: 12px; border-radius: var(--radius); margin-bottom: 8px; }
    .step.hit { background: #f3eee3; }
    .step-text { font-size: 15px; margin-bottom: 10px; }
    .pic { display: block; width: 100%; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--card); cursor: zoom-in; }
    .pic img { display: block; width: 100%; height: auto; }
    .link { color: var(--text); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
    .fade { animation: fadein 200ms ease-out; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    .light { position: fixed; inset: 0; z-index: 100; background: rgba(20,18,16,0.82); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadein 200ms ease-out; }
    .light img { max-width: 100%; max-height: 100%; border-radius: var(--radius); }
    .light .icon-btn { position: absolute; right: 12px; top: 12px; margin: 0; background: var(--card); }
    @media (prefers-reduced-motion: reduce) { .lang-btn:active, .icon-btn:active, .btn-primary:active, .btn-quiet:active, .card.click:active { transform: none; } }
    @media (max-width: 480px) { .search form { flex-direction: column; } .btn-primary { justify-content: center; } }
  </style>
</head>
<body class="lang-pt">

  <header>
    <img src="https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png" alt="Apex" class="logo-img">
    <button type="button" class="lang-btn" id="langBtn" aria-label="Português / English">
      <span class="show-pt">EN</span>
      <span class="show-en">PT</span>
    </button>
  </header>

  <main>
    <div id="libraryView">
      <h1 class="page-title" id="pageTitle">Aprenda</h1>

      <div class="banner" id="banner">
        <p id="bannerText"></p>
        <button type="button" class="icon-btn" id="bannerClose"></button>
      </div>

      <section class="search" id="searchBox" hidden>
        <form id="askForm" autocomplete="off">
          <input type="text" id="askInput" maxlength="300">
          <button type="submit" class="btn-primary" id="askBtn"></button>
        </form>
        <div id="answer" aria-live="polite"></div>
      </section>

      <h2 class="list-title" id="listTitle"></h2>
      <div id="guideList"></div>
    </div>

    <div id="guideView" hidden></div>
  </main>

  <script src="help-config.js"></script>
  <script src="help-core.js"></script>
  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"
    integrity="sha384-5y/1XyjXGriVPCsfTI3ap84Bg9Db2y/GiQjR3nbrVJE03bworx9G08uSJEMme/mI"
    crossorigin="anonymous"></script>
  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"
    integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
    crossorigin="anonymous"></script>
  <script>
    // Learn (Aprenda) library page. Text from guides.json or from the worker goes
    // onto the page only through textContent, so there is nothing to inject.
    var HC = window.HelpCore;
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyB_OFg5ouKAu61vObNsHJaGQO0TikaIhy8",
      authDomain: "apex-command-center-4b038.firebaseapp.com",
      projectId: "apex-command-center-4b038",
      storageBucket: "apex-command-center-4b038.firebasestorage.app",
      messagingSenderId: "894743550437",
      appId: "1:894743550437:web:45041f841f7e8196db770c"
    };
    var ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
    var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    var ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

    var cfg = window.APEX_HELP || { enabled: false, base: "https://apex.resonateai.online/" };
    var enabled = HC.isEnabled(window);
    var deep = HC.parseDeepLink(window.location.search);

    // Only on a computer's own localhost, a query string can point the page at the
    // test fixture (used to check the screens without publishing any guide).
    var onLocalhost = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
    var useFixture = onLocalhost && /[?&]fixture=1(&|$)/.test(window.location.search);
    var useLocal = onLocalhost && /[?&]local=1(&|$)/.test(window.location.search);
    var BASE = (useFixture || useLocal) ? (window.location.origin + "/") : String(cfg.base || "");
    var GUIDES_URL = useFixture ? (BASE + "scripts/fixtures/help-guides-fixture.json") : (BASE + "help/guides.json");

    var currentLang = "pt";
    var guides = null;
    var loadState = "loading";   // loading, ready, error
    var openGuide = null;        // { id, section, step } while a guide is open
    var authUser = null;

    function store(key, val) { try { if (val === undefined) { return localStorage.getItem(key); } localStorage.setItem(key, val); } catch (e) { /* works without storage */ } return null; }
    function t(pt, en) { return currentLang === "en" ? en : pt; }
    function L(v) { return (v && typeof v === "object") ? (v[currentLang] || v.pt || "") : ""; }
    function byId(id) { return document.getElementById(id); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text !== undefined && text !== null) { e.textContent = text; } return e; }
    function btn(cls, text) { var b = el("button", cls, text); b.type = "button"; return b; }
    function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

    // ---- language: the portal keeps it as the body class lang-en and, in the tab,
    // sessionStorage "apex_lang". This standalone page reads that, then its own saved choice.
    function pickLanguage() {
      if (deep.lang) { return deep.lang; }
      var saved = store("apex_help_lang");
      if (saved === "en" || saved === "pt") { return saved; }
      var tab = null;
      try { tab = sessionStorage.getItem("apex_lang"); } catch (e) { tab = null; }
      return tab === "en" ? "en" : "pt";
    }
    function applyLanguage() {
      document.body.classList.remove("lang-pt", "lang-en");
      document.body.classList.add(currentLang === "en" ? "lang-en" : "lang-pt");
      document.documentElement.lang = currentLang;
      document.title = t("Aprenda", "Learn");
      byId("pageTitle").textContent = t("Aprenda", "Learn");
      byId("bannerText").textContent = t(
        "Não sabe como fazer algo? Pergunte aqui. Ou, em qualquer tela do Apex, toque e segure um botão (no computador, clique com o botão direito) para aprender sobre ele.",
        "Not sure how to do something? Ask here. Or, on any Apex screen, press and hold a button (on a computer, right click it) to learn about it.");
      byId("bannerClose").setAttribute("aria-label", t("Fechar", "Close"));
      byId("bannerClose").setAttribute("title", t("Fechar", "Close"));
      var ph = t("Pergunte: como envio um orçamento?", "Ask: how do I send an estimate?");
      byId("askInput").setAttribute("placeholder", ph);
      byId("askInput").setAttribute("aria-label", ph);
      if (!byId("askBtn").disabled) { setAskLabel(false); }
      byId("listTitle").textContent = t("Todos os guias", "All guides");
    }

    function setAskLabel(busy) {
      var b = byId("askBtn");
      clear(b);
      var ic = el("span", "ico");
      ic.innerHTML = ICON_SEARCH;
      b.appendChild(ic);
      b.appendChild(document.createTextNode(busy ? t("Buscando...", "Searching...") : t("Perguntar", "Ask")));
    }

    // ---- banner
    function setupBanner() {
      var x = byId("bannerClose");
      x.innerHTML = ICON_CLOSE;
      if (store("apex_help_banner_closed") === "1") { byId("banner").hidden = true; }
      x.addEventListener("click", function () { byId("banner").hidden = true; store("apex_help_banner_closed", "1"); });
    }

    // ---- guides
    function loadGuides() {
      loadState = "loading";
      renderList();
      return fetch(GUIDES_URL, { cache: "no-cache" }).then(function (res) {
        if (!res.ok) { throw new Error("status " + res.status); }
        return res.json();
      }).then(function (data) {
        if (!data || data.version !== 1 || !Array.isArray(data.guides)) { throw new Error("shape"); }
        guides = data;
        loadState = "ready";
      }, function () {
        loadState = "error";
      }).then(function () { renderList(); renderGuideView(); });
    }
    function findGuide(id) {
      var list = guides && guides.guides ? guides.guides : [];
      for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
      return null;
    }
    function imageUrl(path) {
      if (typeof path !== "string" || !path || /^[A-Za-z][A-Za-z0-9+.-]*:/.test(path) || path.indexOf("..") !== -1 || path.indexOf("//") === 0) { return ""; }
      return BASE + path.replace(/^\/+/, "");
    }
    function deepLink(guideId, sectionId, step) {
      var q = "guide=" + encodeURIComponent(guideId);
      if (sectionId) { q += "&section=" + encodeURIComponent(sectionId); }
      if (step) { q += "&step=" + encodeURIComponent(step); }
      var origin = /^https?:\/\//.test(window.location.origin || "") ? window.location.origin : BASE.replace(/\/$/, "");
      return origin + "/help.html?" + q + "&lang=" + currentLang;
    }

    // ---- copy link, with an in page confirmation
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) { return navigator.clipboard.writeText(text); }
      return new Promise(function (resolve, reject) {
        try {
          var ta = el("textarea");
          ta.value = text; ta.setAttribute("readonly", "readonly");
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          var done = document.execCommand("copy");
          document.body.removeChild(ta);
          if (done) { resolve(); } else { reject(new Error("copy")); }
        } catch (e) { reject(e); }
      });
    }
    function copyButton(getLink) {
      var b = btn("btn-quiet");
      var ic = el("span", "ico");
      ic.innerHTML = ICON_COPY;
      b.appendChild(ic);
      b.appendChild(document.createTextNode(t("Copiar link", "Copy link")));
      var note = el("p", "ok");
      note.setAttribute("role", "status");
      note.hidden = true;
      b.addEventListener("click", function () {
        copyText(getLink()).then(function () {
          note.textContent = t("Link copiado.", "Link copied.");
          note.className = "ok"; note.hidden = false;
        }, function () {
          note.textContent = t("Não foi possível copiar.", "Could not copy.");
          note.className = "ok error"; note.hidden = false;
        });
      });
      return { button: b, note: note };
    }

    // ---- the library list
    function renderList() {
      var box = byId("guideList");
      clear(box);
      if (loadState === "loading") { box.appendChild(el("p", "state muted", t("Carregando...", "Loading..."))); return; }
      if (loadState === "error") {
        box.appendChild(el("p", "state error", t("Sem conexão. Tente de novo.", "No connection. Try again.")));
        var retry = btn("btn-primary small", t("Tentar de novo", "Try again"));
        retry.addEventListener("click", loadGuides);
        box.appendChild(retry);
        return;
      }
      if (!guides.guides.length) { box.appendChild(el("p", "state muted", t("Os guias estão sendo preparados.", "The guides are being prepared."))); return; }
      guides.guides.forEach(function (g) { box.appendChild(quietCard(g)); });
    }
    function quietCard(g) {
      var b = btn("card click");
      b.appendChild(el("span", "card-title", L(g.title)));
      b.appendChild(el("span", "card-sum", L(g.summary)));
      b.addEventListener("click", function () { showGuide(g.id, null, null); });
      return b;
    }
    function answerCard(g, section) {
      var card = el("div", "card");
      card.appendChild(el("span", "card-title", L(g.title)));
      card.appendChild(el("span", "card-sum", L(g.summary)));
      var row = el("div", "row");
      var open = btn("btn-primary small", t("Ver passo a passo", "See step by step"));
      open.addEventListener("click", function () { showGuide(g.id, section, null); });
      row.appendChild(open);
      var cp = copyButton(function () { return deepLink(g.id, section, null); });
      row.appendChild(cp.button);
      card.appendChild(row);
      card.appendChild(cp.note);
      return card;
    }

    // ---- ask
    function getToken() {
      var clientToken = null;
      try { clientToken = localStorage.getItem("apex_client_token") || sessionStorage.getItem("apex_client_token"); } catch (e) { clientToken = null; }
      if (clientToken) { return Promise.resolve(clientToken); }
      if (authUser) { return authUser.getIdToken(); }
      return Promise.reject(new Error("no session"));
    }
    function ask(question) {
      return getToken().then(function (token) {
        return fetch(WORKER_URL + "/api/help/ask", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ question: question, language: currentLang, page_key: "help" })
        });
      }).then(function (res) {
        if (!res.ok) { var e = new Error("status " + res.status); e.status = res.status; throw e; }
        return res.json();
      });
    }
    function renderAnswer(out, r) {
      var ids = (r && Array.isArray(r.guide_ids)) ? r.guide_ids : [];
      var cards = [];
      ids.forEach(function (id) { var g = (typeof id === "string") ? findGuide(id) : null; if (g && cards.length < 3) { cards.push(g); } });
      if (!r || !r.found || !cards.length) {
        var msg = t("Ainda não temos um guia para isso.", "We do not have a guide for that yet.");
        if (r && r.logged === true) { msg += " " + t("Sua pergunta foi anotada.", "Your question was noted."); }
        out.appendChild(el("p", "state", msg));
        return;
      }
      if (typeof r.reply === "string" && r.reply) { out.appendChild(el("p", "reply", r.reply)); }
      cards.forEach(function (g) { out.appendChild(answerCard(g, (r.best && r.best.guide === g.id) ? r.best.section : null)); });
    }
    function setupAsk() {
      var box = byId("searchBox");
      if (!enabled) { box.hidden = true; return; }
      box.hidden = false;
      var form = byId("askForm"), input = byId("askInput"), go = byId("askBtn"), out = byId("answer");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var q = input.value.replace(/^\s+|\s+$/g, "");
        clear(out);
        if (q.length < 3) { out.appendChild(el("p", "state error", t("Escreva pelo menos 3 letras.", "Write at least 3 letters."))); return; }
        go.disabled = true;
        go.setAttribute("aria-busy", "true");
        setAskLabel(true);
        out.appendChild(el("p", "state muted", t("Buscando o guia certo...", "Finding the right guide...")));
        var ready = guides ? Promise.resolve() : loadGuides();
        ready.then(function () { return ask(q); }).then(function (r) { clear(out); renderAnswer(out, r); }, function (err) {
          clear(out);
          var msg = t("Não foi possível buscar agora. Tente de novo.", "Could not search right now. Try again.");
          if (err && err.status === 429) { msg = t("Muitas perguntas em pouco tempo. Tente de novo em alguns minutos.", "Too many questions in a short time. Try again in a few minutes."); }
          if (err && (err.status === 401 || /no session/.test(String(err.message)))) { msg = t("Entre no Apex para fazer perguntas.", "Sign in to Apex to ask questions."); }
          out.appendChild(el("p", "state error", msg));
        }).then(function () {
          go.disabled = false;
          go.removeAttribute("aria-busy");
          setAskLabel(false);
        });
      });
    }

    // ---- the guide view
    function showGuide(id, section, step) {
      openGuide = { id: id, section: section, step: step };
      renderGuideView();
      window.scrollTo(0, 0);
    }
    function closeGuide() {
      openGuide = null;
      try { window.history.replaceState(null, "", "help.html?lang=" + currentLang); } catch (e) { /* history is a courtesy */ }
      renderGuideView();
    }
    function renderGuideView() {
      var view = byId("guideView"), lib = byId("libraryView");
      var g = (openGuide && guides) ? findGuide(openGuide.id) : null;
      if (!openGuide) { view.hidden = true; lib.hidden = false; return; }
      lib.hidden = true; view.hidden = false;
      clear(view);
      var back = btn("btn-quiet back");
      var bi = el("span", "ico");
      bi.innerHTML = ICON_BACK;
      back.appendChild(bi);
      back.appendChild(document.createTextNode(t("Voltar", "Back")));
      back.addEventListener("click", closeGuide);
      view.appendChild(back);
      if (loadState === "loading") { view.appendChild(el("p", "state muted", t("Carregando...", "Loading..."))); return; }
      if (loadState === "error") {
        view.appendChild(el("p", "state error", t("Sem conexão. Tente de novo.", "No connection. Try again.")));
        var retry = btn("btn-primary small", t("Tentar de novo", "Try again"));
        retry.addEventListener("click", loadGuides);
        view.appendChild(retry);
        return;
      }
      if (!g) { view.appendChild(el("p", "state", t("Não encontramos esse guia.", "We could not find that guide."))); return; }
      view.classList.add("fade");
      view.appendChild(el("h1", "guide-title", L(g.title)));
      view.appendChild(el("p", "guide-sum", L(g.summary)));
      var video = g.video ? L(g.video) : "";
      if (typeof video === "string" && /^https:\/\//.test(video)) {
        var v = el("a", "link", t("Ver o vídeo", "Watch the video"));
        v.href = video; v.target = "_blank"; v.rel = "noopener";
        var vp = el("p", "state");
        vp.appendChild(v);
        view.appendChild(vp);
      }
      var hit = null;
      (Array.isArray(g.sections) ? g.sections : []).forEach(function (s) {
        view.appendChild(el("h2", "sec-title", L(s.title)));
        (Array.isArray(s.steps) ? s.steps : []).forEach(function (st) {
          var box = el("div", "step");
          box.appendChild(el("p", "step-text", st.n + ". " + L(st.text)));
          var src = st.image ? imageUrl(L(st.image)) : "";
          if (src) {
            var pb = btn("pic");
            pb.setAttribute("aria-label", t("Ampliar a imagem", "Enlarge the picture"));
            var im = el("img");
            im.loading = "lazy";
            im.alt = L(st.text);
            im.src = src;
            pb.appendChild(im);
            pb.addEventListener("click", function () { openLightbox(src, L(st.text)); });
            box.appendChild(pb);
          }
          if (s.id === openGuide.section && (!openGuide.step || openGuide.step === st.n)) {
            if (!hit) { hit = box; }
            if (openGuide.step) { box.classList.add("hit"); }
          }
          view.appendChild(box);
        });
      });
      var cp = copyButton(function () { return deepLink(g.id, openGuide.section, openGuide.step); });
      var row = el("div", "row");
      row.appendChild(cp.button);
      view.appendChild(row);
      view.appendChild(cp.note);
      if (hit && hit.scrollIntoView) { try { hit.scrollIntoView({ block: "start" }); } catch (e) { /* older engines */ } }
    }

    // ---- picture layer, in the page
    var lightEl = null;
    function openLightbox(src, alt) {
      closeLightbox();
      lightEl = el("div", "light");
      lightEl.setAttribute("role", "dialog");
      lightEl.setAttribute("aria-modal", "true");
      var im = el("img");
      im.src = src; im.alt = alt || "";
      var x = btn("icon-btn");
      x.innerHTML = ICON_CLOSE;
      x.setAttribute("aria-label", t("Fechar", "Close"));
      x.addEventListener("click", function (e) { e.stopPropagation(); closeLightbox(); });
      lightEl.appendChild(im);
      lightEl.appendChild(x);
      lightEl.addEventListener("click", closeLightbox);
      document.body.appendChild(lightEl);
      x.focus();
    }
    function closeLightbox() { if (lightEl && lightEl.parentNode) { lightEl.parentNode.removeChild(lightEl); } lightEl = null; }
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeLightbox(); } });

    // ---- start
    function init() {
      currentLang = pickLanguage();
      setupBanner();
      applyLanguage();
      setupAsk();
      byId("langBtn").addEventListener("click", function () {
        currentLang = currentLang === "en" ? "pt" : "en";
        store("apex_help_lang", currentLang);
        applyLanguage();
        renderList();
        renderGuideView();
        byId("answer").textContent = "";
      });
      if (deep.guide) { openGuide = { id: deep.guide, section: deep.section, step: deep.step }; }
      // The search needs a sign in; staff sign in through Firebase, portal users carry their own token.
      if (enabled && window.firebase && !window.firebase.apps.length) {
        try {
          window.firebase.initializeApp(FIREBASE_CONFIG);
          window.firebase.auth().onAuthStateChanged(function (u) { authUser = u; });
        } catch (e) { /* the search then says to sign in */ }
      }
      loadGuides();
    }
    init();
  </script>
</body>
</html>
