<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <script src="native-bridge.js?v=1786540803"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="mobile.css">
  <script src="pwa.js" defer></script>
  <title>Apex Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface : #f9f7f4;
      --header  : #1a1a1d;
      --gold    : #C9A43A;
      --text    : #1a1a1d;
      --muted   : #6b6660;
      --border  : #e8e2d9;
      --card    : #ffffff;
      --radius  : 10px;
      --shadow  : 0 2px 20px rgba(26,26,29,0.09);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    /* ---------- Header ---------- */
    header {
      background: var(--header);
      height: 64px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-img { height: 34px; width: auto; display: block; }

    .lang-btn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: rgba(201,164,58,0.14); }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 20px;
    }

    /* ---------- Two-piece login layout ---------- */
    .auth-stack {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 28px;
      width: fit-content;
      max-width: min(420px, calc(100vw - 40px));
      min-width: 260px;
    }

    .auth-panel {
      background: rgba(26, 26, 24, 0.62);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 36px 40px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    /* ---------- Logo & wordmark ---------- */
    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 10px;
    }

    .card-logo {
      display: block;
      height: 72px;
      width: auto;
      animation: logoFadeIn 1.6s ease-out forwards;
    }

    @keyframes logoFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-wordmark {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ---------- Shimmer overlay ---------- */
    .logo-shimmer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0; /* hidden by default — only activated when mask-image is supported */
    }

    @supports (-webkit-mask-size: cover) or (mask-size: cover) {
      .logo-shimmer {
        background: linear-gradient(
          105deg,
          transparent 20%,
          rgba(255, 248, 185, 0.65) 50%,
          transparent 80%
        );
        background-size: 300% 100%;
        background-position: 110% center;
        -webkit-mask-image: url('https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png');
        -webkit-mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-image: url('https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png');
        mask-size: contain;
        mask-repeat: no-repeat;
        mask-position: center;
        opacity: 1;
        /* delay 1.8s so shimmer only starts after the 1.6s fade-in completes */
        animation: shimmer 7s ease-in-out 1.8s infinite;
      }
    }

    @keyframes shimmer {
      /* bright band sweeps left-to-right over ~2s, then pauses for ~5s */
      0%   { background-position: 110% center; }
      28%  { background-position: -10% center; }
      100% { background-position: -10% center; }
    }

    /* Google sign-in button */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-google:hover  { opacity: 0.88; }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

    .g-mark {
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 800;
      color: #4285F4;
      line-height: 1;
    }

    .status-msg {
      margin-top: 4px;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .status-msg.is-error { color: #e08585; }

    /* ---------- Client username/password login ---------- */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.22);
    }

    .client-login-panel {
      background: rgba(26, 26, 24, 0.62);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 22px 24px;
    }
    .client-login-panel .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin: 0 0 5px 2px;
      text-align: left;
    }
    .client-login-panel input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      margin-bottom: 14px;
      outline: none;
    }
    .client-login-panel input:focus { border-color: var(--gold); }
    .client-login-panel input::placeholder { color: rgba(255,255,255,0.35); }

    .btn-client-login {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--gold);
      border: 1.5px solid var(--gold);
      border-radius: var(--radius);
      padding: 12px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-client-login:hover  { background: rgba(201,164,58,0.14); }
    .btn-client-login:active { transform: scale(0.98); }
    .btn-client-login:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

    /* ---------- Footer ---------- */
    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- Ken Burns background ---------- */
    @keyframes kenburns {
      from { transform: scale(1.0) translate(0, 0); }
      to   { transform: scale(1.06) translate(1.5%, 0.8%); }
    }

    #bg-image {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: center center;
    }

    #bg-image.is-loaded {
      animation: kenburns 28s ease-in-out infinite alternate;
    }

    #bg-scrim {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background: rgba(26, 26, 24, 0.55);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      #bg-image.is-loaded { animation: none; }
      .card-logo { animation: none; opacity: 1; transform: none; }
      .logo-shimmer { animation: none !important; opacity: 0 !important; }
    }
  </style>
</head>
<body class="lang-pt">

  <div id="bg-image" aria-hidden="true"></div>
  <div id="bg-scrim" aria-hidden="true"></div>
  <script>
  (function () {
    var imgs = ['picture1.jpg','picture2.jpg','Picture3.jpg','Picture4.jpg','Picture5.jpg'];
    var idx = Math.floor(Math.random() * imgs.length);
    var bgEl = document.getElementById('bg-image');
    var scrimEl = document.getElementById('bg-scrim');
    tryLoadImage(idx);

    function tryLoadImage(i) {
      if (i >= imgs.length) { return; }
      var url = 'assets/login/' + imgs[i];
      var img = new Image();
      img.onload = function () {
        bgEl.style.backgroundImage = 'url(' + url + ')';
        bgEl.classList.add('is-loaded');
        scrimEl.style.opacity = '1';
      };
      img.onerror = function () {
        tryLoadImage((i + 1) % imgs.length === idx ? imgs.length : i + 1);
      };
      img.src = url;
    }
  }());
  </script>

  <header>
    <img
      src="https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png"
      alt="Apex Business &amp; Leadership"
      class="logo-img"
    >
    <button class="lang-btn" onclick="toggleLang()">
      <span class="show-pt">EN</span>
      <span class="show-en">PT</span>
    </button>
  </header>

  <main>
    <div class="auth-stack">
      <div class="auth-panel">
        <p class="eyebrow">
          <span class="show-pt">Plataforma Operacional</span>
          <span class="show-en">Operations Platform</span>
        </p>
        <div class="logo-wrap">
          <img
            src="https://apexbusiness.pro/wp-content/uploads/2025/12/LogoApex.png"
            alt="Apex Business &amp; Leadership"
            class="card-logo"
          >
          <div class="logo-shimmer" aria-hidden="true"></div>
        </div>

      <button class="btn-google" id="signInBtn" onclick="handleSignIn()">
        <span class="g-mark">G</span>

      <div class="auth-divider">

      <form class="client-login-panel" id="clientLoginForm" onsubmit="handleClientLogin(event)">

        <input type="text" id="clientUsername" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label class="field-label" for="clientPassword">

        </label>
        <input type="password" id="clientPassword" autocomplete="current-password">
        <button type="submit" class="btn-client-login" id="clientLoginBtn">

    </div>
    <div class="status-msg" id="statusMsg"></div>
  </main>

  <footer>
    <span class="show-pt">&copy; 2025 Apex Business &amp; Leadership. Todos os direitos reservados.</span>
    <span class="show-en">&copy; 2025 Apex Business &amp; Leadership. All rights reserved.</span>
  </footer>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"
    integrity="sha384-5y/1XyjXGriVPCsfTI3ap84Bg9Db2y/GiQjR3nbrVJE03bworx9G08uSJEMme/mI"
    crossorigin="anonymous"></script>
  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"
    integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
    crossorigin="anonymous"></script>
  <script>
    // ── CONFIGURATION ────────────────────────────────────────────────────────
    // Replace every placeholder before deploying.

    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";

    var FIREBASE_CONFIG = {
      apiKey:            "AIzaSyB_OFg5ouKAu61vObNsHJaGQO0TikaIhy8",
      authDomain:        "apex-command-center-4b038.firebaseapp.com",
      projectId:         "apex-command-center-4b038",
      storageBucket:     "apex-command-center-4b038.firebasestorage.app",
      messagingSenderId: "894743550437",
      appId:             "1:894743550437:web:45041f841f7e8196db770c"
    };
    // ─────────────────────────────────────────────────────────────────────────

    // ── Firebase availability guard ─────────────────────────────────────────
    // The two SDK <script> tags above come from gstatic.com. If either fails to
    // load - a bad connection, a captive portal, a blocked CDN - `firebase` is
    // undefined and an unguarded initializeApp() throws on the FIRST statement
    // of this inline script. Everything below it, including the language
    // toggle and the client username/password login, never gets defined, and
    // the page renders as a blank white screen with no way to sign in and no
    // explanation. This was hit on poor mobile signal, not just in the wrapper.
    //
    // So the SDK is probed before it is touched. When it is missing the page
    // still renders and still works for client logins (that path is pure fetch
    // and never needed Firebase); only Google sign-in is unavailable, and it
    // says so. No authentication logic changes and no alternate login path is
    // added - a CDN failure just degrades visibly instead of silently.
    var FIREBASE_READY = false;
    var auth      = null;
    var gProvider = null;

    try {
      if (typeof firebase !== "undefined" && firebase && firebase.initializeApp) {
        firebase.initializeApp(FIREBASE_CONFIG);
        auth      = firebase.auth();
        gProvider = new firebase.auth.GoogleAuthProvider();
        FIREBASE_READY = true;
      }
    } catch (e) {
      // Leaves FIREBASE_READY false. Reported to the user by
      // showFirebaseUnavailable() below, and logged rather than swallowed.
      if (window.console && console.error) {
        console.error("Firebase init failed:", e);
      }
    }

    // Disable the Google button and explain why, in both languages, using the
    // same show-pt/show-en spans the rest of the page uses so the existing
    // language toggle keeps working on this message too.
    function showFirebaseUnavailable() {
      var btn = document.getElementById("signInBtn");
      if (btn) {
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
      }
      var el = document.getElementById("statusMsg");
      if (!el) { return; }
      el.className = "status-msg is-error";
      el.innerHTML =
        '<span class="show-pt">Entrar com Google indisponivel: nao foi possivel ' +
        'carregar o servico de autenticacao. Verifique sua conexao e tente ' +
        'novamente.</span>' +
        '<span class="show-en">Google sign-in unavailable: the authentication ' +
        'service could not be loaded. Check your connection and try again.</span>';
    }

    if (!FIREBASE_READY) {
      // The button lives earlier in the document than this script, so it is
      // already parsed and getElementById finds it without waiting for load.
      showFirebaseUnavailable();
    }

    function toggleLang() {
      var b = document.body;
      if (b.classList.contains("lang-pt")) {
        b.classList.remove("lang-pt");
        b.classList.add("lang-en");
      } else {
        b.classList.remove("lang-en");
        b.classList.add("lang-pt");
      }
    }

    function setStatus(msg, isError) {
      var el = document.getElementById("statusMsg");
      if (!el) { return; }
      el.textContent = msg;
      el.className = "status-msg" + (isError ? " is-error" : "");
    }

    function handleSignIn() {
      // The button is already disabled when the SDK is missing, but a stray
      // programmatic call must not throw on a null auth.
      if (!FIREBASE_READY) { showFirebaseUnavailable(); return; }

      var btn = document.getElementById("signInBtn");
      if (!btn) { return; }
      btn.disabled = true;
      setStatus("...");

      // Only the step that OBTAINS the credential differs between web and app.
      // Inside Capacitor, signInWithPopup cannot work (capacitor://localhost
      // origin, and Google blocks OAuth in embedded webviews), so the native
      // Google SDK runs instead and its credential is placed into this same
      // Firebase JS session. Both branches resolve to a normal UserCredential,
      // so everything below - the ID token, the /api/role call, the role
      // routing - is shared and unchanged, and the browser path is exactly
      // what it was before.
      // Suppress the biometric lock for the duration of the sign-in. The OAuth
      // sheet necessarily backgrounds and resumes the app, and a Face ID prompt
      // landing on top of it would deadlock the very login it protects.
      if (typeof apexSetSignInInFlight === "function") { apexSetSignInInFlight(true); }

      var signInPromise = (typeof apexCanNativeGoogle === "function" && apexCanNativeGoogle())
        ? apexNativeGoogleSignIn(firebase)
        : auth.signInWithPopup(gProvider);

      signInPromise
        .then(function(result) {
          return result.user.getIdToken();
        })
        .then(function(token) {
          return fetch(WORKER_URL + "/api/role", {
            headers: { "Authorization": "Bearer " + token }
          });
        })
        .then(function(res) {
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        })
        .then(function(data) {
          sessionStorage.setItem("apex_role",  data.role);
          sessionStorage.setItem("apex_email", data.email);
          // Client-role Google accounts land in the Client Portal;
          // alice/rafa/developer keep going to the dashboard exactly as before.
          window.location.href = data.role === "client" ? "portal.html" : "dashboard.html";
        })
        .catch(function(e) {
          // Cleared on failure only: a successful sign-in navigates away, which
          // resets the flag with the page. Leaving it set after a cancelled
          // sign-in would silently disable the biometric lock for the session.
          if (typeof apexSetSignInInFlight === "function") { apexSetSignInInFlight(false); }
          btn.disabled = false;
          setStatus((document.body.classList.contains("lang-en")
            ? "Error: " : "Erro: ") + e.message, true);
        });
    }

    // Drop a client password session from this browser. Used when the API
    // rejects a stored token, so an admin is not held in a client identity.
    function clearClientSession() {
      localStorage.removeItem("apex_client_token");
      localStorage.removeItem("apex_client_id");
      localStorage.removeItem("apex_client_name");
    }

    // ── Client username/password login ─────────────────────────────────────
    function handleClientLogin(evt) {
      evt.preventDefault();
      var btn = document.getElementById("clientLoginBtn");
      var username = (document.getElementById("clientUsername").value || "").trim();
      var password = document.getElementById("clientPassword").value || "";
      if (!username || !password) {
        setStatus(document.body.classList.contains("lang-en")
          ? "Enter your username and password." : "Informe usuário e senha.", true);
        return;
      }
      btn.disabled = true;
      setStatus("...");
      fetch(WORKER_URL + "/api/auth/client-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) {
          if (!r.ok) { throw new Error(r.data.error || "Login failed"); }
          localStorage.setItem("apex_client_token", r.data.token);
          localStorage.setItem("apex_client_id",    r.data.client_id);
          localStorage.setItem("apex_client_name",  r.data.client_name || "");
          window.location.href = "portal.html";
        })
        .catch(function(e) {
          btn.disabled = false;
          setStatus(e.message, true);
        });
    }

    // Skip sign-in if already authenticated. The token is VALIDATED before we
    // redirect: a stale/expired client token used to bounce admins straight into
    // the client portal before they could sign in as themselves (hit live by Rafa,
    // 2026-08-03). If the API rejects it, clear it and stay on the login page.
    // GET /api/role is the validation call: it is client-token reachable and
    // returns 401 for any token authenticate() will not accept.
    if (localStorage.getItem("apex_client_token")) {
      fetch(WORKER_URL + "/api/role", {
        headers: { "Authorization": "Bearer " + localStorage.getItem("apex_client_token") }
      })
        .then(function(res) {
          if (res.ok) {
            window.location.href = "portal.html";
          } else {
            clearClientSession();
          }
        })
        .catch(function() {
          clearClientSession();
        });
    }
    // Only the Google/admin path depends on this. With the SDK missing there is
    // no Firebase session to restore, and the client-token check above has
    // already run, so skipping it costs nothing that was reachable anyway.
    if (FIREBASE_READY) {
      auth.onAuthStateChanged(function(user) {
        if (!user) { return; }
        var cached = sessionStorage.getItem("apex_role");
        if (cached) {
          window.location.href = cached === "client" ? "portal.html" : "dashboard.html";
          return;
        }
        // No cached role. On the web this means nothing to do - the user is
        // mid-sign-in and handleSignIn will set it. Inside the app it is the
        // normal state after a force-quit: sessionStorage is gone but the
        // native Firebase session was just restored, so the role has to be
        // re-fetched or the admin would sit on the login page holding a
        // perfectly valid session. Same /api/role call the sign-in path makes.
        if (typeof apexIsNative !== "function" || !apexIsNative()) { return; }
        user.getIdToken().then(function(token) {
          return fetch(WORKER_URL + "/api/role", {
            headers: { "Authorization": "Bearer " + token }
          });
        }).then(function(res) {
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        }).then(function(data) {
          sessionStorage.setItem("apex_role",  data.role);
          sessionStorage.setItem("apex_email", data.email);
          window.location.href = data.role === "client" ? "portal.html" : "dashboard.html";
        }).catch(function() {
          // Restored session is not usable (revoked, offline, role removed).
          // Stay on the login page rather than bouncing into a broken app.
        });
      });

      // Restore the admin session from the native keychain, and put the
      // biometric cover up before it can reveal anything.
      if (typeof apexBootstrapNativeSession === "function") {
        apexBootstrapNativeSession(firebase);
      }
    }
  </script>

  <!-- Mobile nav containers: static HTML on purpose. A previous runtime-
       injected fixed-position nav broke the desktop flex layout, so these
       must exist in the markup from page load. nav.js only fills them in;
       mobile.css alone controls their visibility and positioning. -->
  <div id="mobile-tab-bar"></div>
  <div id="mobile-more-menu"></div>
</body>
</html>
