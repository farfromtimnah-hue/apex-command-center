  <!-- GLOBAL JS ERROR HOOK. Must be the FIRST script on the page, before
       native-bridge.js?v=1788494784, so it is installed before anything that can throw.

       WHY: the log showed "⚡️ JS Eval error A JavaScript exception occurred"
       with no detail, and every downstream symptom (no WIRE-INIT, no WIRE-POLL,
       no replay block, hasListeners=false forever) is consistent with a script
       dying early. Capacitor only prints that generic string, so the actual
       message, file, line and stack have to be captured here.

       Buffers into a cookie as well as the console, because the native log is
       only reachable once the Capacitor plugin exists -- which is exactly what
       may not have happened yet when the error fires. native-bridge.js?v=1788494784 replays
       this buffer into the native log once the plugin appears. -->
  <script>
  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      // Same cookie the trace buffer uses, so one replay surfaces both.
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      // And straight to native if the plugin is already up.
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      // Resource load failures (img/script 404) surface here with no ev.error;
      // they are worth seeing too, since a failed script tag would explain a
      // missing function just as well as a thrown exception.
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface : #f9f7f4;
      --header  : #1a1a1d;
      --gold    : #C9A43A;
      --text    : #1a1a1d;
      --muted   : #6b6660;
      --border  : #e8e2d9;
      --card    : #ffffff;
      --green   : #3f7d4e;
      --amber   : #8a6d1d;
      --red     : #b44040;
      --radius  : 10px;
      --shadow  : 0 2px 20px rgba(26,26,29,0.09);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    header {
      background: var(--header);
      min-height: 56px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-title { color: var(--gold); font-size: 14px; font-weight: 800; letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .hdr-btn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hdr-btn:hover { background: rgba(201,164,58,0.14); }

    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; overflow-x: hidden; }

    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
    .muted { color: var(--muted); }

    .report-hero {
      background: var(--header);
      color: #fff;
      border-radius: 14px;
      padding: 22px 18px;
      margin-bottom: 16px;
    }
    .report-hero h1 { font-size: 20px; font-weight: 800; color: var(--gold); }
    .report-hero .client { font-size: 15px; font-weight: 600; margin-top: 6px; }
    .report-hero .date { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; }

    /* Score hero: the percentage is the headline number (the raw x/50 is
       secondary), followed by the band name and its display range. */
    .score-wrap { text-align: center; margin-bottom: 14px; }
    .score-big { font-size: 44px; font-weight: 800; line-height: 1.1; }
    .score-big .of { font-size: 17px; color: var(--muted); font-weight: 600; }
    .score-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .band-card { border-radius: var(--radius); padding: 14px 16px; border: 1.5px solid; }
    .band-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.3px; }
    .band-range { font-size: 12px; font-weight: 700; opacity: 0.85; margin-bottom: 8px; }
    .band-desc { font-size: 13px; line-height: 1.55; }
    .band-danger  { background: rgba(180,64,64,0.10);  border-color: var(--red);   color: var(--red); }
    .band-warning { background: rgba(201,164,58,0.14); border-color: #c9a43a;      color: var(--amber); }
    .band-success { background: rgba(63,125,78,0.10);  border-color: var(--green); color: var(--green); }

    /* Answered / remaining counters under the hero. */
    .counter-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .counter-box {
      flex: 1 1 120px; text-align: center; padding: 12px 10px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    }
    .counter-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
    .counter-label { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

    .prose-block { margin-bottom: 14px; }
    .prose-block:last-child { margin-bottom: 0; }
    .prose-label {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--muted); margin-bottom: 5px;
    }
    .prose-text { font-size: 13px; line-height: 1.6; }

    /* Distribution counters: Alta Performance / Em Desenvolvimento / Crítico */
    .dist-num-success { color: var(--green); }
    .dist-num-warning { color: var(--amber); }
    .dist-num-danger  { color: var(--red); }

    .plan-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 12px; background: var(--surface);
      break-inside: avoid; page-break-inside: avoid;
    }
    .plan-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .plan-rank { font-size: 13px; font-weight: 800; }
    .plan-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; padding: 3px 8px; border-radius: 10px; }
    .tag-urgente  { background: rgba(180,64,64,0.14);  color: var(--red); }
    .tag-melhoria { background: rgba(201,164,58,0.16); color: var(--amber); }
    .plan-time { font-size: 11px; color: var(--muted); }
    .plan-actions { margin: 8px 0 8px 18px; font-size: 13px; line-height: 1.6; }
    .plan-criterio { font-size: 12px; color: var(--muted); line-height: 1.5; }
    /* Only card #1 is expanded; the rest collapse to their heading so the
       priority reads as a priority instead of four equal-weight blocks. */
    .plan-collapsed .plan-actions, .plan-collapsed .plan-criterio { display: none; }

    .crit-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .crit-row:last-child { border-bottom: none; }
    .crit-name { font-size: 13px; font-weight: 700; }
    .crit-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* Charts — hand-written inline SVG, no library and no CDN (same rule the
       Business X-Ray report follows). Value labels are printed on the chart
       itself because touch has no hover. */
    .chart-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .chart-bar-name { flex: 0 0 40%; font-size: 11px; line-height: 1.3; word-break: break-word; }
    .chart-bar-track { flex: 1 1 auto; }
    .bar-svg { display: block; width: 100%; height: 16px; }
    .chart-axis {
      display: flex; margin-top: 4px; font-size: 10px; color: var(--muted);
    }
    .chart-axis span { flex: 1 1 0; text-align: center; }
    .chart-axis span:first-child { text-align: left; }
    .chart-axis span:last-child { text-align: right; }

    .doughnut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .doughnut-svg { flex: 0 0 auto; width: 150px; height: 150px; }
    .doughnut-legend { flex: 1 1 200px; min-width: 0; }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
    .legend-swatch { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 3px; }

    #stateMsg { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }

    @media print {
      header { display: none; }
      body { background: #fff; }
      main { max-width: none; padding: 0; }
      .report-card { box-shadow: none; margin-bottom: 12px; }
      .report-hero { border-radius: 0; }
      .report-card, .band-card, .plan-card { break-inside: avoid; page-break-inside: avoid; }
      .page-break-before { break-before: page; page-break-before: always; }
      /* Print is the consultant's hand-out: every action card is expanded on
         paper, since nothing can be tapped open there. */
      .plan-collapsed .plan-actions, .plan-collapsed .plan-criterio { display: revert; }
    }

    /* Per-question / per-indicator breakdown rows. */
    .q-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .q-row:last-child { border-bottom: none; }
    .q-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
    .q-name { font-size: 13px; font-weight: 700; line-height: 1.35; }
    .q-pill {
      flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 3px 9px;
      border-radius: 999px; white-space: nowrap;
    }
    .q-text { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 5px; }
    /* Raw score printed beside each bar — a 0-10 or 0-100 axis alone is too
       coarse to read an exact value off. */
    .chart-bar-val {
      flex: 0 0 auto; width: 26px; text-align: right;
      font-size: 12px; font-weight: 700; color: var(--muted);
    }
    /* Caveat line under a chart whose colouring needs explaining. */
    .chart-note {
      font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 10px;
    }
    /* Sub-heading inside a breakdown card (grouped instruments). */
    .group-head {
      font-size: 12px; font-weight: 800; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--muted);
      margin: 18px 0 2px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .q-row + .group-head { margin-top: 14px; }
    .group-head:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  </style>
</head>
<body class="lang-pt">
  <header>

      <button class="hdr-btn" onclick="toggleLang()">PT / EN</button>

    </div>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"

  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"
    integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
    crossorigin="anonymous"></script>
  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";

    var FIREBASE_CONFIG = {
      apiKey:            "AIzaSyB_OFg5ouKAu61vObNsHJaGQO0TikaIhy8",
      authDomain:        "apex-command-center-4b038.firebaseapp.com",
      projectId:         "apex-command-center-4b038",
      storageBucket:     "apex-command-center-4b038.firebasestorage.app",
      messagingSenderId: "894743550437",
      appId:             "1:894743550437:web:45041f841f7e8196db770c"
    };

    var params = new URLSearchParams(window.location.search);
    var CLIENT_ID   = params.get("client");
    var CLIENT_NAME = params.get("name") || localStorage.getItem("apex_client_name") || "";
    var PREVIEW_AS  = params.get("previewAs");

    // Band copy, the tags and the cutoffs ALL live in the Worker
    // (MGMT_CUTOFFS / computeManagementXrayScore) and arrive already applied
    // on score.maturity — this page only maps a colour onto a CSS class.
    var BAND_CLASS = { success: "band-success", warning: "band-warning", danger: "band-danger" };
    var TAG_CLASS  = { "URGENTE": "tag-urgente", "MELHORIA": "tag-melhoria" };
    var TAG_EN     = { "URGENTE": "URGENT", "MELHORIA": "IMPROVEMENT" };

    var currentUser = null;
    var auth = null;
    // Set once loadReport has already fallen back from a rejected client token,
    // so a second 401 shows the error instead of looping.
    var triedFirebaseFallback = false;

    // Drop a client password session from this browser. Used when the API
    // rejects the stored token, so an admin holding a stale client token is
    // not locked out of a report they can legitimately see.
    function clearClientSession() {
      localStorage.removeItem("apex_client_token");
      localStorage.removeItem("apex_client_id");
      localStorage.removeItem("apex_client_name");
    }

    // Bring up Firebase (if init() has not already) and resolve with the
    // signed-in user, or reject when there is no Firebase session to fall
    // back to.
    function firebaseUser() {
      if (currentUser) { return Promise.resolve(currentUser); }
      return new Promise(function(resolve, reject) {
        if (!auth) {
          firebase.initializeApp(FIREBASE_CONFIG);
          auth = firebase.auth();
        }
        auth.onAuthStateChanged(function(user) {
          if (user) { currentUser = user; resolve(user); return; }
          // Momentary null during a token refresh: wait, then decide. See the
          // comment on the boot path below.
          var hadSession = sessionStorage.getItem("apex_role") || localStorage.getItem("apex_client_token");
          if (!hadSession) { reject(new Error("Not authenticated")); return; }
          setTimeout(function() {
            if (auth.currentUser) { currentUser = auth.currentUser; resolve(auth.currentUser); }
            else { reject(new Error("Not authenticated")); }
          }, 1000);
        });
      });
    }

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function isEn() { return document.body.classList.contains("lang-en"); }

    function toggleLang() {
      var b = document.body;
      if (b.classList.contains("lang-pt")) { b.classList.remove("lang-pt"); b.classList.add("lang-en"); }
      else { b.classList.remove("lang-en"); b.classList.add("lang-pt"); }
      // A <title> cannot hold spans, so it carries both languages as data
      // attributes; nav.js applies them and also owns the shared event.
      if (window.apexApplyTitle) { window.apexApplyTitle(); }
      // Announce it, so anything rendered through a ternary (the chart
      // aria-labels) can redraw instead of staying frozen at first render.
      try {
        document.dispatchEvent(new CustomEvent("apex:langchange", {
          detail: { lang: b.classList.contains("lang-en") ? "en" : "pt" }
        }));
      } catch (e) {}
    }

    function goBack() {
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = "portal.html"; }
    }

    function ptEn(pt, en) {
      return '<span class="show-pt">' + pt + '</span><span class="show-en">' + en + '</span>';
    }

    function getToken() {
      var capt = localStorage.getItem("apex_client_token");
      if (capt) { return Promise.resolve(capt); }
      if (currentUser) { return currentUser.getIdToken(); }
      return Promise.reject(new Error("Not authenticated"));
    }

    function apiFetch(path) {
      if (PREVIEW_AS) {
        path += (path.indexOf("?") > -1 ? "&" : "?") + "previewAs=" + encodeURIComponent(PREVIEW_AS);
      }
      return getToken().then(function(token) {
        return fetch(WORKER_URL + path, { headers: { "Authorization": "Bearer " + token } });
      });
    }

    function showMsg(pt, en) {
      var el = document.getElementById("stateMsg");
      el.hidden = false;
      el.innerHTML = ptEn(escHtml(pt), escHtml(en));
      document.getElementById("reportBody").hidden = true;
    }

    // ── Chart 1: "Eficiência por Área (%)" ─────────────────────────────────
    // Two bars — Falhas Operacionais and Erros Estratégicos — each showing
    // that group's OWN health percentage (100 − avg intensity × 10, scoped to
    // the group's 16 or 11 questions, never the 27-question denominator).
    // Flat gray on purpose: these are percentages, not 0-10 answers, so the
    // red/yellow/green band colours would be reading the wrong scale.
    function pctBarSvg(value, hex) {
      var w = (value == null) ? 0 : value;
      return '<svg class="bar-svg" viewBox="0 0 100 12" preserveAspectRatio="none" role="img" aria-label="' +
        (value == null ? "—" : value + "%") + '">' +
        '<rect x="0" y="1" width="100" height="10" rx="2" fill="#efeae2"></rect>' +
        '<rect x="49.7" y="1" width="0.6" height="10" fill="#e0d8cc"></rect>' +
        (w > 0 ? '<rect x="0" y="1" width="' + w + '" height="10" rx="2" fill="' + hex + '"></rect>' : '') +
        '</svg>';
    }

    function groupBarChartHtml(chart) {
      var html = '<div class="report-card">' +
        '<div class="card-title">' + ptEn(escHtml(chart.titlePt), escHtml(chart.titleEn)) + '</div>' +
        '<div class="card-sub">' +
        ptEn("Saúde de cada grupo — quanto maior, menos as falhas daquele grupo aparecem.",
             "Health of each group — the higher the bar, the less that group's failures show up.") + '</div>';
      (chart.bars || []).forEach(function(b) {
        html += '<div class="chart-bar-row">' +
          '<span class="chart-bar-name">' + ptEn(escHtml(b.labelPt), escHtml(b.labelEn)) + '</span>' +
          '<span class="chart-bar-track">' + pctBarSvg(b.value, b.hex) + '</span>' +
          '<span class="chart-bar-val">' + (b.value == null ? "—" : b.value + "%") + '</span>' +
          '</div>';
      });
      html += '<div class="chart-axis" style="margin-left:calc(40% + 8px);">' +
        '<span>0%</span><span>50%</span><span>100%</span></div></div>';
      return html;
    }

    // ── Chart 2: "Distribuição do Resultado" ───────────────────────────────
    // The legacy tool reuses its binary Sim/Não chart here, which does not fit
    // a 0-10 instrument — deliberately NOT ported. This is the same three-band
    // split as the distribution section, inverted like the rest of this
    // instrument (8-10 = Crítico).
    function doughnutSvg(slices, total) {
      var R = 60, C = 2 * Math.PI * R;
      var offset = 0;
      var arcs = "";
      slices.forEach(function(s) {
        if (!s.count) { return; }
        var len = (s.count / total) * C;
        arcs += '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + s.hex + '"' +
          ' stroke-width="26" stroke-dasharray="' + len + ' ' + (C - len) + '"' +
          ' stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 75 75)"></circle>';
        offset += len;
      });
      return '<svg class="doughnut-svg" viewBox="0 0 150 150" role="img" aria-label="' +
        (isEn() ? "Result distribution" : "Distribuição do resultado") + '">' +
        '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="#efeae2" stroke-width="26"></circle>' +
        arcs +
        '<text x="75" y="80" text-anchor="middle" font-size="22" font-weight="800" fill="#1a1a1d">' +
        total + '</text></svg>';
    }

    function doughnutChartHtml(chart) {
      var slices = chart.slices || [];
      var html = '<div class="report-card">' +
        '<div class="card-title">' + ptEn(escHtml(chart.titlePt), escHtml(chart.titleEn)) + '</div>' +
        '<div class="card-sub">' +
        ptEn("Como os " + chart.total + " itens se distribuem entre as faixas de intensidade.",
             "How the " + chart.total + " items spread across the intensity bands.") + '</div>' +
        '<div class="doughnut-wrap">' + doughnutSvg(slices, chart.total) +
        '<div class="doughnut-legend">';
      slices.forEach(function(s) {
        html += '<div class="legend-row">' +
          '<span class="legend-swatch" style="background:' + s.hex + ';"></span>' +
          '<span>' + ptEn(escHtml(s.labelPt), escHtml(s.labelEn)) +
          ' — <strong>' + s.count + '</strong> (' + s.pct + '%)</span></div>';
      });
      html += '</div></div></div>';
      return html;
    }

    function renderReport(d) {
      var s = d.score;
      var o = s.overall;
      var html = "";

      // ── Hero ──
      html += '<div class="report-hero">' +
        '<h1>' + ptEn("Relatório — Raio X Falhas", "Report — Failures X-Ray") + '</h1>' +
        (CLIENT_NAME ? '<div class="client">' + escHtml(CLIENT_NAME) + '</div>' : '') +
        '<div class="date">' + ptEn("Concluído em", "Completed on") + ' ' + escHtml(formatDate(d.completed_at)) + '</div>' +
        '</div>';

      // ── Score hero + band ──
      // Headline is HEALTH, not intensity, so a higher number always reads as
      // better — the raw intensity is shown underneath as the input.
      html += '<div class="report-card">' +
        '<div class="score-wrap">' +
        '<div class="score-big">' + s.health_pct + '%' +
        '<span class="of"> ' + ptEn("de saúde", "health") + '</span></div>' +
        '<div class="score-sub">' +
        ptEn("Intensidade total de falhas: " + s.intensity_total + "/" + s.max_intensity,
             "Total failure intensity: " + s.intensity_total + "/" + s.max_intensity) + '</div>' +
        '</div>' +
        '<div class="band-card ' + (BAND_CLASS[o.color] || "band-warning") + '">' +
        '<div class="band-title">' + ptEn(escHtml(o.labelPt), escHtml(o.labelEn)) + '</div>' +
        '<div class="band-range" style="margin-bottom:0;">' +
        ptEn("Quanto maior a saúde, menos as falhas aparecem na operação",
             "The higher the health, the less failures show up in the operation") + '</div>' +
        '</div></div>';

      // ── Devolutiva + Ação Imediata ──
      html += '<div class="report-card">' +
        '<div class="prose-block">' +
        '<div class="prose-label">' + ptEn("Devolutiva", "Assessment") + '</div>' +
        '<div class="prose-text">' + ptEn(escHtml(o.devolutivaPt), escHtml(o.devolutivaEn)) + '</div></div>' +
        '<div class="prose-block">' +
        '<div class="prose-label">' + ptEn("Ação Imediata", "Immediate Action") + '</div>' +
        '<div class="prose-text">' + ptEn(escHtml(o.acaoImediataPt), escHtml(o.acaoImediataEn)) + '</div></div>' +
        '</div>';

      // ── Per-group summary ──
      var groups = s.groups || [];
      html += '<div class="report-card">' +
        '<div class="card-title">' + ptEn("Saúde por Grupo", "Health by Group") + '</div>' +
        '<div class="card-sub">' +
        ptEn("Cada grupo medido contra o seu próprio número de itens.",
             "Each group measured against its own number of items.") + '</div>' +
        '<div class="counter-row">';
      groups.forEach(function(g) {
        var cls = g.healthPct >= 80 ? "dist-num-success"
                : (g.healthPct >= 50 ? "dist-num-warning" : "dist-num-danger");
        html += '<div class="counter-box"><div class="counter-num ' + cls + '">' + g.healthPct + '%</div>' +
          '<div class="counter-label">' + ptEn(escHtml(g.namePt), escHtml(g.nameEn)) +
          ' (' + g.intensity + '/' + g.maxIntensity + ')</div></div>';
      });
      html += '</div></div>';

      // ── Distribuição do Resultado (3 counters, INVERTED reading) ──
      var dist = s.distribution || { verde: 0, amarelo: 0, vermelho: 0, nao_respondido: 0, total: 27 };
      html += '<div class="report-card">' +
        '<div class="card-title">' + ptEn("Distribuição do Resultado", "Result Distribution") + '</div>' +
        '<div class="card-sub">' +
        ptEn("Neste diagnóstico a leitura é invertida: uma nota ALTA significa que a falha está muito presente.",
             "This diagnostic reads inverted: a HIGH score means the failure is strongly present.") + '</div>' +
        '<div class="counter-row">' +
        '<div class="counter-box"><div class="counter-num dist-num-success">' + dist.verde + '</div>' +
        '<div class="counter-label">' + ptEn("Adequado (0-3)", "Adequate (0-3)") + '</div></div>' +
        '<div class="counter-box"><div class="counter-num dist-num-warning">' + dist.amarelo + '</div>' +
        '<div class="counter-label">' + ptEn("Atenção (4-7)", "Attention (4-7)") + '</div></div>' +
        '<div class="counter-box"><div class="counter-num dist-num-danger">' + dist.vermelho + '</div>' +
        '<div class="counter-label">' + ptEn("Crítico (8-10)", "Critical (8-10)") + '</div></div>' +
        '</div></div>';

      // ── Charts ──
      var charts = s.charts || {};
      if (charts.groupBar)     { html += groupBarChartHtml(charts.groupBar); }
      if (charts.bandDoughnut) { html += doughnutChartHtml(charts.bandDoughnut); }

      // ── Per-question breakdown, split by group (matches the card framing) ──
      html += '<div class="report-card page-break-before">' +
        '<div class="card-title">' + ptEn("Detalhe por Item", "Item Breakdown") + '</div>' +
        '<div class="card-sub">' +
        ptEn("Cada item, sua intensidade e a faixa em que ele caiu.",
             "Each item, its intensity and the band it fell into.") + '</div>';
      groups.forEach(function(g) {
        html += '<div class="group-head">' + ptEn(escHtml(g.namePt), escHtml(g.nameEn)) +
          ' · ' + g.count + ' ' + ptEn("itens", "items") + '</div>';
        (s.questions || []).filter(function(q) { return q.group === g.key; })
          .forEach(function(c, i) {
            html += '<div class="q-row">' +
              '<div class="q-head">' +
              '<span class="q-name">' + (i + 1) + '. ' +
              ptEn(escHtml(c.namePt), escHtml(c.nameEn)) + '</span>' +
              '<span class="q-pill ' + (BAND_CLASS[c.color] || "band-warning") + '">' +
              (c.value == null ? "—" : c.value + "/10") +
              (c.bandLabelPt ? ' · ' + ptEn(escHtml(c.bandLabelPt), escHtml(c.bandLabelEn)) : '') +
              '</span></div></div>';
          });
      });
      html += '</div>';

      html += '<p class="muted" style="font-size:12px;line-height:1.5;">' +
        ptEn("Relatório gerado pelo Raio X Falhas. Os resultados refletem as respostas fornecidas na data de conclusão.",
             "Report generated by the Failures X-Ray. Results reflect the answers given on the completion date.") + '</p>';

      document.getElementById("stateMsg").hidden = true;
      var bodyEl = document.getElementById("reportBody");
      bodyEl.innerHTML = html;
      bodyEl.hidden = false;
    }

    var REPORT_PATH = "/api/clients/" + encodeURIComponent(CLIENT_ID) +
                      "/assessments/falhas_xray";

    function loadReport() {
      apiFetch(REPORT_PATH)
        .then(function(res) {
          // A stale client token in localStorage wins over the Firebase session
          // in getToken(), so an admin with a leftover token gets rejected on a
          // report they can actually see. Clear it and retry once as Firebase
          // before giving up (hit live by Rafa, 2026-08-03).
          // 401/403 is what an expired capt_ token returns. 500 is included on
          // purpose: a token that is not capt_-shaped falls through to Firebase
          // JWT verification in the Worker and fails there as "Malformed JWT",
          // which surfaces as a 500 rather than a 401. Both mean the same thing
          // here -- the stored token is unusable -- and we only ever retry when
          // one is actually present, so a real server error with no client token
          // still shows the error message as before.
          if ((res.status === 401 || res.status === 403 || res.status === 500) &&
              !triedFirebaseFallback && localStorage.getItem("apex_client_token")) {
            triedFirebaseFallback = true;
            clearClientSession();
            return firebaseUser().then(function() { return apiFetch(REPORT_PATH); });
          }
          return res;
        })
        .then(function(res) {
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        })
        .then(function(d) {
          if (d.status !== "completed" || !d.score) {
            showMsg("O Raio X Falhas ainda não foi concluído. O relatório fica disponível após o envio das respostas.",
                    "The Failures X-Ray has not been completed yet. The report becomes available once the answers are submitted.");
            return;
          }
          renderReport(d);
        })
        .catch(function() {
          showMsg("Não foi possível carregar o relatório. Verifique sua conexão e seu acesso.",
                  "Could not load the report. Check your connection and your access.");
        });
    }

    function init() {
      if (!CLIENT_ID) {
        showMsg("Cliente não informado.", "No client specified.");
        return;
      }
      // Password-based portal clients carry a capt_ token in localStorage;
      // admins and Google-linked clients authenticate via Firebase.
      if (localStorage.getItem("apex_client_token")) {
        loadReport();
        return;
      }
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      auth.onAuthStateChanged(function(user) {
        if (!user) {
          var hadSession = sessionStorage.getItem("apex_role") || localStorage.getItem("apex_client_token");
          if (hadSession) {
            // WAIT, THEN EITHER BOOT OR BAIL -- never neither.
            //
            // Firebase reports a momentary null user during a token refresh
            // and then restores the session. The old code only handled the
            // bad outcome: if the user came back within the second it did
            // NOTHING, and because this branch returns, the page never
            // booted and never navigated. It sat on "Carregando..." forever,
            // and a refresh replayed the same race -- only retyping the URL
            // and logging in again cleared it.
            //
            // Same fix as dashboard.html; see the comment there.
            setTimeout(function() {
              if (!auth.currentUser) {
                showMsg("Faça login para ver o relatório.", "Sign in to view the report.");
                return;
              }
              // Session came back. Boot the page the callback skipped.
              currentUser = auth.currentUser;
              loadReport();
            }, 1000);
            return;
          }
          showMsg("Faça login para ver o relatório.", "Sign in to view the report.");
          return;
        }
        currentUser = user;
        loadReport();
      });
    }

    init();
  </script>
</body>
</html>
