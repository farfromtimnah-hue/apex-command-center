        h += '<div class="story-narr">' + narrativeHtml(focus) + '</div>';
      }
      if (summ) {
        h += '<p class="plan-label">' + ptEn("O resumo", "The summary") + '</p>';
        h += '<div class="story-narr">' + narrativeHtml(summ) + '</div>';
      }
      h += '<a class="step-link" href="sessions.html?from=prep&prepClient=' + encodeURIComponent(CLIENT_ID) + '&prepType=' + encodeURIComponent(MEETING_TYPE) + '&open=' + encodeURIComponent(ls.session_id) +
           '" target="_blank" rel="noopener">' +
           ptEn("Abrir onde o resumo desta sess&#227;o ser&#225; escrito",
                "Open where this session's summary gets written") + '</a>';
      h += '</div>';
      return h;
    }

    // 7 Where the engagement stands. Week 2 of 4 and week 2 of 26 are the
    // same number and opposite situations; that framing is the whole point.
    function renderEngagement(d) {
      var e = d.engagement;
      if (!e) { return ""; }
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Onde o contrato est&#225;", "Where the engagement stands") + '</p>';
      h += '<p class="load-line">' +
           ptEn('Semana <span class="num">' + e.week + '</span> de ' + e.total_weeks +
                ', no pacote ' + escHtml(e.package) + '.',
                'Week <span class="num">' + e.week + '</span> of ' + e.total_weeks +
                ', on the ' + escHtml(e.package) + ' package.') + '</p>';
      h += '<p class="load-sub">' +
           ptEn(escHtml("Começou em " + e.started_at + ". Faltam " + e.days_left + " dias."),
                escHtml("Started " + e.started_at + ". " + e.days_left + " days remaining.")) +
           '</p>';
      var pct = e.duration_days ? Math.round((e.day / e.duration_days) * 100) : 0;
      if (pct > 100) { pct = 100; }
      h += '<div class="load-bar"><span style="width:' + pct + '%;"></span></div>';
      h += '</div>';
      return h;
    }
    // ---- CYCLE CLOSE ------------------------------------------------------
    // The formal 30-day close, read aloud. It runs at 30 days even inside a
    // 180-day programme, so it is a checkpoint, not the end of the engagement.

    // Before and after: this month against the previous one where it exists.
    function renderBeforeAfter(d) {
      var cy = d.cycle;
      if (!cy) { return ""; }
      var list = cy.indicators || [];
      if (!list.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Antes e depois", "Before and after") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn(escHtml(cy.month + (cy.prev_month ? ", ao lado de " + cy.prev_month + "." : ".")),
                escHtml(cy.month + (cy.prev_month ? ", alongside " + cy.prev_month + "." : "."))) +
           '</p>';

      for (var i = 0; i < list.length; i++) {
        var x = list[i];
        var name = isEn() ? (x.label_en || x.label_pt) : (x.label_pt || x.label_en);
        var done = (x.realizado === null || x.realizado === undefined)
          ? null : fmtInd(x.realizado, x.type);

        h += '<div class="ba-row"><span class="ba-name">' + escHtml(name) + '</span>';
        h += '<span class="ba-now">' +
             (done === null ? ptEn("sem registro", "nothing logged")
                            : ptEn("feito ", "done ") + done) +
             ' / ' + ptEn("meta ", "goal ") + fmtInd(x.meta_mensal, x.type) + '</span>';
        // The previous month only where it exists. No zero stands in for a
        // month that was never tracked.
        if (x.prev_realizado !== null && x.prev_realizado !== undefined) {
          h += '<span class="ba-prev">' +
               ptEn("m&#234;s anterior: ", "previous month: ") +
               fmtInd(x.prev_realizado, x.type) + '</span>';
        }
        h += '</div>';
      }
      h += '</div>';
      return h;
    }

    // What was built: assets the business now HAS. Explicitly not revenue --
    // a month of real structural work can sit beside a flat month of sales,
    // and a revenue scoreboard at the close would call that a failure.
    function renderBuilt(d) {
      var cy = d.cycle;
      var a = cy && cy.assets;
      if (!a) { return ""; }

      var docs = a.documents || [];
      var asmts = a.assessments || [];
      var rows = [];

      if (a.goals_set) {
        rows.push(numRow(a.goals_set,
          ptEn("metas definidas no m&#234;s", "targets set this month")));
      }
      if (a.processos_documentados) {
        rows.push(numRow(a.processos_documentados,
          ptEn("processos documentados", "processes documented")));
      }
      if (a.completed_days) {
        rows.push(numRow(a.completed_days,
          ptEn("dias de registro completos", "complete log days")));
      }
      if (docs.length) {
        var dl = '<div class="built-row"><span class="built-n">' + docs.length + '</span> ' +
                 '<span class="built-label">' +
                 ptEn("documentos criados", "documents created") + '</span><ul class="built-list">';
        for (var i = 0; i < docs.length; i++) {
          dl += '<li>' + escHtml(docs[i].title || "") + '</li>';
        }
        dl += '</ul></div>';
        rows.push(dl);
      }
      if (asmts.length) {
        var al = '<div class="built-row"><span class="built-n">' + asmts.length + '</span> ' +
                 '<span class="built-label">' +
                 ptEn("avalia&#231;&#245;es conclu&#237;das", "assessments completed") +
                 '</span><ul class="built-list">';
        for (var j = 0; j < asmts.length; j++) {
          al += '<li>' + escHtml(isEn() ? asmts[j].labelEn : asmts[j].labelPt) + '</li>';
        }
        al += '</ul></div>';
        rows.push(al);
      }

      // Nothing to show rather than an empty state.
      if (!rows.length) { return ""; }

      return '<div class="card"><p class="sec-title">' +
             ptEn("O que foi constru&#237;do", "What was built") + '</p>' +
             '<p class="step-ctx">' +
             ptEn("O que a empresa passou a ter, e que n&#227;o tinha antes.",
                  "What the business now has that it did not have before.") +
             '</p>' + rows.join("") + '</div>';
    }

    function numRow(n, labelHtml) {
      return '<div class="built-row"><span class="built-n">' + n + '</span> ' +
             '<span class="built-label">' + labelHtml + '</span></div>';
    }

    // What is still weak: the indicators that ended the month furthest behind,
    // plus any X-Ray area still critical.
    function renderStillWeak(d) {
      var cy = d.cycle;
      if (!cy) { return ""; }
      var weak = cy.weak || [];
      var areas = cy.critical_areas || [];
      if (!weak.length && !areas.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O que ainda est&#225; fraco", "What is still weak") + '</p>';

      for (var i = 0; i < weak.length; i++) { h += indicatorLine(weak[i]); }

      if (areas.length) {
        h += '<div class="divider">' + ptEn("No Raio-X", "In the X-Ray") + '</div>';
        for (var j = 0; j < areas.length; j++) {
          var a = areas[j];
          var name = isEn() ? (a.nameEn || a.namePt || a.key) : (a.namePt || a.nameEn || a.key);
          h += '<div class="ind-row"><span class="ind-name">' + escHtml(name) + '</span>';
          if (typeof a.pct === "number") {
            h += ' &middot; <span class="s-crit">' + Math.round(a.pct / 10) + '/10</span>';
          }
          h += '</div>';
        }
      }
      h += '</div>';
      return h;
    }

    // Next cycle: the monthly cycle repeats here, on the same portal goals
    // screen the kickoff uses, with the same read-only note.
    function renderNextCycle(d) {
      if (!d.cycle) { return ""; }
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O pr&#243;ximo ciclo", "Next cycle") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("As metas do m&#234;s que vem.", "Next month's targets.") + '</p>';
      h += '<a class="step-link" href="' + clientHref("&modal=fieldconfig") +
           '" target="_blank" rel="noopener">' +
           ptEn("Definir as metas do pr&#243;ximo m&#234;s", "Set next month's targets") + '</a>';
      h += '<span class="step-note">' +
           ptEn("Na ficha do cliente, que &#233; onde grava.",
                "On the client page, which is where it saves.") + '</span>';
      h += '</div>';
      return h;
    }

    // ---- KICKOFF: the target sequence -------------------------------------
    // 26 fields in his fixed order, grouped by pillar, each labelled with
    // where its number comes from. The derived ones carry the WORKING, not
    // just the answer: he says these out loud and has miscalculated in front
    // of a client.
    function kindTag(kind) {
      if (kind === "asked") {
        return '<span class="tag t-asked">' + ptEn("perguntado", "asked") + '</span>';
      }
      if (kind === "derived") {
        return '<span class="tag t-derived">' + ptEn("derivado", "derived") + '</span>';
      }
      if (kind === "external") {
        return '<span class="tag t-ext">' + ptEn("buscar fora", "look up") + '</span>';
      }
      return '<span class="tag t-imposed">' + ptEn("padr&#227;o Apex", "Apex standard") + '</span>';
    }

    function seqRow(f) {
      var name = isEn() ? (f.label_en || f.label_pt) : (f.label_pt || f.label_en);
      var h = '<div class="seq-row">';
      h += '<div class="seq-head"><span class="seq-name">' + escHtml(name) + '</span>' +
           kindTag(f.kind) + '</div>';

      if (f.kind === "asked") {
        // The anchor is always the client's own number. Never suggest one.
        h += '<p class="seq-ask">&#8220;' +
             escHtml(isEn() ? (f.ask_en || f.ask_pt) : (f.ask_pt || f.ask_en)) + '&#8221;</p>';
        if (f.current !== null && f.current !== undefined) {
          h += '<p class="seq-val">' + ptEn("j&#225; definido: ", "already set: ") +
               '<span class="ind-num">' + fmtInd(f.current, f.type) + '</span></p>';
        }
      } else if (f.kind === "derived") {
        var formula = isEn() ? (f.formula_en || f.formula_pt) : (f.formula_pt || f.formula_en);
        h += '<p class="seq-formula">' + escHtml(formula) + '</p>';
        if (f.working_pt) {
          // The arithmetic with the real numbers in it, which is the line he
          // reads aloud.
          h += '<p class="seq-work">' + escHtml(f.working_pt) + '</p>';
        } else {
          h += '<p class="seq-pending">' +
               ptEn("Depende dos n&#250;meros que o cliente ainda vai dar.",
                    "Depends on numbers the client has not given yet.") + '</p>';
        }
      } else if (f.kind === "external") {
        // Google Reviews: he currently leaves the app to look this up.
        if (f.current !== null && f.current !== undefined) {
          h += '<p class="seq-val">' + ptEn("meta atual: ", "current target: ") +
               '<span class="ind-num">' + fmtInd(f.current, f.type) + '</span></p>';
        }
        h += '<p class="seq-lookup">' +
             escHtml(isEn() ? (f.lookup_en || f.lookup_pt) : (f.lookup_pt || f.lookup_en)) +
             '</p>';
        h += '<p class="seq-pending">' +
             ptEn("Avalia&#231;&#245;es do Google: n&#227;o registrado.",
                  "Google reviews: not recorded.") +
             '</p>';
      } else {
        h += '<p class="seq-std">' +
             escHtml(isEn() ? (f.standard_en || f.standard_pt) : (f.standard_pt || f.standard_en)) +
             ' &middot; <span class="ind-num">' + fmtInd(f.value, f.type) + '</span></p>';
      }
      h += '</div>';
      return h;
    }

    function renderKickoffSequence(d) {
      var k = d.kickoff;
      if (!k || !k.sequence || !k.sequence.length) { return ""; }
      var pillars = k.pillars || [];

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("As metas, na ordem", "The targets, in order") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Vinte e seis campos, na ordem em que ele preenche. A &#226;ncora de receita &#233; sempre o n&#250;mero do cliente.",
                "Twenty-six fields, in the order he fills them. The revenue anchor is always the client's own number.") +
           '</p>';

      for (var p = 0; p < pillars.length; p++) {
        var pil = pillars[p];
        var rows = [];
        for (var i = 0; i < k.sequence.length; i++) {
          if (k.sequence[i].pillar === pil.key) { rows.push(k.sequence[i]); }
        }
        if (!rows.length) { continue; }
        h += '<div class="divider">' +
             escHtml(isEn() ? pil.nameEn : pil.namePt) + '</div>';
        for (var r = 0; r < rows.length; r++) { h += seqRow(rows[r]); }
      }
      h += '</div>';
      return h;
    }

    // The daily-log walkthrough: the most scriptable beat in the meeting. He
    // walks every indicator asking today's value and enforces entering zeros.
    function renderWalkthrough(d) {
      var k = d.kickoff;
      if (!k || !k.walkthrough || !k.walkthrough.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O primeiro registro, indicador por indicador",
                   "The first daily log, indicator by indicator") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Ele pergunta o valor de hoje para cada um. Zero &#233; um valor: precisa ser digitado, n&#227;o pulado.",
                "He asks today's value for each. Zero is a value: it gets typed, not skipped.") +
           '</p>';
      h += '<a class="step-link" href="' + clientHref("&day=" + encodeURIComponent(k.today)) +
           '" target="_blank" rel="noopener">' +
           ptEn("Abrir o registro de hoje", "Open today's entry") + '</a>';
      h += '<span class="step-note">' + linkNoteReadOnly() + '</span>';

      h += '<div style="margin-top:12px;">';
      for (var i = 0; i < k.walkthrough.length; i++) {
        var w = k.walkthrough[i];
        h += '<div class="wt-row"><span class="wt-n">' + (i + 1) + '</span>' +
             escHtml(isEn() ? (w.label_en || w.label_pt) : (w.label_pt || w.label_en)) +
             '</div>';
      }
      h += '</div></div>';
      return h;
    }

    // What he asks that the system already knows, so the meeting does not open
    // with questions the screen can answer.
    function renderKnownToday(d) {
      var k = d.kickoff;
      var s = k && k.snapshot;
      if (!s) { return ""; }
      var g = k.goals || {};
      var rows = [];

      rows.push(kvItem(ptEn("Metas do m&#234;s", "Targets for the month"),
        g.all_set
          ? ptEn(escHtml("todas as " + g.goalable + " definidas"), escHtml("all " + g.goalable + " set"))
          : ptEn(escHtml(g.with_meta + " de " + g.goalable), escHtml(g.with_meta + " of " + g.goalable))));

      if (s.has_entry) {
        if (s.receita !== null) {
          rows.push(kvItem(ptEn("Entrou hoje", "In today"), fmtInd(s.receita, "currency")));
        }
        if (s.saida !== null) {
          rows.push(kvItem(ptEn("Saiu hoje", "Out today"), fmtInd(s.saida, "currency")));
        }
        if (s.leads_gerados !== null) {
          rows.push(kvItem(ptEn("Leads hoje", "Leads today"), String(s.leads_gerados)));
        }
      } else {
        rows.push(kvItem(ptEn("Registro de hoje", "Today's entry"),
          ptEn("ainda n&#227;o preenchido", "not filled in yet")));
      }

      rows.push(kvItem(ptEn("Pipeline aberto", "Open pipeline"),
        s.pipeline_count
          ? escHtml(s.pipeline_count + " / $" + Math.round(s.pipeline_total))
          : ptEn("nenhum lead aberto", "no open leads")));

      rows.push(kvItem(ptEn("Raio-X", "X-Ray"), k.has_xray
        ? ptEn("conclu&#237;do", "completed")
        : ptEn("sem Raio-X conclu&#237;do", "none completed")));

      // Two more facts, in the same list and the same shape as the rest. An
      // unrecorded value is stated as unrecorded and nothing more -- this page
      // is read with the client in the room, and a line about what the system
      // cannot do would be about us rather than about them.
      rows.push(kvItem(ptEn("Tabela de pre&#231;os", "Price table"),
        ptEn("n&#227;o registrada", "not recorded")));
      rows.push(kvItem(ptEn("App na tela inicial", "App on home screen"),
        ptEn("n&#227;o registrado", "not recorded")));

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O que o sistema j&#225; responde", "What the system already answers") + '</p>';
      h += '<div class="kv">' + rows.join("") + '</div>';
      h += '</div>';
      return h;
    }

    function kvItem(labelHtml, valueHtml) {
      return '<div class="kv-item"><div class="kv-label">' + labelHtml +
             '</div><div class="kv-value">' + valueHtml + '</div></div>';
    }

    // Every portal link is READ-ONLY for staff. Any non-GET carrying
    // previewAs is rejected by the Worker before it reaches a route, which is
    // exactly what bit Rafa live: "eu nao vou dar, so a leitura, voce so
    // consigo ler." Where a writable staff screen exists the link goes there
    // instead; where none exists the link still goes to the portal, and says
    // so on the link so he knows BEFORE he clicks.
    function linkNoteReadOnly() {
      return ptEn("Somente leitura. Para alterar, use a tela da equipe.",
                  "Read-only. To change anything, use the staff screen.");
    }

    // ---- CYCLE CLOSE: the client speaks first ------------------------------
    // Both closings invert the agenda for it: the client speaks first, by
    // name, one at a time.
    function renderVoiceFirst(d) {
      var cy = d.cycle;
      if (!cy) { return ""; }
      var names = cy.attendees || [];

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Primeiro, eles falam", "First, they speak") + '</p>';
      h += '<p class="ask-line">' +
           ptEn("&#8220;Quero come&#231;ar ouvindo de voc&#234;s como que foi para voc&#234;s essa jornada.&#8221;",
                "&#8220;I want to start by hearing from you how this journey was for you.&#8221;") +
           '</p>';
      if (names.length) {
        h += '<p class="step-ctx">' +
             ptEn("Um de cada vez, pelo nome.", "One at a time, by name.") + '</p>';
        for (var i = 0; i < names.length; i++) {
          h += '<div class="voice-row"><span class="voice-name">' + escHtml(names[i]) + '</span>' +
               '<span class="voice-space"></span></div>';
        }
      }
      h += '</div>';
      return h;
    }

    // The document he reads aloud, section by section, in Mariel's order.
    function renderCloseDoc(d) {
      var cy = d.cycle;
      if (!cy || !cy.sections || !cy.sections.length) { return ""; }
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O documento, na ordem", "The document, in order") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Ele l&#234; em voz alta, se&#231;&#227;o por se&#231;&#227;o.",
                "He reads it aloud, section by section.") + '</p>';
      for (var i = 0; i < cy.sections.length; i++) {
        var s = cy.sections[i];
        h += '<div class="doc-row"><span class="doc-n">' + (i + 1) + '</span>' +
             escHtml(isEn() ? s.nameEn : s.namePt) + '</div>';
      }
      h += '</div>';
      return h;
    }

    // The before/after number, PRE-FETCHED. In every closing he stops and asks
    // for it and the client digs through their phone while the room waits.
    function renderGrowth(d) {
      var cy = d.cycle;
      var ba = cy && cy.before_after;
      if (!ba || !ba.rows || !ba.rows.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O antes e o depois, j&#225; calculado", "Before and after, already computed") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn(escHtml("Base: " + ba.baseline_month + ", início do contrato em " + ba.baseline_date + ". Comparado com " + ba.current_month + "."),
                escHtml("Baseline: " + ba.baseline_month + ", engagement started " + ba.baseline_date + ". Compared with " + ba.current_month + ".")) +
           '</p>';
      for (var i = 0; i < ba.rows.length; i++) {
        var r = ba.rows[i];
        var name = isEn() ? (r.label_en || r.label_pt) : (r.label_pt || r.label_en);
        h += '<div class="ba-row"><span class="ba-name">' + escHtml(name) + '</span>';
        h += '<span class="ba-prev">' + fmtInd(r.was, r.type) + '</span>';
        h += '<span class="ba-now">&#8594; ' + fmtInd(r.now, r.type) + '</span>';
        if (r.growth_pct !== null && r.growth_pct !== undefined) {
          var up = r.inverse ? (r.growth_pct < 0) : (r.growth_pct > 0);
          h += '<span class="ba-growth ' + (up ? "s-good" : "s-crit") + '">' +
               (r.growth_pct > 0 ? "+" : "") + r.growth_pct + '%</span>';
        }
        h += '</div>';
      }
      h += '</div>';
      return h;
    }

    // A shortfall on Apex's side. He does acknowledge these, so there is a
    // slot for it rather than a page that pretends the cycle was flawless.
    function renderShortfall(d) {
      if (!d.cycle) { return ""; }
      return '<div class="card"><p class="sec-title">' +
             ptEn("O que ficou devendo do nosso lado", "Where we fell short") + '</p>' +
             '<p class="ask-line">' +
             ptEn("&#8220;Tivemos alguns dessabores que talvez n&#227;o foi como voc&#234;s gostariam. A gente pede desculpa mais uma vez.&#8221;",
                  "&#8220;There were some rough patches that maybe were not how you would have wanted. We apologise again.&#8221;") +
             '</p><p class="step-ctx">' +
             ptEn("Nomear o que foi, antes que eles precisem trazer.",
                  "Name what it was, before they have to raise it.") +
             '</p><div class="voice-row"><span class="voice-space"></span></div></div>';
    }

    // The financial settlement, read verbatim.
    function renderSettlement(d) {
      var cy = d.cycle;
      var st = cy && cy.settlement;
      if (!st) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O acerto financeiro", "The financial settlement") + '</p>';
      if (!st.known) {
        h += '<div class="step-fact">' +
             '<span class="step-fact-label">' + ptEn("Termos do contrato", "Engagement terms") + '</span>' +
             '<span class="step-fact-value">' + ptEn("n&#227;o registrados", "not recorded") + '</span>' +
             '</div></div>';
        return h;
      }
      var rows = [];
      if (st.total !== null && st.total !== undefined) {
        rows.push(kvItem(ptEn("Valor", "Amount"), "$" + st.total));
      }
      if (st.installment_count && st.installment_amount) {
        rows.push(kvItem(ptEn("Parcelas", "Instalments"),
          escHtml(st.installment_count + " x $" + st.installment_amount)));
      }
      if (st.first_due_date) {
        rows.push(kvItem(ptEn("Data", "Date"), escHtml(st.first_due_date)));
      }
      if (st.method) { rows.push(kvItem(ptEn("Forma", "Method"), escHtml(st.method))); }
      if (st.payee)  { rows.push(kvItem(ptEn("Para", "Payee"), escHtml(st.payee))); }
      h += '<div class="kv">' + rows.join("") + '</div></div>';
      return h;
    }

    // The forward plan for a period he will NOT be present for, with the
    // arithmetic already done rather than worked out aloud in the room.
    function renderForward(d) {
      var cy = d.cycle;
      if (!cy) { return ""; }
      var list = cy.indicators || [];
      if (!list.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Os pr&#243;ximos 90 dias", "The next 90 days") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Tr&#234;s meses no ritmo do m&#234;s que fechou. A conta j&#225; est&#225; feita.",
                "Three months at the pace of the month just closed. The arithmetic is already done.") +
           '</p>';
      for (var i = 0; i < list.length; i++) {
        var x = list[i];
        if (x.realizado === null || x.realizado === undefined) { continue; }
        var name = isEn() ? (x.label_en || x.label_pt) : (x.label_pt || x.label_en);
        var three = Math.round(x.realizado * 3 * 100) / 100;
        h += '<div class="ind-row"><span class="ind-name">' + escHtml(name) + '</span> &middot; ' +
             escHtml(String(x.realizado)) + ' x 3 = <span class="ind-num">' +
             fmtInd(three, x.type) + '</span></div>';
      }
      h += '</div>';
      return h;
    }

    // ---- Os planos --------------------------------------------------------
    // On the two types where a package actually gets sold, and nowhere else:
    // the X-Ray results meeting, and the 30-day close. A Start client
    // finishing 30 days is exactly who upgrades, and the gap between $997 and
    // the six-month programme is where Apex loses people. Kickoff and the
    // weekly RDE are clients who have already bought.
    //
    // No checkboxes. WHICH packages he shows is decided live on the packages
    // screen itself, by striking cards through in front of the client -- not
    // committed to here, hours earlier, in preparation.
    function renderPlans(d) {
      var t = d.meeting_type;
      if (t !== "xray_results" && t !== "fechamento") { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Os planos", "The plans") + '</p>';
      h += '<p class="step-ctx">' +
           (t === "fechamento"
             ? ptEn("Os tr&#234;s pacotes, na tela que o cliente v&#234;. Quem termina 30 dias &#233; exatamente quem sobe de pacote.",
                    "The three packages, on the screen the client sees. A client finishing 30 days is exactly who moves up a package.")
             : ptEn("Os tr&#234;s pacotes, na tela que o cliente v&#234;.",
                    "The three packages, on the screen the client sees.")) +
           '</p>';
      h += '<a class="step-link primary" href="packages.html" target="_blank" rel="noopener">' +
           ptEn("Abrir a tela de pacotes", "Open the packages screen") + '</a>';
      h += '<span class="step-note">' +
           ptEn("Abre em outra aba, para mostrar ao cliente.",
                "Opens in a new tab, to show the client.") + '</span>';

      // Recording WHICH package was sold happens here, after the deck -- never
      // on packages.html, which the client is watching. A control there would
      // read as ringing him up mid-conversation, and every click on that page
      // already advances the reveal.
      //
      // Two steps on purpose: assigning a package re-stamps package_started_at
      // in the Worker, which restarts the engagement clock. That is not
      // something a single mis-tap should do while he is talking.
      var cur = (d.client && d.client.package) || "";
      h += '<div class="pkg-pick">';
      h += '<p class="sec-title" style="margin-top:18px;">' +
           ptEn("Fechou?", "Closed?") + '</p>';
      h += '<p class="step-ctx">' +
           (cur
             ? ptEn("Pacote atual: <strong>" + escHtml(cur) + "</strong>.",
                    "Current package: <strong>" + escHtml(cur) + "</strong>.")
             : ptEn("Nenhum pacote definido ainda.", "No package set yet.")) +
           '</p>';
      for (var pi = 0; pi < PACKAGE_NAMES.length; pi++) {
        var nm = PACKAGE_NAMES[pi];
        var isCur = (cur === nm);
        h += '<button type="button" class="step-link pkg-btn' + (isCur ? ' pkg-cur' : '') +
             '" data-pkg="' + escHtml(nm) + '" onclick="pkgPick(this);">' +
             escHtml(nm) + (isCur ? ' &#10003;' : '') + '</button>';
      }
      h += '<span class="step-note" id="pkgNote">' +
           ptEn("Toque para escolher. Ele pergunta antes de gravar.",
                "Tap to choose. It asks before saving.") + '</span>';
      h += '</div>';
      h += '</div>';
      return h;
    }

    // The three current names, matching what the clients table already holds
    // (START / GROWTH / ADVANCED). Legacy values on older rows -- Sprint,
    // Raio-X, Premium -- are left alone rather than migrated.
    var PACKAGE_NAMES = ["ADVANCED", "GROWTH", "START"];
    var pkgPending = null;

    function pkgPick(btn) {
      var name = btn.getAttribute("data-pkg");
      var note = document.getElementById("pkgNote");
      if (pkgPending !== name) {
        // First tap arms it and says plainly what the second tap will do.
        pkgPending = name;
        var all = document.querySelectorAll(".pkg-btn");
        for (var i = 0; i < all.length; i++) { all[i].classList.remove("pkg-arm"); }
        btn.classList.add("pkg-arm");
        if (note) {
          note.innerHTML = ptEn(
            "Toque em <strong>" + escHtml(name) + "</strong> de novo para gravar. Isso reinicia a contagem do pacote.",
            "Tap <strong>" + escHtml(name) + "</strong> again to save. This restarts the package clock.");
        }
        return;
      }
      pkgPending = null;
      btn.classList.remove("pkg-arm");
      if (note) { note.innerHTML = ptEn("Gravando...", "Saving..."); }
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID), {
        method: "PATCH",
        body: JSON.stringify({ package: name })
      }).then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      }).then(function() {
        if (note) { note.innerHTML = ptEn("Gravado.", "Saved."); }
        return loadPrep(true);
      }).catch(function() {
        if (note) {
          note.innerHTML = ptEn("N&#227;o foi poss&#237;vel gravar.", "Could not save.");
        }
      });
    }

    // ---- Custom agenda ------------------------------------------------------
    // The picker screen for "Outra reuniao": every block we have, ticked on or
    // off, plus whatever he has built himself. Rendered above the meeting so he
    // can change his mind mid-call without leaving the page.
    function renderAgendaPicker() {
      var chosen = (prepAgenda && prepAgenda.blocks) || [];
      var h = '<div class="card">';
      h += '<p class="sec-title">' + ptEn("Monte a reuni&#227;o", "Build the meeting") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Marque o que voc&#234; vai usar. Muda a qualquer momento, at&#233; durante a reuni&#227;o.",
                "Tick what you will use. Change it any time, even mid-meeting.") + '</p>';

      if (prepTemplates.length) {
        h += '<p class="sec-title" style="margin-top:14px;">' +
             ptEn("Modelos salvos", "Saved templates") + '</p>';
        for (var t = 0; t < prepTemplates.length; t++) {
          h += '<button type="button" class="step-link agenda-tpl" onclick="agendaUseTemplate(' + t + ');">' +
               escHtml(prepTemplates[t].name || "-") + '</button>';
        }
      }

      h += '<div class="agenda-list">';
      for (var i = 0; i < BLOCK_REGISTRY.length; i++) {
        var b = BLOCK_REGISTRY[i];
        var on = chosen.indexOf(b.key) > -1;
        h += '<label class="agenda-item"><input type="checkbox" data-block="' +
             escHtml(b.key) + '"' + (on ? ' checked' : '') +
             ' onchange="agendaToggle(this);"> <span>' + ptEn(b.pt, b.en) + '</span></label>';
      }
      // His own blocks sit in the same list as ours -- once it works, it is not
      // a lesser kind of block.
      for (var j = 0; j < customBlocks.length; j++) {
        var cb = customBlocks[j];
        var ck = "custom:" + cb.id;
        var con = chosen.indexOf(ck) > -1;
        h += '<label class="agenda-item"><input type="checkbox" data-block="' +
             escHtml(ck) + '"' + (con ? ' checked' : '') +
             ' onchange="agendaToggle(this);"> <span>' + escHtml(cb.title) +
             ' <em class="agenda-mine">' + ptEn("seu", "yours") + '</em></span></label>';
      }
      h += '</div>';

      h += '<button type="button" class="step-link primary" onclick="builderOpen();">' +
           ptEn("N&#227;o achou? Crie o bloco", "Not there? Build the block") + '</button>';
      h += '<span class="step-note">' +
           ptEn("Funciona agora, nesta reuni&#227;o. Depois a gente constr&#243;i direito.",
                "It works now, in this meeting. We build it properly afterwards.") + '</span>';
      h += '<span class="step-note" id="agendaNote"></span>';
      h += '</div>';
      return h;
    }

    function agendaToggle(el) {
      var key = el.getAttribute("data-block");
      if (!prepAgenda) { prepAgenda = { blocks: [] }; }
      var i = prepAgenda.blocks.indexOf(key);
      if (el.checked && i === -1) { prepAgenda.blocks.push(key); }
      if (!el.checked && i > -1)  { prepAgenda.blocks.splice(i, 1); }
      saveAgenda(false, null);
      renderCustomBody();
    }

    function agendaUseTemplate(idx) {
      var t = prepTemplates[idx];
      if (!t) { return; }
      prepAgenda = { blocks: (t.blocks || []).slice() };
      saveAgenda(false, null);
      loadPrep(true);
    }

    function saveAgenda(asTemplate, name) {
      var note = document.getElementById("agendaNote");
      return apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/prep-agenda", {
        method: "PUT",
        body: JSON.stringify({
          blocks: (prepAgenda && prepAgenda.blocks) || [],
          save_as_template: !!asTemplate,
          name: name || null
        })
      }).then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        if (note && asTemplate) {
          note.innerHTML = ptEn("Modelo salvo.", "Template saved.");
        }
        return true;
      }).catch(function () {
        if (note) { note.innerHTML = ptEn("N&#227;o foi poss&#237;vel salvar.", "Could not save."); }
      });
    }

    // ---- The block builder --------------------------------------------------
    // Google Forms, cut down to what a consultant needs mid-meeting: a title, a
    // field, a type, and options when the type needs them.
    function builderOpen() {
      builderFields = [{ label: "", type: "text", options: [] }];
      builderTitleVal = "";
      builderRender();
    }

    function builderRender() {
      var wrap = document.getElementById("builderWrap");
      if (!wrap) { return; }
      var h = '<div class="card builder">';
      h += '<p class="sec-title">' + ptEn("Novo bloco", "New block") + '</p>';
      h += '<input class="builder-title" id="builderTitle" placeholder="' +
           ptEnAttr("T&#237;tulo do bloco", "Block title") + '" value="' +
           escHtml(builderTitleVal) + '" oninput="builderTitleVal = this.value;">';

      for (var i = 0; i < builderFields.length; i++) {
        var f = builderFields[i];
        h += '<div class="builder-field">';
        h += '<input class="builder-label" data-i="' + i + '" placeholder="' +
           ptEnAttr("Pergunta", "Question") + '" value="' + escHtml(f.label) +
             '" oninput="builderSetLabel(this);">';
        h += '<select class="builder-type" data-i="' + i + '" onchange="builderSetType(this);">';
        for (var t = 0; t < FIELD_TYPES.length; t++) {
          h += '<option value="' + FIELD_TYPES[t].key + '"' +
               (f.type === FIELD_TYPES[t].key ? ' selected' : '') + '>' +
               // <option> text is not markup either -- the two-span trick
               // concatenates both languages into "Texto curtoShort text".
               ptEnAttr(FIELD_TYPES[t].pt, FIELD_TYPES[t].en) + '</option>';
        }
        h += '</select>';
        if (f.type === "choice" || f.type === "multichoice" || f.type === "checkbox") {
          h += '<input class="builder-opts" data-i="' + i + '" placeholder="' +
           ptEnAttr("Op&#231;&#245;es, separadas por v&#237;rgula", "Options, comma separated") +
               '" value="' + escHtml((f.options || []).join(", ")) +
               '" oninput="builderSetOptions(this);">';
        }
        h += '<button type="button" class="builder-del" onclick="builderRemove(' + i + ');">&#215;</button>';
        h += '</div>';
      }

      h += '<button type="button" class="step-link" onclick="builderAdd();">' +
           ptEn("+ Campo", "+ Field") + '</button>';
      h += '<button type="button" class="step-link primary" onclick="builderSave();">' +
           ptEn("Usar nesta reuni&#227;o", "Use in this meeting") + '</button>';
      h += '<span class="step-note" id="builderNote"></span>';
      h += '</div>';
      wrap.innerHTML = h;
      wrap.hidden = false;
      var ti = document.getElementById("builderTitle");
      if (ti) { ti.focus(); }
    }

    function builderAdd() {
      builderFields.push({ label: "", type: "text", options: [] });
      builderRender();
    }
    function builderRemove(i) {
      builderFields.splice(i, 1);
      if (!builderFields.length) { builderFields.push({ label: "", type: "text", options: [] }); }
      builderRender();
    }
    function builderSetLabel(el) {
      builderFields[Number(el.getAttribute("data-i"))].label = el.value;
    }
    function builderSetType(el) {
      builderFields[Number(el.getAttribute("data-i"))].type = el.value;
      builderRender();
    }
    function builderSetOptions(el) {
      var parts = el.value.split(",");
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var v = parts[i].replace(/^\s+|\s+$/g, "");
        if (v) { out.push(v); }
      }
      builderFields[Number(el.getAttribute("data-i"))].options = out;
    }

    function builderSave() {
      var note  = document.getElementById("builderNote");
      var title = ((document.getElementById("builderTitle") || {}).value || builderTitleVal || "").replace(/^\s+|\s+$/g, "");
      var fields = [];
      for (var i = 0; i < builderFields.length; i++) {
        if (builderFields[i].label) { fields.push(builderFields[i]); }
      }
      if (!title) {
        if (note) { note.innerHTML = ptEn("Falta o t&#237;tulo.", "Needs a title."); }
        return;
      }
      if (!fields.length) {
        if (note) { note.innerHTML = ptEn("Adicione pelo menos uma pergunta.", "Add at least one question."); }
        return;
      }
      if (note) { note.innerHTML = ptEn("Gravando...", "Saving..."); }

      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/prep-blocks", {
        method: "POST",
        body: JSON.stringify({ title: title, fields: fields })
      }).then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      }).then(function (d) {
        var wrap = document.getElementById("builderWrap");
        if (wrap) { wrap.hidden = true; wrap.innerHTML = ""; }
        // Straight into the agenda -- he built it because he needs it NOW.
        if (!prepAgenda) { prepAgenda = { blocks: [] }; }
        prepAgenda.blocks.push("custom:" + d.block.id);
        // loadPrep re-renders the page, which rebuilds #builderWrap and would
        // wipe the prompt if it were asked first. Reload, THEN ask -- the one
        // question we get to ask has to survive to be seen.
        return saveAgenda(false, null).then(function () {
          return loadPrep(true);
        }).then(function () {
          askTemplate(d.block.title);
        });
      }).catch(function () {
        if (note) { note.innerHTML = ptEn("N&#227;o foi poss&#237;vel gravar.", "Could not save."); }
      });
    }

    // One question, and only one. A second -- who is this template for -- is
    // the friction that loses him mid-meeting.
    function askTemplate(name) {
      var wrap = document.getElementById("builderWrap");
      if (!wrap) { return; }
      wrap.innerHTML =
        '<div class="card">' +
        '<p class="sec-title">' + ptEn("Guardar?", "Keep it?") + '</p>' +
        '<p class="step-ctx">' +
        ptEn("Foi s&#243; para hoje, ou &#233; uma reuni&#227;o que se repete?",
             "Was this just for today, or is it a meeting you run again?") + '</p>' +
        '<button type="button" class="step-link" onclick="templateAnswer(false);">' +
        ptEn("S&#243; hoje", "Just today") + '</button>' +
        '<button type="button" class="step-link primary" onclick="templateAnswer(true);">' +
        ptEn("Salvar como modelo", "Save as a template") + '</button>' +
        '</div>';
      wrap.hidden = false;
      window.__tplName = name || "";
    }

    function templateAnswer(yes) {
      var wrap = document.getElementById("builderWrap");
      if (!yes) {
        if (wrap) { wrap.hidden = true; wrap.innerHTML = ""; }
        return;
      }
      saveAgenda(true, window.__tplName || "Sem nome").then(function () {
        if (wrap) { wrap.hidden = true; wrap.innerHTML = ""; }
        return loadPrep(true);
      });
    }

    // ---- Rendering a block he built ----------------------------------------
    function renderCustomBlock(cb) {
      var a = cb.answers || {};
      var h = '<div class="card"><p class="sec-title">' + escHtml(cb.title) + '</p>';
      for (var i = 0; i < cb.fields.length; i++) {
        var f = cb.fields[i];
        var v = a[f.key];
        h += '<div class="cb-field">';
        h += '<label class="cb-label">' + escHtml(f.label) + '</label>';
        if (f.type === "textarea") {
          h += '<textarea class="cb-in" data-b="' + escHtml(cb.id) + '" data-f="' + escHtml(f.key) +
               '" onchange="customAnswer(this);">' + escHtml(v || "") + '</textarea>';
        } else if (f.type === "choice" || f.type === "yesno") {
          var opts = f.type === "yesno" ? ["sim", "não"] : (f.options || []);
          h += '<select class="cb-in" data-b="' + escHtml(cb.id) + '" data-f="' + escHtml(f.key) +
               '" onchange="customAnswer(this);"><option value="">&#8212;</option>';
          for (var o = 0; o < opts.length; o++) {
            h += '<option' + (v === opts[o] ? ' selected' : '') + '>' + escHtml(opts[o]) + '</option>';
          }
          h += '</select>';
        } else if (f.type === "multichoice" || f.type === "checkbox") {
          var picked = String(v || "").split(", ");
          for (var m = 0; m < (f.options || []).length; m++) {
            var opt = f.options[m];
            h += '<label class="cb-opt"><input type="checkbox" data-b="' + escHtml(cb.id) +
                 '" data-f="' + escHtml(f.key) + '" value="' + escHtml(opt) + '"' +
                 (picked.indexOf(opt) > -1 ? ' checked' : '') +
                 ' onchange="customAnswerMulti(this);"> ' + escHtml(opt) + '</label>';
          }
        } else {
          h += '<input class="cb-in" type="' + (f.type === "number" ? "number" : "text") +
               '" data-b="' + escHtml(cb.id) + '" data-f="' + escHtml(f.key) +
               '" value="' + escHtml(v || "") + '" onchange="customAnswer(this);">';
        }
        h += '</div>';
      }
      h += '<span class="step-note" id="cbNote-' + escHtml(cb.id) + '"></span>';
      h += '</div>';
      return h;
    }

    function customAnswer(el) {
      var bid = el.getAttribute("data-b");
      var key = el.getAttribute("data-f");
      var cb = null;
      for (var i = 0; i < customBlocks.length; i++) {
        if (customBlocks[i].id === bid) { cb = customBlocks[i]; }
      }
      if (!cb) { return; }
      cb.answers = cb.answers || {};
      cb.answers[key] = el.value;
      saveCustomAnswers(cb);
    }

    function customAnswerMulti(el) {
      var bid = el.getAttribute("data-b");
      var key = el.getAttribute("data-f");
      var boxes = document.querySelectorAll('input[type=checkbox][data-b="' + bid + '"][data-f="' + key + '"]');
      var on = [];
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].checked) { on.push(boxes[i].value); }
      }
      var cb = null;
      for (var j = 0; j < customBlocks.length; j++) {
        if (customBlocks[j].id === bid) { cb = customBlocks[j]; }
      }
      if (!cb) { return; }
      cb.answers = cb.answers || {};
      cb.answers[key] = on.join(", ");
      saveCustomAnswers(cb);
    }

    function saveCustomAnswers(cb) {
      var note = document.getElementById("cbNote-" + cb.id);
      if (note) { note.innerHTML = ptEn("Salvando...", "Saving..."); }
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) +
               "/prep-blocks/" + encodeURIComponent(cb.id) + "/answers", {
        method: "PUT",
        body: JSON.stringify({ answers: cb.answers || {} })
      }).then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        if (note) { note.innerHTML = ptEn("Salvo.", "Saved."); }
      }).catch(function () {
        if (note) { note.innerHTML = ptEn("N&#227;o foi poss&#237;vel salvar.", "Could not save."); }
      });
    }

    // Re-render only the meeting body when a checkbox changes, so ticking a
    // block does not throw away anything he has already typed elsewhere.
    function renderCustomBody() {
      var el = document.getElementById("customBody");
      if (!el || !prepData) { return; }
      el.innerHTML = renderCustomBlocks(prepData);
    }

    function renderCustomBlocks(d) {
      var chosen = (prepAgenda && prepAgenda.blocks) || [];
      var h = "";
      for (var i = 0; i < chosen.length; i++) {
        var key = chosen[i];
        if (key.indexOf("custom:") === 0) {
          var id = key.slice(7);
          for (var c = 0; c < customBlocks.length; c++) {
            if (customBlocks[c].id === id) { h += renderCustomBlock(customBlocks[c]); }
          }
          continue;
        }
        for (var r = 0; r < BLOCK_REGISTRY.length; r++) {
          if (BLOCK_REGISTRY[r].key === key) {
            var fn = window[BLOCK_REGISTRY[r].fn];
            if (typeof fn === "function") {
              try { h += fn(d); } catch (e) { /* a block that cannot render must not take the meeting down */ }
            }
          }
        }
      }
      return h;
    }

    // Field types he can choose when building a block, Google Forms style.
    var FIELD_TYPES = [

    var prepTemplates = [];

    var MEETING_TYPES = [
      { type: "xray_results", built: true,

        pt: "Outra reuni&#227;o",   en: "Another meeting" }
    ];

    function renderPicker(d) {
      var c = (d && d.client) || {};
      var h = '<div class="card">';
      h += '<h1 class="pick-name">' + escHtml(c.name || "") + '</h1>';
      h += '<p class="pick-ask">' +
           ptEn("Qual &#233; esta reuni&#227;o?", "Which meeting is this?") + '</p>';

      for (var i = 0; i < MEETING_TYPES.length; i++) {
        var t = MEETING_TYPES[i];
        h += '<div class="pick-row">';
        if (t.built) {
          h += '<a class="pick-go" href="meeting-prep.html?client=' +
               encodeURIComponent(CLIENT_ID) + '&type=' + encodeURIComponent(t.type) + '">' +
               ptEn(t.pt, t.en) + '</a>';

          // results meeting, so offering it on the kickoff row would be a lie.

    // ---- 10 Resultado ----------------------------------------------------
    // The moment he actually resolves the lead, so the decision belongs here
    // as well as on the client page. Reuses POST /api/clients/:id/lead-outcome
    // -- the same single handler the client page posts to, not a second path.
    // Shown only while status is 'lead': on an active client it makes no sense.
    function renderOutcome(d) {
      var c = d.client || {};
      if (String(c.status || "") !== "lead") { return ""; }

      var h = '<div class="card" id="outcomeCard"><p class="sec-title">' +
              ptEn("Resultado", "Outcome") + '</p>';
      h += '<p class="out-sub">' +
           ptEn("Como esta reuni&#227;o terminou?", "How did this meeting end?") + '</p>';
      h += '<div class="out-actions">';
      h += '<button type="button" class="out-btn primary" onclick="openConvert()">' +
           ptEn("Virou cliente", "Became a client") + '</button>';
      // NOT "lost": Rafa works this list to revive them, so it is worded as a
      // return-to later, not as a rejection.
      h += '<button type="button" class="out-btn" onclick="markDormant()">' +
           ptEn("Ainda n&#227;o, retomar depois", "Not yet, come back to them") + '</button>';
      h += '</div>';

      // The package picker, hidden until "became a client" is chosen: a
      // package is required for the converted outcome.
      h += '<div class="out-pick" id="outPick" hidden>';
      h += '<p class="out-sub" style="margin-bottom:6px;">' +
           ptEn("Qual pacote?", "Which package?") + '</p>';
      h += '<select id="outPackage"><option value="">' +
           ptEnAttr("-- Pacote --", "-- Package --") + '</option></select> ';
      h += '<button type="button" class="out-btn primary" onclick="confirmConvert()">' +
           ptEn("Confirmar", "Confirm") + '</button>';
      h += '</div>';

      h += '<div class="out-state" id="outState"></div>';
      h += '</div>';
      return h;
    }

    var outPackagesLoaded = false;

    function openConvert() {
      var pick = document.getElementById("outPick");
      if (pick) { pick.hidden = false; }
      setOutState("", "");
      if (outPackagesLoaded) { return; }
      // Same live package source the client page's convert modal uses.
      apiFetch("/api/settings/packages")
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var pkgs = data.packages || [];
          if (!pkgs.length) { return; }
          outPackagesLoaded = true;
          var newPkgs    = pkgs.filter(function(p) { return p.sort_order !== null && p.sort_order < 1; });
          var legacyPkgs = pkgs.filter(function(p) { return !(p.sort_order !== null && p.sort_order < 1); });
          var html = '<option value="">' + ptEnAttr("-- Pacote --", "-- Package --") + '</option>';
          for (var i = 0; i < newPkgs.length; i++) {
            html += '<option value="' + escHtml(newPkgs[i].short_name) + '">' +
                    escHtml(newPkgs[i].short_name) + '</option>';
          }
          if (newPkgs.length && legacyPkgs.length) {
            html += '<option value="" disabled>----- Legacy / Legado -----</option>';
          }
          for (var j = 0; j < legacyPkgs.length; j++) {
            html += '<option value="' + escHtml(legacyPkgs[j].short_name) + '">' +
                    escHtml(legacyPkgs[j].short_name) + '</option>';
          }
          var sel = document.getElementById("outPackage");
          if (sel) { sel.innerHTML = html; }
        })
        .catch(function() { /* the static placeholder option stays in the DOM */ });
    }

    function setOutState(pt, en) {
      var el = document.getElementById("outState");
      if (!el) { return; }
      el.innerHTML = (pt || en) ? ptEn(pt, en) : "";
    }

    function confirmConvert() {
      var sel = document.getElementById("outPackage");
      var pkg = sel ? sel.value : "";
      if (!pkg) {
        setOutState("Escolha um pacote.", "Choose a package.");
        return;
      }
      postOutcome({ outcome: "converted", "package": pkg });
    }

    function markDormant() {
      postOutcome({ outcome: "dormant" });
    }

    // Reports what happened and leaves the page usable. Deliberately no
    // redirect: he is mid-meeting and moving him elsewhere would lose the prep.
    function postOutcome(payload) {
      setOutState("Salvando...", "Saving...");
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/lead-outcome", {
        method: "POST",
        body: JSON.stringify(payload)
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.error) { throw new Error(data.error); }
          var card = document.getElementById("outcomeCard");
          if (!card) { return; }
          var msg;
          if (payload.outcome === "converted") {
            msg = ptEn(
              "Virou cliente, no pacote " + escHtml(payload["package"]) + ".",
              "Now a client, on the " + escHtml(payload["package"]) + " package."
            );
          } else {
            msg = ptEn(
              "Marcado para retomar depois. Fica em Consolidados, em Leads para reativar.",
              "Marked to come back to. It sits under Consolidados, in leads to reactivate."
            );
          }
          card.innerHTML = '<p class="sec-title">' + ptEn("Resultado", "Outcome") +
                           '</p><div class="out-done">' + msg + '</div>';
          // Keep the cached copy honest so a language toggle re-render, which
          // rebuilds from prepData, does not resurrect the buttons.
          if (prepData && prepData.client) {
            prepData.client.status = (payload.outcome === "converted") ? "active" : "lead_dormant";
          }
        })
        .catch(function(e) {
          setOutState("N&#227;o foi poss&#237;vel salvar: " + escHtml(e.message),
                      "Could not save: " + escHtml(e.message));
        });
    }

    function render(d) {
      var body = document.getElementById("prepBody");
      if (!body) { return; }
      var h = "";
      if (!HAS_TYPE) {
        body.innerHTML = renderPicker(d);
        body.hidden = false;
        var pm = document.getElementById("stateMsg");
        if (pm) { pm.hidden = true; }
        return;
      }
      // Every type opens on the same header. What sits between differs, and
      // three things are now scoped to the meetings they belong to:
      //
      //   bottleneck  xray_results only. It is the opener for a PROSPECT,
      //               asked before a diagnosis is revealed. Asking an existing
      //               client what their bottleneck is, in week 6, is a
      //               question he should already be able to answer.
      //   stories     xray_results and fechamento. They help someone decide to
      //               buy; that work is done once they are a client, and the
      //               close is the other moment a package is sold.
      //   Os planos   the same two, for the same reason.
      h += renderHead(d);

      if (d.meeting_type === "kickoff") {
        h += renderKnownToday(d);
        h += renderKickoff(d);
        h += renderKickoffSequence(d);
        h += renderWalkthrough(d);
      } else if (d.meeting_type === "rde_semanal") {
        h += renderLastSession(d);
        h += renderWeeklyIndicators(d);
        h += renderWeekCard(d);
        h += renderGold(d);
        h += renderStrategic(d);
        h += renderEngagement(d);
      } else if (d.meeting_type === "fechamento") {
        h += renderVoiceFirst(d);
        h += renderCloseDoc(d);
        h += renderGrowth(d);
        h += renderBeforeAfter(d);
        h += renderBuilt(d);
        h += renderStillWeak(d);
        h += renderShortfall(d);
        h += renderSettlement(d);
        h += renderForward(d);
        h += renderNextCycle(d);
        h += renderEngagement(d);
        h += renderStories(d);
      } else if (d.meeting_type === "custom") {
        // He picks the blocks; we render exactly those and nothing else. The
        // picker stays on the page so he can change it mid-call.
        h += renderAgendaPicker();
        h += '<div id="builderWrap" hidden></div>';
        h += '<div id="customBody">' + renderCustomBlocks(d) + '</div>';
      } else {
        h += renderBefore(d);
        h += renderBottleneck(d);
        h += renderOwnerLoad(d);
        h += renderScores(d);
        h += renderQuestions(d);
        h += renderStories(d);
        h += renderAssets(d);
      }

      // The foot of the page, in the order the meeting ends: he shows the
      // packages, closes, records the answer, and only THEN is there anything
      // to do afterwards.
      if (d.meeting_type !== "custom") {
        h += renderPlans(d);
        if (d.meeting_type === "xray_results") {
          h += renderOutcome(d);
        }
        h += renderChecklist(d.meeting_type, d);
      }
      body.innerHTML = h;
      body.hidden = false;
      var msg = document.getElementById("stateMsg");
      if (msg) { msg.hidden = true; }
      wireBottleneck();
      // The week has its own endpoint and its own navigation, so it loads
      // after the page is in the DOM.
      if (d.meeting_type === "rde_semanal") { loadWeek(); }
    }

    // Autosave on blur, debounced. A save that changes the text re-ranks the
    // stories, so the page reloads its data rather than leaving stale order.
    function wireBottleneck() {
      var box = document.getElementById("bottleneckBox");
      if (!box) { return; }
      box.addEventListener("blur", function() {
        if (saveTimer) { clearTimeout(saveTimer); }
        saveTimer = setTimeout(saveBottleneck, 400);
      });
    }

    function setSaveState(pt, en) {
      var el = document.getElementById("saveState");
      if (!el) { return; }
      el.innerHTML = ptEn(escHtml(pt), escHtml(en));
    }

    function saveBottleneck() {
      var box = document.getElementById("bottleneckBox");
      if (!box) { return; }
      var txt = box.value;
      if (txt === lastSaved) { return; }
      setSaveState("Salvando...", "Saving...");
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/meeting-prep/bottleneck", {
        method: "PUT",
        body: JSON.stringify({ bottleneck: txt, meeting_type: MEETING_TYPE })
      }).then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      }).then(function() {
        lastSaved = txt;
        setSaveState("Salvo. As hist&#243;rias foram reordenadas.", "Saved. Stories reordered.");
        return loadPrep(true);
      }).catch(function() {
        setSaveState("N&#227;o foi poss&#237;vel salvar.", "Could not save.");
      });
    }

    // The custom type needs its agenda before it can render anything, so that
    // fetch is chained ahead of the prep load rather than racing it.
    function loadAgenda() {
      if (MEETING_TYPE !== "custom") { return Promise.resolve(); }
      return apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/prep-agenda")
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (d) {
          if (!d) { return; }
          prepAgenda    = d.agenda || { blocks: [] };
          prepTemplates = d.templates || [];
          customBlocks  = d.custom_blocks || [];
        })
        .catch(function () { prepAgenda = prepAgenda || { blocks: [] }; });
    }

    function loadPrep(quiet) {
      return loadAgenda().then(function () {
      return apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) +
                      "/meeting-prep?type=" + encodeURIComponent(MEETING_TYPE))
        .then(function(res) {
          if (res.status === 403) { throw new Error("forbidden"); }
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        })
        .then(function(data) {
          prepData = data;
          // Preserve what he is typing: a background reload after a save must
          // never overwrite the textarea under his cursor.
          var box = document.getElementById("bottleneckBox");
          var live = box ? box.value : null;
          render(data);
          if (quiet && live !== null) {
            var nb = document.getElementById("bottleneckBox");
            if (nb) { nb.value = live; }
          }
        })
        .catch(function(err) {
          if (quiet) { return; }
          if (err && err.message === "forbidden") {
            showMsg("Esta p&#225;gina &#233; apenas para a equipe.", "This page is staff only.");
          } else {
            showMsg("N&#227;o foi poss&#237;vel carregar a prepara&#231;&#227;o.", "Could not load the meeting prep.");
          }
        });
      });
    }

    function init() {
      if (!CLIENT_ID) {
        showMsg("Cliente n&#227;o informado.", "No client specified.");
        return;
      }
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      auth.onAuthStateChanged(function(user) {
        if (!user) {
          var hadSession = sessionStorage.getItem("apex_role");
          if (hadSession) {
            // WAIT, THEN EITHER BOOT OR BAIL -- never neither.
            //
            // Firebase reports a momentary null user during a token refresh
            // and then restores the session. The old code only handled the
            // bad outcome: if the user came back within the second it did
            // NOTHING, and because this branch returns, the page never
            // booted and never navigated. It sat on "Carregando..." forever,
            // and a refresh replayed the same race -- only retyping the URL
            // and logging in again cleared it.
            //
            // Same fix as dashboard.html; see the comment there.
            setTimeout(function() {
              if (!auth.currentUser) {
                window.location.href = "index.html";
                return;
              }
              // Session came back. Boot the page the callback skipped.
              currentUser = auth.currentUser;
              loadPrep(false);
            }, 1000);
            return;
          }
          window.location.href = "index.html";
          return;
        }
        currentUser = user;
        loadPrep(false);
      });
    }

    window.onload = function() {
      init();
    };
  </script>
</body>
