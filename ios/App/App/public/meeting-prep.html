  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      // Same cookie the trace buffer uses, so one replay surfaces both.
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      // And straight to native if the plugin is already up.
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      // Resource load failures (img/script 404) surface here with no ev.error;
      // they are worth seeing too, since a failed script tag would explain a
      // missing function just as well as a thrown exception.
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();

  <script src="native-bridge.js?v=1788492136"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=1">
  <script src="datetime.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #f9f7f4;
      --header: #1a1a1d;
      --gold: #C9A43A;
      --gold-dim: rgba(201,164,58,0.14);
      --text: #1a1a1d;
      --muted: #6b6660;
      --border: #e8e2d9;
      --card: #ffffff;
      --radius: 10px;
      --shadow: 0 2px 16px rgba(26,26,29,0.08);
      --navy: #14243D;
      --good: #2d6a4f;
      --warn: #8a6d1d;
      --crit: #b44040;
    }

    * { box-sizing: border-box; }

    /* The language toggle. Without these two rules every ptEn() pair renders
       both languages at once and the PT/EN button appears to do nothing. */
    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    /* Without this the page renders black text on a dark ground. */
    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--header);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .header-logo { height: 26px; width: auto; display: block; }
    .header-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #fff; white-space: nowrap;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .hdr-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.28);
      color: #fff; font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.1); }

    main { max-width: 940px; margin: 0 auto; padding: 24px 20px 80px; }

    #stateMsg { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px; margin-bottom: 16px;
    }

    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
    }

    /* 1 Header block */
    .prep-name { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
    .prep-meta { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .prep-confid {
      font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
      padding-top: 10px; margin-top: 12px;
    }

    /* example=1 label: one quiet line, muted, no banner and no colour block. */
    .example-line { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

    .kv { display: flex; flex-wrap: wrap; gap: 10px 28px; }
    .kv-item { min-width: 130px; }
    .kv-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
    }
    .kv-value { font-size: 15px; font-weight: 600; }

    .constraint {
      border-left: 3px solid var(--warn); padding: 8px 0 8px 12px;
      margin-bottom: 10px; font-size: 14px;
    }
    .constraint:last-child { margin-bottom: 0; }
    .constraint-src { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

    textarea.bottleneck {
      width: 100%; min-height: 110px; resize: vertical;
      font-family: inherit; font-size: 15px; line-height: 1.55; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
    }
    textarea.bottleneck:focus { outline: none; border-color: var(--gold); background: #fff; }
    .ask-line {
      font-size: 15px; font-weight: 500; color: var(--text);
      background: var(--gold-dim); border-radius: 8px;
      padding: 10px 12px; margin: 0 0 10px;
    }
    .save-state { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 14px; }

    /* Owner load */
    .load-line { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 0 0 10px; }
    .load-line .num { color: var(--navy); font-weight: 800; }
    .load-sub { font-size: 12px; color: var(--muted); margin: 0; }
    .load-bar { height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; margin: 12px 0 8px; }
    .load-bar span { display: block; height: 100%; background: var(--navy); border-radius: 5px; }

    /* Scores */
    details.block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); margin-bottom: 16px; }
    details.block > summary {
      list-style: none; cursor: pointer; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    .sum-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .sum-hint { font-size: 11px; color: var(--muted); font-weight: 500; }
    .block-body { padding: 0 20px 20px; }

    .area { padding: 14px 0; border-top: 1px solid var(--border); }
    .area:first-child { border-top: none; padding-top: 0; }
    .area-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .area-name { font-size: 15px; font-weight: 700; }
    .area-score { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .bar { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; }
    .bar span { display: block; height: 100%; border-radius: 4px; }
    .area-ev { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
    .s-good { color: var(--good); } .fill-good { background: var(--good); }
    .s-warn { color: var(--warn); } .fill-warn { background: var(--warn); }
    .s-crit { color: var(--crit); } .fill-crit { background: var(--crit); }
    .positive {
      margin-top: 16px; padding: 14px; background: var(--gold-dim);
      border-radius: 8px; font-size: 14px; line-height: 1.6;
    }
    .positive-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--warn); display: block; margin-bottom: 4px;
    }

    /* Area drill-down, from score_json.action_plan */
    details.area-d { border: none; }
    details.area-d > summary { list-style: none; cursor: pointer; }
    details.area-d > summary::-webkit-details-marker { display: none; }
    .area-more {
      font-size: 11px; font-weight: 600; color: var(--muted);
      margin-top: 8px; display: inline-block;
    }
    details.area-d[open] > summary .area-more-shut { display: none; }
    details.area-d:not([open]) > summary .area-more-open { display: none; }
    .plan { margin-top: 12px; padding: 14px; background: var(--surface); border-radius: 8px; }
    .plan-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .plan-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; color: #fff; background: var(--crit);
    }
    .plan-tag.t-warn { background: var(--warn); }
    .plan-tag.t-good { background: var(--good); }
    .plan-frac { font-size: 12px; font-weight: 700; color: var(--text); }
    .plan-when { font-size: 12px; color: var(--muted); }
    .plan-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 5px;
    }
    .plan ul { margin: 0 0 12px; padding-left: 18px; }
    .plan li { font-size: 13px; line-height: 1.6; margin-bottom: 4px; }
    .plan-succ {
      font-size: 13px; line-height: 1.55; border-left: 3px solid var(--good);
      padding-left: 10px; color: var(--text);
    }

    /* 62 questions */
    .q-area-name { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy); margin: 16px 0 6px; }
    .q-row { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .q-mark { flex: 0 0 22px; font-weight: 700; }
    .q-yes { color: var(--good); } .q-no { color: var(--crit); }
    .q-text { color: var(--text); }

    /* Stories */
    .story { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--card); }
    .story > summary { list-style: none; cursor: pointer; padding: 12px 14px; }
    .story > summary::-webkit-details-marker { display: none; }
    .story-line { font-size: 14px; font-weight: 600; line-height: 1.45; }
    .story-why { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      background: var(--gold-dim); color: var(--warn);
      padding: 2px 7px; border-radius: 20px; margin-right: 5px;
    }
    .story-body { padding: 0 14px 14px; }
    .story-narr { font-size: 14px; line-height: 1.65; margin-bottom: 12px; }
    .story-narr p { margin: 0 0 10px; }
    .story-narr p:last-child { margin-bottom: 0; }
    .story-more { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 6px; display: inline-block; }
    details.story[open] > summary .story-more-shut { display: none; }
    details.story:not([open]) > summary .story-more-open { display: none; }
    .story-note {
      font-size: 12px; line-height: 1.55; color: var(--text);
      border-left: 3px solid var(--crit); background: var(--surface);
      padding: 9px 12px; border-radius: 0 6px 6px 0;
    }
    .story-note b { color: var(--crit); }
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin: 18px 0 10px;
    }
    .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* Assets */
    .asset-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .asset-row:first-child { border-top: none; }
    .asset-label { flex: 0 0 150px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .asset-gap { color: var(--crit); font-size: 12px; font-weight: 600; }

    /* Meeting type picker, shown when no ?type= is present. */
    .pick-name { font-size: 22px; font-weight: 800; margin: 0 0 2px; letter-spacing: -0.02em; }
    .pick-ask { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
    .pick-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 14px 0; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .pick-row:first-of-type { border-top: none; }
    /* The picker is the first thing he touches in the meeting, so each type
       is a button rather than a word to aim at. */
    .pick-go {
      display: inline-block; font-family: inherit; font-size: 15px; font-weight: 700;
      color: var(--text); text-decoration: none; cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 13px 18px;
    }
    .pick-go:hover { border-color: var(--gold); }
    /* Unbuilt types stay visible so he can see the shape of what is coming,
       but must not read as live buttons that lead nowhere. */
    .pick-soon { font-size: 15px; font-weight: 600; color: var(--muted); opacity: 0.65; }
    .pick-soon-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--border); border-radius: 20px;
      padding: 3px 9px; white-space: nowrap;
    }
    .pick-example {
      display: inline-block; font-family: inherit; font-size: 13px; font-weight: 600;
      color: var(--muted); text-decoration: none; cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 11px 16px;
    }
    .pick-example:hover { color: var(--text); border-color: var(--gold); }

    /* Resultado: the lead outcome, the last thing on the page. */
    /* Stacked, each the full width of the card: the lead outcome is decided
       out loud with the client there, and these are the primary actions on
       the page. Side-by-side they were two small targets. */
    .out-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .out-btn {
      display: block; width: 100%; text-align: center;
      font-family: inherit; font-size: 15px; font-weight: 600;
      padding: 13px 18px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .out-btn:hover { border-color: var(--gold); }
    .out-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
    .out-btn.primary:hover { opacity: 0.9; }
    .out-sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    .out-pick { margin-top: 12px; }
    .out-pick select {
      font-family: inherit; font-size: 14px; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
      color: var(--text); min-width: 200px;
    }
    .out-state { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 15px; }
    .out-done {
      font-size: 14px; line-height: 1.55; padding: 12px 14px;
      background: var(--gold-dim); border-radius: 8px;
    }

    /* ---- Kickoff / weekly RDE / cycle close ---------------------------- */

    /* The kickoff steps. A numbered step, one line of context, and the link
       to the screen the thing is actually entered on. */
    .step { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
    .step:first-of-type { border-top: none; padding-top: 0; }
    .step-n {
      flex: 0 0 26px; height: 26px; border-radius: 50%;
      background: var(--navy); color: #fff;
      font-size: 12px; font-weight: 700; text-align: center; line-height: 26px;
    }
    .step-main { min-width: 0; flex: 1; }
    .step-title { font-size: 15px; font-weight: 700; margin: 0 0 3px; }
    .step-ctx { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 8px; }
    /* Every action on this page is a real button with a real hit area. He is
       talking and reading with a client in front of him, and a 13px gold text
       link is the wrong target for that. Secondary actions -- the links out to
       other screens and the checklist items -- are bordered; the primary ones
       (packages, lead outcome) carry the navy fill. */
    .step-link {
      display: inline-block; font-family: inherit; font-size: 14px; font-weight: 600;
      color: var(--text); text-decoration: none; cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 11px 18px; margin: 0 10px 8px 0;
    }
    .step-link:hover { border-color: var(--gold); }
    /* Full width of its card, for the one action a step exists to launch. */
    .step-link.primary {
      display: block; width: 100%; text-align: center;
      background: var(--navy); border-color: var(--navy); color: #fff;
    }
    .step-link.primary:hover { opacity: 0.9; border-color: var(--navy); }
    .step-note { font-size: 11px; color: var(--muted); display: block; margin-top: 5px; }
    /* Package picker. Buttons sit inline so the three read as one row of
       choices rather than three separate actions. .pkg-arm is the armed state
       between the first and second tap -- gold border, no fill, so it reads as
       "waiting on you" and not as "done". */
    .pkg-btn { display: inline-block; width: auto; margin: 0 6px 6px 0; }
    .pkg-btn.pkg-cur { border-color: var(--navy); font-weight: 600; }
    .pkg-btn.pkg-arm { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(191,159,84,0.22); }

    /* Custom agenda: a plain checklist. He is scanning this mid-call, so it is
       one column of readable rows, not a dense grid. */
    .agenda-list { margin: 10px 0 14px; }
    .agenda-item {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 8px 2px; border-bottom: 1px solid var(--border);
      font-size: 14px; cursor: pointer;
    }
    .agenda-item:last-child { border-bottom: none; }
    .agenda-item input { margin-top: 2px; flex: 0 0 auto; }
    .agenda-mine {
      font-style: normal; font-size: 11px; color: var(--gold);
      border: 1px solid var(--gold); border-radius: 999px; padding: 1px 7px; margin-left: 6px;
    }
    .agenda-tpl { display: inline-block; width: auto; margin: 0 6px 6px 0; }

    /* Builder */
    .builder-title, .builder-label, .builder-opts {
      width: 100%; padding: 10px 12px; margin: 6px 0;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 14px; background: var(--paper); color: var(--text);
    }
    .builder-field {
      position: relative; padding: 10px 34px 10px 10px; margin: 8px 0;
      border: 1px solid var(--border); border-radius: 10px;
    }
    .builder-type {
      width: 100%; padding: 9px 12px; margin: 6px 0;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 14px; background: var(--paper); color: var(--text);
    }
    .builder-del {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px; line-height: 1;
      border: none; border-radius: 50%; background: transparent;
      color: var(--muted); font-size: 17px; cursor: pointer;
    }
    .builder-del:hover { background: var(--border); color: var(--text); }

    /* A block he built, rendered for real */
    .cb-field { margin: 12px 0; }
    .cb-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .cb-in {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 14px; background: var(--paper); color: var(--text);
    }
    textarea.cb-in { min-height: 80px; resize: vertical; }
    .cb-opt { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; cursor: pointer; }
    /* An unrecorded value, stated as data and nothing more. No colour block,
       no rule down the side: it is a fact about the client's records, not a
       warning, and this page is read with the client in the room. */
    .step-gap {
      font-size: 13px; line-height: 1.55; color: var(--muted);
      padding: 2px 0;
    }
    /* Item / value pair for an absence stated plainly. */
    .step-fact { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; padding: 3px 0; }
    .step-fact-label { font-weight: 600; }
    .step-fact-value { color: var(--muted); }
    .step-done { font-size: 13px; color: var(--good); font-weight: 600; }

    /* Indicator lines, in his own sentence shape. */
    .ind-row { padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
    .ind-row:first-child { border-top: none; }
    .ind-name { font-weight: 700; }
    .ind-num { font-weight: 700; color: var(--navy); }
    .ind-miss { font-weight: 700; color: var(--crit); }
    .ind-ok { font-size: 14px; color: var(--good); font-weight: 600; }

    /* The week, day by day. Reused from the client page verbatim, so the
       eight states keep the same colours he already reads there. */
    .wk-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .wk-nav { display: flex; align-items: center; gap: 6px; }
    .wk-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    .wk-btn:hover { border-color: var(--gold); color: var(--gold); }
    .wk-range { font-size: 12px; color: var(--muted); font-weight: 600; }
    .wk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 6px; }
    .wk-day {
      text-align: center; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 2px; font-family: inherit; background: transparent;
    }
    .wk-day.is-today { border-color: var(--gold); }
    .wk-dow { font-size: 10px; color: var(--muted); font-weight: 700; }
    .wk-num { font-size: 14px; font-weight: 700; margin: 2px 0; }
    .wk-state { font-size: 9px; font-weight: 700; line-height: 1.2; }
    .wk-reasons { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .wk-blind {
      font-size: 12px; color: var(--muted); line-height: 1.55;
      margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--border);
    }

    /* Before and after, at the close. */
    .ba-row {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px;
    }
    .ba-row:first-child { border-top: none; }
    .ba-name { flex: 1 1 180px; font-weight: 600; }
    .ba-now { font-weight: 700; white-space: nowrap; }
    .ba-prev { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* What was built. Assets, never revenue. */
    .built-n { font-size: 22px; font-weight: 800; color: var(--navy); }
    .built-row { padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .built-row:first-child { border-top: none; }
    .built-label { font-size: 12px; color: var(--muted); }
    .built-list { margin: 6px 0 0; padding-left: 18px; }
    .built-list li { font-size: 13px; line-height: 1.6; }

    /* Kickoff target sequence */
    .seq-row { padding: 11px 0; border-top: 1px solid var(--border); }
    .seq-row:first-child { border-top: none; }
    .seq-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .seq-name { font-size: 14px; font-weight: 700; }
    .tag.t-asked   { background: rgba(20,36,61,0.10); color: var(--navy); }
    .tag.t-derived { background: rgba(45,106,79,0.12); color: var(--good); }
    .tag.t-imposed { background: rgba(107,102,96,0.12); color: var(--muted); }
    .tag.t-ext     { background: rgba(180,64,64,0.10); color: var(--crit); }
    .seq-ask { font-size: 14px; font-style: italic; color: var(--text); margin: 5px 0 0; }
    .seq-formula { font-size: 12px; color: var(--muted); margin: 5px 0 0; }
    /* The arithmetic he reads aloud, with the real numbers in it. */
    .seq-work {
      font-size: 15px; font-weight: 700; color: var(--navy);
      font-variant-numeric: tabular-nums; margin: 3px 0 0;
    }
    .seq-val { font-size: 13px; margin: 4px 0 0; }
    .seq-std { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
    .seq-pending { font-size: 12px; color: var(--muted); font-style: italic; margin: 4px 0 0; }
    .seq-lookup { font-size: 13px; margin: 4px 0 0; }

    /* Daily-log walkthrough */
    .wt-row { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
    .wt-row:first-child { border-top: none; }
    .wt-n { flex: 0 0 22px; color: var(--muted); font-weight: 700; font-size: 12px; }

    /* Tasks: three states, never a checkbox. */
    .task-row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
    .task-row:first-child { border-top: none; }
    .task-mark { flex: 0 0 20px; font-weight: 700; font-size: 15px; text-align: center; }
    .task-main { flex: 1; min-width: 0; }
    .task-desc { font-size: 14px; line-height: 1.45; }
    .task-meta { display: flex; gap: 10px; align-items: baseline; margin-top: 3px; }
    .task-state { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .task-due { font-size: 11px; color: var(--muted); }
    .task-note {
      font-size: 12px; line-height: 1.5; color: var(--text); margin-top: 5px;
      border-left: 3px solid var(--border); padding-left: 9px;
    }
    .ts-done { color: var(--good); }
    .ts-not  { color: var(--crit); }
    .ts-pend { color: var(--muted); }

    /* Cycle close */
    .voice-row { padding: 10px 0; border-top: 1px solid var(--border); }
    .voice-row:first-of-type { border-top: none; }
    .voice-name { font-size: 15px; font-weight: 700; }
    .voice-space { display: block; height: 34px; border-bottom: 1px dashed var(--border); margin-top: 6px; }
    .doc-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .doc-row:first-of-type { border-top: none; }
    .doc-n { flex: 0 0 20px; color: var(--muted); font-weight: 700; font-size: 12px; }
    .ba-growth { font-size: 13px; font-weight: 700; white-space: nowrap; }

    /* Checklist */
    .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
    .check-row:first-child { border-top: none; }
    .check-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--gold); flex: 0 0 auto; }
    .check-row label { font-size: 14px; line-height: 1.45; display: block; }
    /* Label above, action button below at full size -- the row is read and
       tapped mid-meeting, so the target is a button and not a word. */
    .check-main { min-width: 0; flex: 1; }
    .check-main .step-link { margin-top: 8px; }

    @media (max-width: 620px) {
      main { padding: 16px 12px 60px; }
      .card, .block-body { padding: 16px; }
      .asset-label { flex-basis: 110px; }
      .prep-name { font-size: 21px; }
    }
  </style>
</head>
<body class="lang-pt">
  <header>
    <div class="header-left">
      <img src="assets/apex-logo.png" alt="APEX" class="header-logo">
      <div class="header-title"><span class="show-pt">Prepara&#231;&#227;o da Reuni&#227;o</span><span class="show-en">Meeting Prep</span></div>
    </div>
    <div class="header-right">
      <button class="hdr-btn" onclick="goBack()"><span class="show-pt">Voltar</span><span class="show-en">Back</span></button>
      <button class="hdr-btn" onclick="toggleLang()">PT / EN</button>
    </div>
  </header>

  <main>
    <div id="stateMsg"><span class="show-pt">Carregando...</span><span class="show-en">Loading...</span></div>
    <div id="prepBody" hidden></div>
  </main>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"
    integrity="sha384-5y/1XyjXGriVPCsfTI3ap84Bg9Db2y/GiQjR3nbrVJE03bworx9G08uSJEMme/mI"
    crossorigin="anonymous"></script>
  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"
    integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
    crossorigin="anonymous"></script>
  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";

    var FIREBASE_CONFIG = {
      apiKey:            "AIzaSyB_OFg5ouKAu61vObNsHJaGQO0TikaIhy8",
      authDomain:        "apex-command-center-4b038.firebaseapp.com",
      projectId:         "apex-command-center-4b038",
      storageBucket:     "apex-command-center-4b038.firebasestorage.app",
      messagingSenderId: "894743550437",
      appId:             "1:894743550437:web:45041f841f7e8196db770c"
    };

    var params       = new URLSearchParams(window.location.search);
    var CLIENT_ID    = params.get("client");
    var MEETING_TYPE = params.get("type") || "xray_results";
    var IS_EXAMPLE   = params.get("example") === "1";
    // No ?type= means he has not chosen a meeting type yet: show the picker.
    var HAS_TYPE     = !!params.get("type");
    // Perfect Square, the one client whose X-Ray results page renders in full:
    // the current 62-question instrument across all six areas, a complete
    // action plan, all 12 practice activities, and a recorded X-Ray meeting on
    // 2026-07-27 to check every section against.
    var EXAMPLE_URL  = "meeting-prep.html?client=mazinho-001"
                     + "&type=xray_results&example=1";

    var currentUser = null;
    var auth        = null;
    var prepData    = null;
    var saveTimer   = null;
    var lastSaved   = null;

    // Every string in this file is plain ASCII. Portuguese accented text lives
    // in the HTML the renderers emit, never in a JS string literal.
    var PATTERN_LABELS = {
      medo_de_prospectar:     "medo de prospectar",
      espera_o_cliente_vir:   "espera o cliente vir",
      sem_clareza_financeira: "sem clareza financeira",
      dependencia_do_dono:    "dependência do dono",
      tudo_na_cabeca:         "tudo na cabeça",
      zona_de_conforto:       "zona de conforto",
      recomeco_apos_fracasso: "recomeço após fracasso",
      risco_sem_conselho:     "risco sem conselho"
    };

    // The after-meeting checklist. Every type ends on one.
    //
    // These are the three things that actually happen. The old list was
    // invented: "Enviar o Raio-X", "Enviar acesso ao sistema" and "Enviar a
    // comparacao de planos" are not steps anybody performs after a session.
    //
    // Approving the summary is the real one, and it has a consequence he
    // states to clients: once approved the session's report is filed against
    // the client and he tells them they will have it within 24 hours.
    var AFTER_MEETING = [
      { id: "chk_summary",  kind: "summary",
        pt: "Gerar e aprovar o resumo da sess&#227;o", en: "Generate and approve the session summary" },
      { id: "chk_next",     kind: "calendar",
        pt: "Combinar a pr&#243;xima sess&#227;o",          en: "Agree the next session" }
    ];

    // Kickoff adds one: the targets were built live, so they get confirmed.
    var AFTER_MEETING_KICKOFF = [
      { id: "chk_summary",  kind: "summary",
        pt: "Gerar e aprovar o resumo da sess&#227;o", en: "Generate and approve the session summary" },
      { id: "chk_goals",    kind: "goals",
        pt: "Confirmar as metas lan&#231;adas",        en: "Confirm the targets that were entered" },
      { id: "chk_next",     kind: "calendar",
        pt: "Combinar a pr&#243;xima sess&#227;o",          en: "Agree the next session" }
    ];

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function isEn() { return document.body.classList.contains("lang-en"); }

    function ptEn(pt, en) {
      return '<span class="show-pt">' + pt + '</span><span class="show-en">' + en + '</span>';
    }

    // ptEn emits two spans and can never go inside an attribute. Placeholders
    // and titles need the plain string for the language actually showing.
    function ptEnAttr(pt, en) {
      var t = isEn() ? en : pt;
      var d = document.createElement("textarea");
      d.innerHTML = t;
      return d.value.replace(/"/g, "&quot;");
    }

    function toggleLang() {
      var b = document.body;
      if (b.classList.contains("lang-pt")) { b.classList.remove("lang-pt"); b.classList.add("lang-en"); }
      else { b.classList.remove("lang-en"); b.classList.add("lang-pt"); }
      if (window.apexApplyTitle) { window.apexApplyTitle(); }
      if (prepData) { render(prepData); }
    }

    function goBack() {
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = "dashboard.html"; }
    }

    function firebaseUser() {
      if (currentUser) { return Promise.resolve(currentUser); }
      return new Promise(function(resolve, reject) {
        if (!auth) {
          firebase.initializeApp(FIREBASE_CONFIG);
          auth = firebase.auth();
        }
        auth.onAuthStateChanged(function(user) {
          if (user) { currentUser = user; resolve(user); return; }
          // Momentary null during a token refresh: wait, then decide. See the
          // comment on the boot path in init().
          var hadSession = sessionStorage.getItem("apex_role");
          if (!hadSession) { reject(new Error("Not authenticated")); return; }
          setTimeout(function() {
            if (auth.currentUser) { currentUser = auth.currentUser; resolve(auth.currentUser); }
            else { reject(new Error("Not authenticated")); }
          }, 1000);
        });
      });
    }

    function getToken() {
      if (currentUser) { return currentUser.getIdToken(); }
      return Promise.reject(new Error("Not authenticated"));
    }

    function apiFetch(path, opts) {
      return getToken().then(function(token) {
        var o = opts || {};
        var headers = { "Authorization": "Bearer " + token };
        if (o.body) { headers["Content-Type"] = "application/json"; }
        return fetch(WORKER_URL + path, {
          method:  o.method || "GET",
          headers: headers,
          body:    o.body || undefined
        });
      });
    }

    function showMsg(pt, en) {
      var el = document.getElementById("stateMsg");
      if (!el) { return; }
      el.hidden = false;
      el.innerHTML = ptEn(escHtml(pt), escHtml(en));
      var body = document.getElementById("prepBody");
      if (body) { body.hidden = true; }
    }

    // Status -> semantic colour. Accented and unaccented spellings both appear
    // in score_json depending on which instrument wrote the row, so both are
    // handled. Anything unrecognised falls through to the neutral warn tone
    // rather than being asserted as good or critical.
    function statusClass(status) {
      var s = String(status || "");
      if (s === "Bom") { return "good"; }
      if (s === "Moderado") { return "warn"; }
      if (s === "Critico" || s === "Cr\u00edtico") { return "crit"; }
      return "warn";
    }

    // Meeting type -> the line under the client's name. Falls back to the raw
    // key rather than to the X-Ray label, so an unknown type never claims to
    // be a meeting it is not.
    function typeLabelHtml(type) {
      if (type === "xray_results") {
        return ptEn("Reuni&#227;o de resultados do Raio-X", "X-Ray results meeting");
      }
      if (type === "kickoff") {
        return ptEn("Kickoff", "Kickoff");
      }
      if (type === "rde_semanal") {
        return ptEn("RDE semanal", "Weekly RDE");
      }
      if (type === "fechamento") {
        return ptEn("Fechamento de ciclo, 30 dias", "Cycle close, 30 days");
      }
      if (type === "custom") {
        return ptEn("Outra reuni&#227;o", "Another meeting");
      }
      return escHtml(type || "");
    }

    // A number as he would say it. Currency and percent carry their mark;
    // everything else is a plain count. Nulls never reach here.
    function fmtInd(v, type) {
      var n = Number(v);
      if (!isFinite(n)) { return escHtml(String(v)); }
      var r = Math.round(n * 100) / 100;
      if (type === "currency") { return "$" + r; }
      if (type === "percent" || type === "computed" || type === "computed_month") {
        // margem_lucro / taxa_conversao / metas_batidas are all percentages.
        return r + "%";
      }
      if (type === "hours") { return r + "h"; }
      return String(r);
    }

    // ---- 1 Header ---------------------------------------------------------
    function renderHead(d) {
      var c = d.client || {};
      var bits = [];
      if (c.owners)   { bits.push(escHtml(c.owners)); }
      if (c.location) { bits.push(escHtml(c.location)); }
      if (c.industry) { bits.push(escHtml(c.industry)); }

      var typeLabel = typeLabelHtml(d.meeting_type);

      var h = '<div class="card">';
      if (IS_EXAMPLE) {
        h += '<p class="example-line">' +
             ptEn("Exemplo, com dados reais da Perfect Square.",
                  "Example, with real Perfect Square data.") + '</p>';
      }
      h += '<h1 class="prep-name">' + escHtml(c.name || "") + '</h1>';
      if (bits.length) { h += '<p class="prep-meta">' + bits.join(" &middot; ") + '</p>'; }
      h += '<p class="prep-meta">' + typeLabel + '</p>';
      h += '<p class="prep-confid">' +
           ptEn("Esta p&#225;gina &#233; apenas para o consultor. Qualquer material mostrado ao cliente abre em separado.",
                "This page is consultant-only. Anything shown on screen opens separately.") +
           '</p>';
      h += '</div>';
      return h;
    }

    // ---- 2 Before you start ----------------------------------------------
    // Money or timing constraints surfaced at the TOP. In the real Brax meeting
    // the cash objection did not appear until minute 55 and the deal did not
    // close. Renders nothing at all when there is nothing true to show.
    function renderBefore(d) {
      var c = d.client || {};
      var rows = [];

      var sc = d.assessment && d.assessment.score;
      var areas = (sc && sc.areas) || [];
      for (var i = 0; i < areas.length; i++) {
        var a = areas[i];
        if (!a.evidencePt) { continue; }
        var cls = statusClass(a.status);
        if (cls !== "crit" && cls !== "warn") { continue; }
        var ev = String(a.evidencePt);
        // Only the money-and-timing evidence belongs at the top of the page.
        if (!/margem|preco|preço|custo|receita|financ|DRE|caixa|pagamento|dinheiro/i.test(ev)) { continue; }
        rows.push(
          '<div class="constraint">' + escHtml(ev) +
          '<span class="constraint-src">' + escHtml(a.namePt || a.key || "") + '</span></div>'
        );
      }

      var side = [];
      if (c.owners) {
        side.push('<div class="kv-item"><div class="kv-label">' +
          ptEn("Quem participa", "Attending") + '</div><div class="kv-value">' +
          escHtml(c.owners) + '</div></div>');
      }
      if (c.package) {
        side.push('<div class="kv-item"><div class="kv-label">' +
          ptEn("Multiplicador do pipeline", "Pipeline multiplier") + '</div><div class="kv-value">' +
          escHtml(c.package) + '</div></div>');
      }

      if (!rows.length && !side.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Antes de come&#231;ar", "Before you start") + '</p>';
      h += rows.join("");
      if (side.length) {
        h += '<div class="kv" style="margin-top:' + (rows.length ? "14px" : "0") + ';">' + side.join("") + '</div>';
      }
      h += '</div>';
      return h;
    }

    // ---- 3 What he says the bottleneck is --------------------------------
    function renderBottleneck(d) {
      var txt = (d.bottleneck && d.bottleneck.text) || "";
      lastSaved = txt;
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O gargalo, na palavra dele", "What he says the bottleneck is") + '</p>';
      h += '<p class="ask-line">' +
           ptEn("Me fala um pouquinho, o que voc&#234; mais percebe aqui, na sua empresa, de gargalo?",
                "Tell me a little: what do you notice most here in your company as a bottleneck?") +
           '</p>';
      h += '<textarea id="bottleneckBox" class="bottleneck">' + escHtml(txt) + '</textarea>';
      h += '<div class="save-state" id="saveState"></div>';
      h += '</div>';
      return h;
    }

    // ---- 4 Owner dependency, precomputed ---------------------------------
    // The arithmetic the X-Ray can actually prove. Renders nothing when no
    // practice activity was answered: "0 activities" and "never filled in"
    // are not the same claim, and only one of them is true here.
    function renderOwnerLoad(d) {
      var o = d.ownerLoad;
      if (!o || !o.answered) { return ""; }

      var pct = o.answered ? Math.round((o.owner_count / o.answered) * 100) : 0;
      var lowTxt  = String(o.hours_low);
      var highTxt = String(o.hours_high);

      var linePt = 'O dono faz <span class="num">' + o.owner_count + '</span> das ' +
                   o.total_activities + ' atividades, cerca de <span class="num">' +
                   lowTxt + ' a ' + highTxt + '</span> horas por semana antes de tocar no trabalho em si.';
      var lineEn = 'The owner personally does <span class="num">' + o.owner_count + '</span> of ' +
                   o.total_activities + ' activities, about <span class="num">' +
                   lowTxt + ' to ' + highTxt + '</span> hours a week before touching the work itself.';

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("A depend&#234;ncia do dono", "Owner dependency") + '</p>';
      h += '<p class="load-line">' + ptEn(linePt, lineEn) + '</p>';
      h += '<div class="load-bar"><span style="width:' + pct + '%;"></span></div>';
      h += '<p class="load-sub">' +
           ptEn(escHtml(o.answered + " de " + o.total_activities + " atividades foram respondidas."),
                escHtml(o.answered + " of " + o.total_activities + " activities were answered.")) +
           '</p>';
      if (o.allOwner) {
        h += '<p class="load-sub" style="margin-top:6px;">' +
             ptEn("Todas as atividades respondidas s&#227;o feitas pelo dono.",
                  "Every answered activity is done by the owner.") + '</p>';
      }
      h += '</div>';
      return h;
    }

    // One area's entry from score_json.action_plan. Every field is optional:
    // a plan missing its timeframe or success criterion renders without them
    // rather than showing an empty row.
    function renderPlan(p) {
      var tagCls = "";
      var st = String(p.status || "");
      if (st === "Moderado" || st === "Aten\u00e7\u00e3o") { tagCls = " t-warn"; }
      else if (st === "Bom") { tagCls = " t-good"; }

      var h = '<div class="plan"><div class="plan-head">';
      if (p.tag)      { h += '<span class="plan-tag' + tagCls + '">' + escHtml(p.tag) + '</span>'; }
      if (p.fraction) { h += '<span class="plan-frac">' + escHtml(p.fraction) + '</span>'; }
      var when = isEn() ? (p.timeframeEn || p.timeframePt) : (p.timeframePt || p.timeframeEn);
      if (when)       { h += '<span class="plan-when">' + escHtml(when) + '</span>'; }
      h += '</div>';

      var acts = (isEn() ? (p.actionsEn || p.actionsPt) : (p.actionsPt || p.actionsEn)) || [];
      if (acts.length) {
        h += '<p class="plan-label">' + ptEn("O que fazer", "What to do") + '</p><ul>';
        for (var i = 0; i < acts.length; i++) {
          h += '<li>' + escHtml(acts[i]) + '</li>';
        }
        h += '</ul>';
      }

      var succ = isEn() ? (p.criterioSucessoEn || p.criterioSucessoPt)
                        : (p.criterioSucessoPt || p.criterioSucessoEn);
      if (succ) {
        h += '<p class="plan-label">' + ptEn("Crit&#233;rio de sucesso", "Success criterion") + '</p>';
        h += '<p class="plan-succ">' + escHtml(succ) + '</p>';
      }
      h += '</div>';
      return h;
    }

    // ---- 5 X-Ray scores, expandable, open by default ---------------------
    // Never assumes six areas: BRAX carries the legacy four. Ends on the
    // genuine positive, which is how he always closes that block.
    function renderScores(d) {
      var sc = d.assessment && d.assessment.score;
      if (!sc) { return ""; }
      var areas = sc.areas || [];
      if (!areas.length) { return ""; }

      var h = '<details class="block" open><summary><span class="sum-title">' +
              ptEn("As notas do Raio-X", "The X-Ray scores") + '</span>';
      if (typeof sc.pct === "number") {
        h += '<span class="sum-hint">' + sc.pct + '%';
        if (typeof sc.score === "number" && typeof sc.max_score === "number") {
          h += ' &middot; ' + sc.score + '/' + sc.max_score;
        }
        h += '</span>';
      }
      h += '</summary><div class="block-body">';

      // action_plan is keyed by areaKey. A client whose score_json predates the
      // plan simply has none, and those areas render flat rather than opening
      // onto an empty drawer.
      var planBy = {};
      var plans = sc.action_plan || [];
      for (var pi = 0; pi < plans.length; pi++) {
        if (plans[pi] && plans[pi].areaKey) { planBy[plans[pi].areaKey] = plans[pi]; }
      }

      // Worst first: that is the order he reads them in. Sorted on a copy so
      // the stored order is left alone.
      var ordered = areas.slice().sort(function(x, y) {
        var xp = typeof x.pct === "number" ? x.pct : 101;
        var yp = typeof y.pct === "number" ? y.pct : 101;
        return xp - yp;
      });

      for (var i = 0; i < ordered.length; i++) {
        var a = ordered[i];
        var cls = statusClass(a.status);
        // Score out of 10, as the section specifies, derived from the area's
        // own percentage so a 4-area and a 6-area instrument read alike.
        var outOf10 = typeof a.pct === "number" ? Math.round(a.pct / 10) : null;
        var name = isEn() ? (a.nameEn || a.namePt || a.key) : (a.namePt || a.nameEn || a.key);
        var plan = planBy[a.key];

        var head = '<div class="area-head">';
        head += '<span class="area-name">' + escHtml(name) + '</span>';
        if (outOf10 !== null) {
          head += '<span class="area-score s-' + cls + '">' + outOf10 + '/10</span>';
        }
        head += '</div>';
        if (typeof a.pct === "number") {
          head += '<div class="bar"><span class="fill-' + cls + '" style="width:' + a.pct + '%;"></span></div>';
        }
        if (a.evidencePt) {
          head += '<p class="area-ev">' + escHtml(a.evidencePt) + '</p>';
        }

        h += '<div class="area">';
        if (plan) {
          h += '<details class="area-d"><summary>' + head +
               '<span class="area-more">' +
               '<span class="area-more-shut">' + ptEn("Ver o plano", "See the plan") + '</span>' +
               '<span class="area-more-open">' + ptEn("Fechar", "Close") + '</span>' +
               '</span></summary>' + renderPlan(plan) + '</details>';
        } else {
          h += head;
        }
        h += '</div>';
      }

      if (sc.positivoPt) {
        h += '<div class="positive"><span class="positive-label">' +
             ptEn("O ponto positivo", "The genuine positive") + '</span>' +
             escHtml(sc.positivoPt) + '</div>';
      }
      h += '</div></details>';
      return h;
    }

    // ---- 6 The 62 questionnaire answers, collapsed -----------------------
    function renderQuestions(d) {
      if (!d.answeredCount) { return ""; }
      var groups = d.areaQuestions || [];
      var h = '<details class="block"><summary><span class="sum-title">' +
              ptEn("As 62 respostas do question&#225;rio", "The 62 questionnaire answers") +
              '</span><span class="sum-hint">' + d.answeredCount + '</span></summary>' +
              '<div class="block-body">';
      for (var i = 0; i < groups.length; i++) {
        var g = groups[i];
        var qs = g.questions || [];
        var shown = [];
        for (var j = 0; j < qs.length; j++) {
          if (qs[j].answer === 0 || qs[j].answer === 1) { shown.push(qs[j]); }
        }
        if (!shown.length) { continue; }
        h += '<p class="q-area-name">' + escHtml(isEn() ? (g.nameEn || g.namePt) : (g.namePt || g.nameEn)) + '</p>';
        for (var k = 0; k < shown.length; k++) {
          var q = shown[k];
          var yes = q.answer === 1;
          h += '<div class="q-row"><span class="q-mark ' + (yes ? "q-yes" : "q-no") + '">' +
               (yes ? ptEn("Sim", "Yes") : ptEn("N&#227;o", "No")) + '</span><span class="q-text">' +
               escHtml(isEn() ? (q.labelEn || q.labelPt) : (q.labelPt || q.labelEn)) +
               '</span></div>';
        }
      }
      h += '</div></details>';
      return h;
    }

    // ---- 7 Stories, ranked -----------------------------------------------
    // The system ranks. He picks. Never auto-select, never hide the rest:
    // a meeting turns and he needs the others in his back pocket.
    // Names the patterns, in the page's own words, as a readable list:
    // "medo de prospectar e zona de conforto" / "a and b" -- never a bare id.
    // Takes the joiner rather than calling ptEn() itself: the result is built
    // into one side of a ptEn() pair, and a nested pair would leak the
    // Portuguese joiner into the English sentence.
    function patternList(keys, joiner) {
      var out = [];
      for (var i = 0; i < keys.length; i++) {
        out.push(escHtml(PATTERN_LABELS[keys[i]] || keys[i]));
      }
      if (out.length === 1) { return out[0]; }
      var last = out.pop();
      return out.join(", ") + joiner + last;
    }

    // The real reason THIS story ranked where it did. A story that matched
    // nothing gets no line at all: the same generic sentence on all sixteen
    // rows tells him nothing and is worse than silence.
    function storyReason(mb, mp) {
      if (mb.length) {
        // The bottleneck he just typed is the stronger signal, so that is the
        // source named when a story hits both.
        return ptEn(
          "Casa com o gargalo que ele descreveu: " + patternList(mb, " e "),
          "Matches the bottleneck he described: " + patternList(mb, " and ")
        );
      }
      if (mp.length) {
        return ptEn(
          "Casa com o Raio-X: " + patternList(mp, " e "),
          "Matches the X-Ray: " + patternList(mp, " and ")
        );
      }
      return "";
    }

    // A narrative is now full prose, several paragraphs long. Blank lines are
    // paragraph breaks and render as such; one undivided block is unreadable
    // mid-meeting.
    function narrativeHtml(text) {
      var paras = String(text).split(/\n\s*\n/);
      var out = "";
      for (var i = 0; i < paras.length; i++) {
        var t = paras[i].replace(/^\s+|\s+$/g, "");
        if (!t) { continue; }
        out += '<p>' + escHtml(t) + '</p>';
      }
      return out;
    }

    function storyCard(s) {
      var why = [];
      var mb = s.matched_bottleneck || [];
      var mp = s.matched_patterns || [];
      for (var i = 0; i < mb.length; i++) {
        why.push('<span class="tag">' + escHtml(PATTERN_LABELS[mb[i]] || mb[i]) + '</span>');
      }
      for (var j = 0; j < mp.length; j++) {
        if (mb.indexOf(mp[j]) > -1) { continue; }
        why.push('<span class="tag">' + escHtml(PATTERN_LABELS[mp[j]] || mp[j]) + '</span>');
      }

      var reason = storyReason(mb, mp);

      var h = '<details class="story"><summary>';
      h += '<div class="story-line">' + escHtml(s.one_liner || "") + '</div>';
      if (why.length || reason) {
        h += '<div class="story-why">' + why.join("") +
             (reason ? '<span>' + reason + '</span>' : "") + '</div>';
      }
      h += '<span class="story-more">' +
           '<span class="story-more-shut">' + ptEn("Ver a hist&#243;ria", "See the story") + '</span>' +
           '<span class="story-more-open">' + ptEn("Fechar", "Close") + '</span>' +
           '</span>';
      h += '</summary><div class="story-body">';
      // narrative_en is filled in row by row; falling back to the Portuguese
      // keeps the body from rendering blank while that work is in flight.
      var narr = isEn() ? (s.narrative_en || s.narrative) : s.narrative;
      if (narr) {
        h += '<div class="story-narr">' + narrativeHtml(narr) + '</div>';
      }
      // telling_note is ALWAYS rendered: it says what must not be claimed.
      if (s.telling_note) {
        h += '<div class="story-note"><b>' +
             ptEn("Ao contar:", "When telling it:") + '</b> ' +
             escHtml(s.telling_note) + '</div>';
      }
      h += '</div></details>';
      return h;
    }

    // He tells stories in EVERY kind of meeting, so this section is on all
    // four types, not just the X-Ray one. With a completed X-Ray the ranking
    // uses score_json and profile_json as before; without one it falls back to
    // the typed bottleneck alone; with neither, the stories are simply shown
    // unranked rather than the section disappearing.
    function renderStories(d) {
      var list = d.stories || [];
      if (!list.length) { return ""; }
      var matched = [];
      var rest    = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].matched) { matched.push(list[i]); } else { rest.push(list[i]); }
      }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Hist&#243;rias", "Stories") + '</p>';
      for (var m = 0; m < matched.length; m++) { h += storyCard(matched[m]); }
      if (matched.length && rest.length) {
        h += '<div class="divider">' + ptEn("As demais", "The rest") + '</div>';
      }
      for (var r = 0; r < rest.length; r++) { h += storyCard(rest[r]); }
      h += '</div>';
      return h;
    }

    // ---- 8 What he already has -------------------------------------------
    function renderAssets(d) {
      var c = d.client || {};
      var dp = {};
      if (c.digital_presence) {
        try { dp = JSON.parse(c.digital_presence) || {}; } catch (e) { dp = {}; }
      }

      var items = [
        { pt: "Site",       en: "Website",                 val: dp.website || dp.site || null },
        { pt: "Google",     en: "Google Business Profile", val: dp.google || dp.google_business || null },
        { pt: "Instagram",  en: "Instagram",               val: c.instagram_handle || dp.instagram || null },
        { pt: "E-mail",     en: "Email",                   val: c.email || null },
        { pt: "Equipe",     en: "Team size",               val: dp.team_size || dp.equipe || null }
      ];

      var rows = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var has = it.val !== null && it.val !== undefined && String(it.val).trim() !== "";
        rows.push(
          '<div class="asset-row"><span class="asset-label">' + ptEn(it.pt, it.en) + '</span>' +
          (has
            ? '<span>' + escHtml(String(it.val)) + '</span>'
            : '<span class="asset-gap">' + ptEn("n&#227;o consta", "not on record") + '</span>') +
          '</div>'
        );
      }

      return '<div class="card"><p class="sec-title">' +
             ptEn("O que ele j&#225; tem", "What he already has") + '</p>' +
             rows.join("") + '</div>';
    }

    // ---- KICKOFF ----------------------------------------------------------
    // The meeting where targets do not exist yet. He builds about twenty of
    // them live with the client and fills in the first daily log with them,
    // teaching the tool as he goes. So this is NOT a report: it is a checklist
    // where every step links to the screen that thing is actually entered on.

    // Every link out of prep carries where it came from, so the destination can
    // offer a way back. He runs these mid-meeting while talking: without this
    // he lands on a long client page, loses the prep he was reading from, and
    // has to find it again in front of the client.
    function clientHref(extra) {
      return "client.html?id=" + encodeURIComponent(CLIENT_ID) + (extra || "") +
             "&from=prep&prepType=" + encodeURIComponent(MEETING_TYPE);
    }

    // What the system already knows, so he does not open the meeting asking
    // for things it can already tell him.
    function renderKickoffKnown(d) {
      var c = d.client || {};
      var k = d.kickoff || {};
      var items = [];

      function kv(labelHtml, valueHtml) {
        items.push('<div class="kv-item"><div class="kv-label">' + labelHtml +
                   '</div><div class="kv-value">' + valueHtml + '</div></div>');
      }

      if (c.package)            { kv(ptEn("Pacote", "Package"), escHtml(c.package)); }
      if (c.package_started_at) { kv(ptEn("In&#237;cio", "Started"), escHtml(c.package_started_at)); }
      if (c.industry)           { kv(ptEn("Setor", "Industry"), escHtml(c.industry)); }
      if (c.location)           { kv(ptEn("Local", "Location"), escHtml(c.location)); }
      if (c.owners)             { kv(ptEn("Donos", "Owners"), escHtml(c.owners)); }
      kv(ptEn("Raio-X", "X-Ray"), k.has_xray
        ? ptEn("conclu&#237;do", "completed")
        : ptEn("sem Raio-X conclu&#237;do", "no completed X-Ray"));

      if (!items.length) { return ""; }
      return '<div class="card"><p class="sec-title">' +
             ptEn("O que o sistema j&#225; sabe", "What the system already knows") +
             '</p><div class="kv">' + items.join("") + '</div></div>';
    }

    function renderKickoff(d) {
      var k = d.kickoff;
      if (!k) { return ""; }
      var g = k.goals || {};

      var h = renderKickoffKnown(d);

      h += '<div class="card"><p class="sec-title">' +
           ptEn("A reuni&#227;o, passo a passo", "The meeting, step by step") + '</p>';

      // --- 1 the goals -----------------------------------------------------
      h += '<div class="step"><div class="step-n">1</div><div class="step-main">';
      h += '<p class="step-title">' +
           ptEn("Definir as metas do m&#234;s", "Set the month's targets") + '</p>';

      if (g.all_set) {
        // Do not send him to set what is already set.
        h += '<p class="step-done">' +
             ptEn(escHtml("As " + g.goalable + " metas do mês já estão definidas."),
                  escHtml("All " + g.goalable + " targets for the month are already set.")) +
             '</p>';
      } else {
        h += '<p class="step-ctx">' +
             ptEn(escHtml(g.with_meta + " de " + g.goalable + " indicadores com meta definida para o mes."),
                  escHtml(g.with_meta + " of " + g.goalable + " indicators have a target for the month.")) +
             '</p>';
      }

      // The metas editor on the CLIENT page, not the portal: it PUTs
      // /field-config without previewAs, so it is the only place he can
      // actually write the targets. The portal's goals screen is read-only
      // for staff and would fail on save.
      h += '<a class="step-link" href="' + clientHref("&modal=fieldconfig") +
           '" target="_blank" rel="noopener">' +
           ptEn("Definir as metas na ficha do cliente", "Set the targets on the client page") + '</a>';
      h += '<span class="step-note">' +
           ptEn("Esta &#233; a tela onde ele consegue gravar. Se quiser que o cliente preencha, o cliente faz no login dele.",
                "This is the screen he can actually save on. If the client is to fill it in, they do it on their own login.") +
           '</span>';
      h += '</div></div>';

      // --- 2 the first daily log -------------------------------------------
      h += '<div class="step"><div class="step-n">2</div><div class="step-main">';
      h += '<p class="step-title">' +
           ptEn("Preencher o primeiro registro di&#225;rio COM o cliente",
                "Fill in the first daily log WITH the client") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("O objetivo aqui &#233; ensinar a ferramenta, n&#227;o coletar o dado.",
                "The point here is teaching the tool, not collecting the data.") + '</p>';
      h += '<a class="step-link" href="' + clientHref("&day=" + encodeURIComponent(k.today)) +
           '" target="_blank" rel="noopener">' +
           ptEn("Abrir o registro de hoje", "Open today's entry") + '</a>';
      // The staff view of a day is read-only: entries are only writable from
      // the client's own portal login. He teaches, the client types.
      h += '<span class="step-note">' +
           ptEn("A ficha mostra o dia, mas quem digita &#233; o cliente, no login dele.",
                "The client page shows the day, but the client types, on their own login.") +
           '</span>';
      h += '</div></div>';

      // --- 3 the price table -----------------------------------------------
      // An ordinary step now that gm_pricing exists: a line of context, the
      // counts, and the two screens the work happens on.
      var kp = k.pricing || { total: 0, with_costs: 0 };
      h += '<div class="step"><div class="step-n">3</div><div class="step-main">';
      h += '<p class="step-title">' +
           ptEn("Tabela de pre&#231;os e custos", "Pricing & costs table") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("O que cada item custa contra o que ele cobra &#233; o que transforma faturamento em margem de verdade.",
                "What each item costs against what they charge is what turns revenue into real margin.") + '</p>';
      h += '<div class="step-gap">' +
           ptEn(kp.total + " itens registrados &#183; " + kp.with_costs + " com custos preenchidos",
                kp.total + " items recorded &#183; " + kp.with_costs + " with costs filled in") +
           '</div>';
      h += '<a class="step-link" href="' + clientHref("&section=gmpricing") +
           '" target="_blank" rel="noopener">' +
           ptEn("Abrir a tabela de pre&#231;os", "Open the pricing table") + '</a>';
      h += '<a class="step-link" href="' + clientHref("&section=gmpricing") +
           '&import=1" target="_blank" rel="noopener">' +
           ptEn("Importar CSV", "Import CSV") + '</a>';
      h += '</div></div>';

      // --- 4 digital presence ----------------------------------------------
      h += '<div class="step"><div class="step-n">4</div><div class="step-main">';
      h += '<p class="step-title">' + ptEn("Presen&#231;a digital", "Digital presence") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("O que a empresa j&#225; tem no ar, e o que falta.",
                "What the business already has live, and what is missing.") + '</p>';
      h += '<a class="step-link" href="' + clientHref("&section=dp") +
           '" target="_blank" rel="noopener">' +
           ptEn("Abrir a presen&#231;a digital", "Open digital presence") + '</a>';
      h += '</div></div>';

      h += '</div>';
      return h;
    }
    // ---- WEEKLY RDE -------------------------------------------------------
    // His actual meeting order, beat by beat, so he can move down the page as
    // the meeting moves. The order is his, not a redesign of it.

    // 1 Last session: what was agreed, and what is marked done.
    function renderLastSession(d) {
      var w = d.weekly;
      var ls = w && w.last_session;
      if (!ls) { return ""; }

      var actions = isEn() ? (ls.client_action_items_en || ls.client_action_items_pt)
                           : (ls.client_action_items_pt || ls.client_action_items_en);
      var follow  = isEn() ? (ls.rafa_followups_en || ls.rafa_followups_pt)
                           : (ls.rafa_followups_pt || ls.rafa_followups_en);

      var tasks = ls.tasks || [];
      var clientTasks = [];
      var rafaTasks   = [];
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].type === "consultant") { rafaTasks.push(tasks[i]); }
        else { clientTasks.push(tasks[i]); }
      }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("A &#250;ltima sess&#227;o", "Last session") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn(escHtml("Sessão de " + ls.date + "."),
                escHtml("Session of " + ls.date + ".")) + '</p>';

      // The live task rows carry a real done flag, so they are shown as the
      // record of what was agreed. The prose blocks below are the write-up.
      if (clientTasks.length || rafaTasks.length) {
        h += taskBlock(ptEn("O que o cliente ficou de fazer", "What the client agreed to do"), clientTasks);
        h += taskBlock(ptEn("O que ele ficou de fazer", "What he agreed to do"), rafaTasks);
      }

      if (actions) {
        h += '<p class="plan-label" style="margin-top:14px;">' +
             ptEn("Combinado com o cliente", "Agreed with the client") + '</p>';
        h += '<div class="story-narr">' + narrativeHtml(actions) + '</div>';
      }
      if (follow) {
        h += '<p class="plan-label">' + ptEn("Os retornos dele", "His follow-ups") + '</p>';
        h += '<div class="story-narr">' + narrativeHtml(follow) + '</div>';
      }
      h += '</div>';
      return h;
    }

    // Three states, never a checkbox. "Nao fez" and "ainda nao chegamos nisso"
    // are different facts, and an unchecked box read as an accusation for a
    // task that was never due. Nothing ever defaults to done.
    function taskState(t) {
      if (t.status === "done") {
        return { cls: "ts-done", mark: "&#10003;", pt: "feito", en: "done" };
      }
      if (t.status === "not_done") {
        return { cls: "ts-not", mark: "&#215;", pt: "n&#227;o fez", en: "not done" };
      }
      return { cls: "ts-pend", mark: "&#8212;", pt: "pendente", en: "pending" };
    }

    function taskBlock(labelHtml, rows) {
      if (!rows.length) { return ""; }
      var h = '<p class="plan-label" style="margin-top:12px;">' + labelHtml + '</p>';
      for (var i = 0; i < rows.length; i++) {
        var t = rows[i];
        var st = taskState(t);
        h += '<div class="task-row">';
        h += '<span class="task-mark ' + st.cls + '">' + st.mark + '</span>';
        h += '<div class="task-main"><div class="task-desc">' + escHtml(t.description || "") + '</div>';
        h += '<div class="task-meta"><span class="task-state ' + st.cls + '">' +
             ptEn(st.pt, st.en) + '</span>';
        if (t.due_date) { h += '<span class="task-due">' + escHtml(t.due_date) + '</span>'; }
        h += '</div>';
        if (t.nota) { h += '<div class="task-note">' + escHtml(t.nota) + '</div>'; }
        h += '</div></div>';
      }
      return h;
    }

    // 2 Indicators, worst first. Capped on purpose -- see the note in the
    // section itself. Zeros and behind-pace only; the rest expand.
    function renderWeeklyIndicators(d) {
      var w = d.weekly;
      if (!w) { return ""; }
      var behind = w.behind || [];
      var onPace = w.on_pace || [];
      if (!behind.length && !onPace.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Os indicadores, pior primeiro", "Indicators, worst first") + '</p>';

      if (!behind.length) {
        h += '<p class="ind-ok">' +
             ptEn(escHtml("Todos os " + onPace.length + " indicadores com meta estão no ritmo do mês."),
                  escHtml("All " + onPace.length + " indicators with a target are on pace for the month.")) +
             '</p>';
      } else {
        for (var i = 0; i < behind.length; i++) { h += indicatorLine(behind[i]); }
      }

      if (onPace.length && behind.length) {
        h += '<details class="area-d" style="margin-top:12px;"><summary>' +
             '<span class="area-more">' +
             '<span class="area-more-shut">' +
             ptEn(escHtml("Ver os outros " + onPace.length + " indicadores"),
                  escHtml("See the other " + onPace.length + " indicators")) +
             '</span>' +
             '<span class="area-more-open">' + ptEn("Fechar", "Close") + '</span>' +
             '</span></summary><div style="margin-top:8px;">';
        for (var j = 0; j < onPace.length; j++) { h += indicatorLine(onPace[j]); }
        h += '</div></details>';
      }
      h += '</div>';
      return h;
    }

    // His own sentence shape: done N, goal M, N missing.
    function indicatorLine(x) {
      var name = isEn() ? (x.label_en || x.label_pt) : (x.label_pt || x.label_en);
      var done = (x.realizado === null || x.realizado === undefined)
        ? null : fmtInd(x.realizado, x.type);
      var goal = fmtInd(x.meta_mensal, x.type);

      var h = '<div class="ind-row"><span class="ind-name">' + escHtml(name) + '</span> &middot; ';
      if (done === null) {
        h += ptEn("sem registro", "nothing logged") + ', ' +
             ptEn("meta ", "goal ") + '<span class="ind-num">' + goal + '</span>';
      } else {
        var missTxt = "";
        if (x.falta !== null && x.falta !== undefined && x.falta > 0) {
          missTxt = ', <span class="ind-miss">' + fmtInd(x.falta, x.type) + ' ' +
                    (isEn() ? "missing" : "faltando") + '</span>';
        }
        h += ptEn("feito ", "done ") + '<span class="ind-num">' + done + '</span>, ' +
             ptEn("meta ", "goal ") + '<span class="ind-num">' + goal + '</span>' + missTxt;
      }
      h += '</div>';
      return h;
    }

    // 3 The week, day by day. The client page's component, same endpoint and
    // same eight states -- deliberately NOT a simplified version, and never
    // collapsed to "5 of 7 days": a client answers "I think I did it all", and
    // the point is to be able to name the days.
    var WEEK_START = null;

    var WK_STATES = {
      completed:     { color: "#3f7d4e", bg: "rgba(63,125,78,0.12)",  pt: "Completo",          en: "Completed" },
      filled_late:   { color: "#8a6d1d", bg: "rgba(201,164,58,0.18)", pt: "Preenchido depois", en: "Filled late" },
      day_off:       { color: "#6b6660", bg: "rgba(107,102,96,0.12)", pt: "Folga",             en: "Day off" },
      not_scheduled: { color: "#b8b2a8", bg: "transparent",           pt: "N&#227;o trabalha", en: "Not scheduled" },
      partial:       { color: "#8a6d1d", bg: "rgba(201,164,58,0.18)", pt: "Parcial",           en: "Partial" },
      missing:       { color: "#b44040", bg: "rgba(180,64,64,0.1)",   pt: "Sem registro",      en: "Missing" },
      future:        { color: "#b8b2a8", bg: "transparent",           pt: "&#8212;",           en: "&#8212;" },
      not_tracked:   { color: "#b8b2a8", bg: "transparent",           pt: "&#8212;",           en: "&#8212;" }
    };

    function mondayOf(d) {
      var t = new Date(d.getTime());
      var dow = (t.getUTCDay() + 6) % 7;
      t.setUTCDate(t.getUTCDate() - dow);
      return t.toISOString().slice(0, 10);
    }

    function shiftWeek(days) {
      var base = WEEK_START || mondayOf(new Date());
      var dt = new Date(base + "T12:00:00Z");
      dt.setUTCDate(dt.getUTCDate() + days);
      WEEK_START = mondayOf(dt);
      loadWeek();
    }

    function thisWeek() { WEEK_START = null; loadWeek(); }

    function loadWeek() {
      var box = document.getElementById("weekBody");
      if (!box) { return; }
      var qs = WEEK_START ? "?start=" + encodeURIComponent(WEEK_START) : "";
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/weekly-summary" + qs)
        .then(function(res) { return res.json(); })
        .then(function(data) { renderWeek(data); })
        .catch(function() {
          var el = document.getElementById("weekBody");
          if (el) { el.innerHTML = ""; }
        });
    }

    function renderWeek(data) {
      var el = document.getElementById("weekBody");
      if (!el) { return; }
      var days = data.days || [];
      if (!days.length) { el.innerHTML = ""; return; }

      var dayNames = isEn()
        ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
        : ["Seg", "Ter", "Qua", "Qui", "Sex", "S&#225;b", "Dom"];

      var first = days[0].date;
      var last  = days[days.length - 1].date;
      var today = new Date().toISOString().slice(0, 10);
      var isCurrent = today >= first && today <= last;

      var h = '<div class="wk-head"><div class="wk-nav">';
      h += '<button type="button" class="wk-btn" onclick="shiftWeek(-7)">&#8249;</button>';
      h += '<button type="button" class="wk-btn" onclick="shiftWeek(7)">&#8250;</button>';
      // "Esta semana" only when he is not already on it.
      if (!isCurrent) {
        h += '<button type="button" class="wk-btn" onclick="thisWeek()">' +
             ptEn("Esta semana", "This week") + '</button>';
      }
      h += '</div><div class="wk-range">' + escHtml(first) + ' &#8211; ' + escHtml(last) + '</div></div>';

      h += '<div class="wk-grid">';
      for (var i = 0; i < days.length; i++) {
        var dday = days[i];
        var m = WK_STATES[dday.status] || WK_STATES.missing;
        var clickable = dday.status !== "future" && dday.status !== "not_tracked" &&
                        dday.status !== "not_scheduled";
        var cls = "wk-day" + (dday.date === today ? " is-today" : "");
        var open = clickable
          ? '<a class="' + cls + '" style="display:block;text-decoration:none;color:inherit;background:' + m.bg +
            ';" href="' + clientHref("&day=" + encodeURIComponent(dday.date)) +
            '" target="_blank" rel="noopener"'
          : '<div class="' + cls + '" style="background:' + m.bg + ';"';
        if (dday.reason) { open += ' title="' + escHtml(dday.reason) + '"'; }
        h += open + '>';
        h += '<div class="wk-dow">' + dayNames[i] + '</div>';
        h += '<div class="wk-num">' + escHtml(dday.date.split("-")[2]) + '</div>';
        h += '<div class="wk-state" style="color:' + m.color + ';">' + ptEn(m.pt, m.en) + '</div>';
        h += clickable ? '</a>' : '</div>';
      }
      h += '</div>';

      var reasons = days.filter(function(x) { return x.reason; });
      if (reasons.length) {
        h += '<div class="wk-reasons">';
        for (var r = 0; r < reasons.length; r++) {
          h += '<div>' + escHtml(reasons[r].date) + ': ' + escHtml(reasons[r].reason) + '</div>';
        }
        h += '</div>';
      }

      h += '<p class="wk-blind">' +
           ptEn("Um zero registrado e um dia n&#227;o preenchido n&#227;o s&#227;o a mesma coisa, e a diferen&#231;a est&#225; nomeada aqui dia a dia.",
                "A logged zero and a day nobody filled in are not the same thing, and the difference is named here day by day.") +
           '</p>';
      el.innerHTML = h;
    }

    // The container. The week itself loads after render(), since it has its
    // own endpoint and its own navigation.
    function renderWeekCard(d) {
      if (!d.weekly) { return ""; }
      return '<div class="card"><p class="sec-title">' +
             ptEn("A semana, dia a dia", "The week, day by day") + '</p>' +
             '<div id="weekBody"></div></div>';
    }

    // 4 Pipeline, then projects and margin. "O ouro" -- never summarised
    // here, because he needs to drill into the actual leads and the real
    // per-project margin, not read a number off this page.
    function renderGold(d) {
      if (!d.weekly) { return ""; }
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Pipeline, projetos e margem", "Pipeline, projects and margin") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Abre nas telas reais, para entrar lead a lead e projeto a projeto.",
                "Opens the real screens, to go lead by lead and project by project.") + '</p>';
      h += '<a class="step-link" href="' + clientHref("&section=gmcrm") + '" target="_blank" rel="noopener">' +
           ptEn("Abrir o pipeline", "Open the pipeline") + '</a>';
      h += '<a class="step-link" href="' + clientHref("&section=gmjobs") + '" target="_blank" rel="noopener">' +
           ptEn("Abrir os projetos", "Open the projects") + '</a>';
      // There is no staff-side pipeline or jobs screen at all -- gm.js loads
      // only inside the portal -- so these links are read-only and say so.
      h += '<span class="step-note">' + linkNoteReadOnly() + ' ' +
           ptEn("N&#227;o existe tela da equipe para pipeline e projetos: para alterar, o cliente faz no login dele.",
                "There is no staff screen for pipeline and projects: to change anything, the client does it on their own login.") +
           '</span>';
      h += '</div>';

      // 5 Financeiro, a fixed beat of his meeting.
      h += '<div class="card"><p class="sec-title">' +
           ptEn("Financeiro", "Finances") + '</p>';
      h += '<a class="step-link" href="' + clientHref("&section=gmfinance") + '" target="_blank" rel="noopener">' +
           ptEn("Abrir o financeiro", "Open the finances") + '</a>';
      h += '<span class="step-note">' + linkNoteReadOnly() + '</span>';
      h += '</div>';
      return h;
    }

    // 6 Relatorio estrategico. He reads this out at the end, so last
    // session's three lines are carried forward for him to build on.
    function renderStrategic(d) {
      var w = d.weekly;
      var ls = w && w.last_session;
      if (!ls) { return ""; }

      var focus = isEn() ? (ls.next_session_focus_en || ls.next_session_focus_pt)
                         : (ls.next_session_focus_pt || ls.next_session_focus_en);
      var summ  = isEn() ? (ls.summary_en || ls.summary_pt)
                         : (ls.summary_pt || ls.summary_en);
      if (!focus && !summ) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Relat&#243;rio estrat&#233;gico", "Strategic report") + '</p>';
      h += '<p class="step-ctx">' +
           ptEn("Da &#250;ltima sess&#227;o, para levar adiante.",
                "From last session, to carry forward.") + '</p>';
      if (focus) {
        h += '<p class="plan-label">' + ptEn("O foco da pr&#243;xima sess&#227;o", "Next session's focus") + '</p>';
