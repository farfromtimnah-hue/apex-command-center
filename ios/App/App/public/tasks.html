<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!-- GLOBAL JS ERROR HOOK. Must be the FIRST script on the page, before
       native-bridge.js?v=1788495974, so it is installed before anything that can throw.

       WHY: the log showed "⚡️ JS Eval error A JavaScript exception occurred"
       with no detail, and every downstream symptom (no WIRE-INIT, no WIRE-POLL,
       no replay block, hasListeners=false forever) is consistent with a script
       dying early. Capacitor only prints that generic string, so the actual
       message, file, line and stack have to be captured here.

       Buffers into a cookie as well as the console, because the native log is
       only reachable once the Capacitor plugin exists -- which is exactly what
       may not have happened yet when the error fires. native-bridge.js?v=1788495974 replays
       this buffer into the native log once the plugin appears. -->
  <script>
  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      // Same cookie the trace buffer uses, so one replay surfaces both.
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      // And straight to native if the plugin is already up.
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      // Resource load failures (img/script 404) surface here with no ev.error;
      // they are worth seeing too, since a failed script tag would explain a
      // missing function just as well as a thrown exception.
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">

  <script src="datetime.js"></script>
  <title data-title-pt="Apex — Tarefas" data-title-en="Apex &#8212; Tasks">Apex — Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface  : #f9f7f4;
      --header   : #1a1a1d;
      --gold     : #C9A43A;
      --gold-dim : rgba(201,164,58,0.14);
      --brown    : #7a5c2e;
      --text     : #1a1a1d;
      --muted    : #6b6660;
      --border   : #e8e2d9;
      --card     : #ffffff;
      --radius   : 10px;
      --shadow   : 0 2px 16px rgba(26,26,29,0.08);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Bilingual toggle ──────────────────────────────────────────────── */
    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    /* ─── Header ────────────────────────────────────────────────────────── */
    #appHeader {
      background: var(--header);
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
    }

    .logo-img { height: 32px; width: auto; display: block; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
    }

    .role-badge {
      background: var(--gold-dim);
      border: 1px solid rgba(201,164,58,0.4);
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .btn-header {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-header:hover { border-color: rgba(255,255,255,0.45); color: #fff; }

    .lang-btn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-btn:hover { background: var(--gold-dim); }

    /* ─── Loading screen ─────────────────────────────────────────────────── */
    #loadingScreen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    #loadingScreen[hidden] { display: none !important; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── App main ───────────────────────────────────────────────────────── */
    #appMain {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ─── Tasks hero section ─────────────────────────────────────────────── */
    .tasks-hero-section {
      position: relative;
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #tasksHeroBg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: center center;
    }

    @keyframes kenburns {
      from { transform: scale(1.0) translate(0, 0); }
      to   { transform: scale(1.06) translate(1.5%, 0.8%); }
    }

    #tasksHeroBg.is-loaded {
      animation: kenburns 28s ease-in-out infinite alternate;
    }

    #tasksHeroScrim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: rgba(20, 18, 16, 0.62);
    }

    .tasks-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ─── Glass tiles ────────────────────────────────────────────────────── */
    .glass-tile-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .glass-tile {
      background: rgba(26, 22, 18, 0.52);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 16px 20px;
      flex: 1;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .glass-tile-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    .glass-tile-value {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    /* ─── Page heading (white over photo) ───────────────────────────────── */
    .page-heading-hero {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    /* ─── Page header row ────────────────────────────────────────────────── */
    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* ─── Speak my tasks (same control as the dashboard card) — hero dark bg ─ */
    .mt-speak-block { margin-bottom: 18px; }
    .mt-speak-block[hidden] { display: none; }
    .mt-speak { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 0 8px; }
    .btn-voice-mic {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      background: #c9a227; color: #1a1712; border: none;
    }
    .btn-voice-mic:hover    { opacity: 0.88; }
    .btn-voice-mic.recording { background: #b4322a; color: #fff; }
    .btn-voice-mic[disabled] { opacity: 0.55; cursor: default; }
    .mt-timer { font-size: 13px; color: rgba(255,255,255,0.8); font-variant-numeric: tabular-nums; }
    .mt-link-btn {
      background: none; border: none; padding: 6px 4px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; color: rgba(255,255,255,0.8); text-decoration: underline;
    }
    .mt-link-btn[hidden] { display: none; }
    .mt-status { padding: 2px 0 8px; font-size: 13px; color: rgba(255,255,255,0.8); }
    .mt-status:empty { display: none; }
    .mt-status.is-error { color: #ffb4a8; }
    .mt-status.is-ok { color: #fff; font-weight: 600; }
    .mt-heard { padding: 0 0 8px; }
    .mt-heard[hidden] { display: none; }
    .mt-heard-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
    .voice-transcript {
      background: #f1ece2; color: #1a1712; border-radius: 8px; padding: 12px;
      font-size: 14px; margin: 6px 0 0; white-space: pre-wrap;
    }

    /* ─── Help requests (same-day, always visible) ──────────────────────── */
    .help-requests-section {
      margin-bottom: 18px;
    }

    .help-requests-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #e8c96a;
      margin-bottom: 8px;
    }

    #helpRequestsContainer {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-row.help-request {
      border-left: 3px solid #b44040;
    }

    /* ─── Role tabs (Consultant / Client) — hero dark bg ────────────────── */
    .role-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }

    .role-tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }

    .role-tab-btn.active {
      color: #fff;
      border-bottom-color: var(--gold);
    }

    .role-tab-btn:not(.active):hover {
      color: rgba(255,255,255,0.85);
    }

    .role-tab-count {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      margin-left: 6px;
      color: rgba(255,255,255,0.65);
      vertical-align: middle;
    }

    .role-tab-btn.active .role-tab-count {
      background: rgba(201,164,58,0.3);
      border-color: rgba(201,164,58,0.5);
      color: #e8c96a;
    }

    /* ─── Controls bar (sort + done count) ──────────────────────────────── */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ─── View toggle pills — hero dark bg ──────────────────────────────── */
    .view-toggle {
      display: flex;
      gap: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(26,22,18,0.45);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .view-toggle-btn {
      background: transparent;
      border: none;
      padding: 7px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }

    .view-toggle-btn + .view-toggle-btn {
      border-left: 1px solid rgba(255,255,255,0.14);
    }

    .view-toggle-btn.active {
      background: var(--gold);
      color: #000;
    }

    .view-toggle-btn:not(.active):hover {
      color: #fff;
    }

    /* ─── Done counter chip ──────────────────────────────────────────────── */
    .done-chip {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
    }

    /* ─── Client filter — hero dark bg ──────────────────────────────────── */
    .client-filter-label {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
    }

    /* ─── Below hero section ─────────────────────────────────────────────── */
    .below-hero-section {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── Task cards container ───────────────────────────────────────────── */
    #tasksContainer {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ─── Group heading (by-type view) ──────────────────────────────────── */
    .group-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 16px 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .group-heading:first-child {
      padding-top: 0;
    }

    /* ─── Task row ───────────────────────────────────────────────────────── */
    .task-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: border-color 0.12s, opacity 0.15s;
    }

    .task-row:hover {
      border-color: rgba(201,164,58,0.5);
    }

    /* .task-row.done intentionally removed — done tasks leave the tab entirely */

    /* ─── Checkbox toggle ────────────────────────────────────────────────── */
    .task-check {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.12s, background 0.12s;
      padding: 0;
    }

    .task-check:hover {
      border-color: var(--gold);
    }

    .task-check.checked {
      border-color: #888;
      background: #888;
    }

    .task-check.checked::after {
      content: "";
      display: block;
      width: 5px;
      height: 9px;
      border: 1.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 5px;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-client {
      font-size: 12px;
      font-weight: 600;
      color: var(--brown);
      text-decoration: none;
    }
    .task-client:hover { text-decoration: underline; }

    .task-session-date {
      font-size: 12px;
      color: var(--muted);
    }

    .task-due {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      padding: 2px 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .task-due.overdue {
      color: #b44040;
      border-color: rgba(180,64,64,0.3);
      background: #fff0f0;
    }

    .task-type-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .task-type-tag.rafa   { color: var(--brown); border-color: rgba(201,164,58,0.4); background: var(--gold-dim); }
    .task-type-tag.client { color: #3a5f9a; border-color: rgba(58,95,154,0.3); background: rgba(58,95,154,0.08); }

    /* ─── Empty state ────────────────────────────────────────────────────── */
    .tasks-empty {
      padding: 52px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .tasks-empty-icon {
      font-size: 36px;
      opacity: 0.5;
    }

    /* ─── Session source note (footer-style) ────────────────────────────── */
    .tasks-footer-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 8px 0 4px;
    }

    /* ─── Overdue section (in-tab) ──────────────────────────────────────── */
    .overdue-section-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #b44040;
      padding: 14px 0 6px;
      border-bottom: 1px solid rgba(180,64,64,0.25);
      margin-bottom: 4px;
    }

    .overdue-section-header:first-child {
      padding-top: 0;
    }

    /* ─── Done section headers (inside Done tab) ─────────────────────────── */
    .done-section-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .done-section-header:first-child {
      padding-top: 0;
    }

    /* ─── Client filter row ─────────────────────────────────────────────── */
    .client-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .client-filter-select {
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 4px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      background: rgba(26,22,18,0.45);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      max-width: 200px;
    }
    .client-filter-select:focus { border-color: var(--gold); }

    /* ─── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .tasks-hero-section { padding: 16px; }
      .below-hero-section { padding: 16px; }
      .glass-tile { min-width: 100px; padding: 12px 14px; }
      .glass-tile-value { font-size: 22px; }
      .task-meta { gap: 6px; }
      .overdue-row { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #tasksHeroBg.is-loaded { animation: none; }
    }
  </style>
</head>
<body class="lang-pt">

  <!-- ═══════════════ HEADER ═══════════════════════════════════════════════ -->
  <header id="appHeader">
    <div class="header-right">
      <div class="user-pill">
        <span id="headerEmail"></span>
        <span class="role-badge" id="headerRole"></span>
      </div>
      <button class="lang-btn" onclick="apexNavToggleLang()">
        <span class="show-pt">EN</span>
        <span class="show-en">PT</span>
      </button>
      <button class="btn-header" onclick="handleSignOut()">
        <span class="show-pt">Sair</span>
        <span class="show-en">Sign out</span>
      </button>
    </div>
  </header>

  <div id="pageWrapper">
    <div id="navSidebar"></div>
    <div id="contentArea">

  <!-- ═══════════════ LOADING SCREEN ═══════════════════════════════════════ -->
  <div id="loadingScreen">
