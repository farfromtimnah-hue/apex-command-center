      for (var i = 0; i < remainingTasks.length; i++) {
        if (remainingTasks[i].dueDate) { dated.push(remainingTasks[i]); }
        else                            { undated.push(remainingTasks[i]); }
      }
      dated.sort(function(a, b) { return a.dueDate - b.dueDate; });
      undated.sort(function(a, b) { return a.clientName.localeCompare(b.clientName); });

      var sorted = dated.concat(undated);

      if (overdueTasks.length > 0 && sorted.length > 0) {
        container.appendChild(makeUpcomingSectionHeader());
      }

      for (var j = 0; j < sorted.length; j++) {
        container.appendChild(makeTaskRow(sorted[j], showTypeTag));
      }

      container.appendChild(makeFooterNote());
    }

    // ── Render: by type ────────────────────────────────────────────────────

    function renderByType() {
      var container = document.getElementById("tasksContainer");
      container.innerHTML = "";

      var tabTasks = getTabTasks();

      if (tabTasks.length === 0) {
        container.appendChild(makeEmpty());
        return;
      }

      var today = new Date();
      today.setHours(0, 0, 0, 0);

      var overdueTasks    = tabTasks.filter(function(t) { return t.dueDate && t.dueDate < today && !completedMap[t.key]; });
      var nonOverdueTasks = tabTasks.filter(function(t) { return !completedMap[t.key] && !(t.dueDate && t.dueDate < today); });

      if (overdueTasks.length > 0) {
        overdueTasks.sort(function(a, b) { return a.dueDate - b.dueDate; });
        container.appendChild(makeOverdueSectionHeader(overdueTasks.length));
        for (var oi = 0; oi < overdueTasks.length; oi++) {
          container.appendChild(makeTaskRow(overdueTasks[oi], false));
        }
      }

      function sortGroup(arr) {
        var dated   = arr.filter(function(t) { return t.dueDate; });
        var undated = arr.filter(function(t) { return !t.dueDate; });
        dated.sort(function(a, b) { return a.dueDate - b.dueDate; });
        undated.sort(function(a, b) { return a.clientName.localeCompare(b.clientName); });
        return dated.concat(undated);
      }

      function appendGroup(labelPt, labelEn, tasks) {
        if (tasks.length === 0) { return; }
        var heading = document.createElement("div");
        heading.className = "group-heading";
        heading.innerHTML =
          '<span class="show-pt">' + escHtml(labelPt) + ' (' + tasks.length + ')</span>' +
          '<span class="show-en">' + escHtml(labelEn) + ' (' + tasks.length + ')</span>';
        container.appendChild(heading);
        var sorted = sortGroup(tasks);
        for (var i = 0; i < sorted.length; i++) {
          container.appendChild(makeTaskRow(sorted[i], false));
        }
      }

      if (tabRole === "consultant") {
        var rafaTasks = nonOverdueTasks.filter(function(t) { return t.type === "rafa"; });
        var textTasks = nonOverdueTasks.filter(function(t) { return t.type === "text"; });
        appendGroup("Follow-ups do Consultor", "Consultant Follow-ups", rafaTasks);
        appendGroup("Resumo de Follow-ups",     "Follow-up Summary",    textTasks);
      } else {
        appendGroup("Ações do Cliente", "Client Action Items", nonOverdueTasks);
      }

      container.appendChild(makeFooterNote());
    }

    // ── Sections that open and close ──────────────────────────────────────

    // One header with what it opens under it. The header is a real button
    // (Tab reaches it, Enter and Space press it) and says with aria-expanded
    // whether it is open. fill(body) draws what is inside, the first time it
    // is opened; onToggle(open) is told each time the person opens or closes it.
    function makeFold(level, labelHtml, count, isOpen, onToggle, fill) {
      var wrap = document.createElement("div");
      wrap.className = "fold fold-l" + level;

      var body = document.createElement("div");
      body.className = "fold-body";
      foldSeq++;
      body.id = "foldBody" + foldSeq;

      var head = document.createElement("button");
      head.type = "button";
      head.className = "fold-head";
      head.setAttribute("aria-controls", body.id);
      head.innerHTML =
        '<span class="fold-caret" aria-hidden="true">&#9656;</span>' +
        '<span class="fold-label">' + labelHtml + '</span>' +
        '<span class="fold-count">' + count + '</span>';

      var filled = false;
      function show(open) {
        head.setAttribute("aria-expanded", open ? "true" : "false");
        body.hidden = !open;
        if (open && !filled) { filled = true; fill(body); }
      }
      head.onclick = function() {
        var open = head.getAttribute("aria-expanded") !== "true";
        show(open);
        if (onToggle) { onToggle(open); }
      };
      show(!!isOpen);

      wrap.appendChild(head);
      wrap.appendChild(body);
      return wrap;
    }

    function makeQuietLine(pt, en) {
      var el = document.createElement("div");
      el.className = "fold-quiet";
      el.innerHTML = mtBoth(pt, en);
      return el;
    }

    // The names of the sections, the same words as the dashboard's task card
    // (and, for Client and Consultant, as the tabs of this page).
    var SECTION_LABELS = {
      mine:       ["Minhas", "Mine"],
      sessions:   ["Das sess&otilde;es", "From sessions"],
      given:      ["Passei para outros", "Given to others"],
      client:     ["Cliente", "Client"],
      consultant: ["Consultor", "Consultant"]
    };

    function sectionLabelHtml(key) {
      return mtBoth(SECTION_LABELS[key][0], SECTION_LABELS[key][1]);
    }

    // How a row of a section is drawn (see makeTaskRow).
    function sectionRowMode(key) {
      if (key === "given") { return "given"; }
      if (key === "mine" || key === "sessions") { return "own"; }
      return "";
    }

    // ── Render: My tasks tab ──────────────────────────────────────────────
    // The viewer's open tasks in the three lists of their dashboard: Mine,
    // From sessions, Given to others. All of them: no row limit here.

    var MINE_EMPTY = {
      mine:     ["Nenhuma tarefa sua em aberto.", "No open tasks of your own."],
      sessions: ["Nenhuma tarefa de sess&atilde;o em aberto.", "No open tasks from sessions."],
      given:    ["Nada passado para outros.", "Nothing given to others."]
    };

    function mineSectionRows(key, role) {
      var rows = tasksInSection(allTasks, role, key, false, completedMap);
      if (clientFilter) {
        rows = rows.filter(function(t) { return t.clientName === clientFilter; });
      }
      if (overdueOnly) {
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        rows = rows.filter(function(t) { return t.dueDate && t.dueDate < today; });
      }
      return sortSectionTasks(key, role, rows);
    }

    function appendMineSection(container, key, role) {
      var rows = mineSectionRows(key, role);
      // From the overdue link every section is open, whatever was remembered.
      var open = overdueOnly || !mineClosed[key];
      container.appendChild(makeFold(1, sectionLabelHtml(key), rows.length, open,
        function(isOpen) {
          if (overdueOnly) { return; }
          mineClosed[key] = !isOpen;
          saveMineFolds();
        },
        function(body) {
          if (!rows.length) {
            body.appendChild(makeQuietLine(MINE_EMPTY[key][0], MINE_EMPTY[key][1]));
            return;
          }
          for (var i = 0; i < rows.length; i++) {
            body.appendChild(makeTaskRow(rows[i], false, false, sectionRowMode(key)));
          }
        }));
    }

    function renderMineTab() {
      var container = document.getElementById("tasksContainer");
      if (!container) { return; }
      container.innerHTML = "";
      var role = viewerRole();

      if (overdueOnly) {
        // The dashboard's overdue tile counts the consultant's own tasks:
        // Mine and From sessions. Given to others is not part of that number.
        var late = mineSectionRows("mine", role).length + mineSectionRows("sessions", role).length;
        container.appendChild(makeOverdueSectionHeader(late));
        appendMineSection(container, "mine", role);
        appendMineSection(container, "sessions", role);
        return;
      }

      appendMineSection(container, "mine", role);
      appendMineSection(container, "sessions", role);
      appendMineSection(container, "given", role);
    }

    // ── Render: Done tab ──────────────────────────────────────────────────
    // Every done task, with no time limit. Sections, then months, then (for
    // Given to others) the person the task was given to. Everything starts
    // closed; archOpen remembers what is open while the person stays here,
    // so reopening a task does not close the month it was in.

    function appendArchiveRows(body, tasks, mode) {
      for (var i = 0; i < tasks.length; i++) {
        body.appendChild(makeTaskRow(tasks[i], false, true, mode));
      }
    }

    function archivePersonLabelHtml(person) {
      // The system is never a person's name.
      if (person.key === "developer") { return mtBoth("Sistema", "System"); }
      return escHtml(person.name || "");
    }

    function appendArchivePerson(body, openKey, person, mode) {
      body.appendChild(makeFold(3, archivePersonLabelHtml(person), person.tasks.length, !!archOpen[openKey],
        function(isOpen) { archOpen[openKey] = isOpen; },
        function(inner) { appendArchiveRows(inner, person.tasks, mode); }));
    }

    function appendArchiveMonth(body, sectionKey, month, mode) {
      var openKey = sectionKey + "|" + month.key;
      var label = archiveMonthLabel(month.key);
      body.appendChild(makeFold(2, mtBoth(label.pt, label.en), month.tasks.length, !!archOpen[openKey],
        function(isOpen) { archOpen[openKey] = isOpen; },
        function(inner) {
          if (!month.people) { appendArchiveRows(inner, month.tasks, mode); return; }
          for (var i = 0; i < month.people.length; i++) {
            appendArchivePerson(inner, openKey + "|" + month.people[i].key, month.people[i], mode);
          }
        }));
    }

    function appendArchiveSection(container, key, role) {
      var tasks = tasksInSection(allTasks, role, key, true, completedMap);
      var mode = sectionRowMode(key);
      container.appendChild(makeFold(1, sectionLabelHtml(key), tasks.length, !!archOpen[key],
        function(isOpen) { archOpen[key] = isOpen; },
        function(body) {
          if (!tasks.length) {
            body.appendChild(makeQuietLine("Nada conclu&iacute;do aqui.", "Nothing done here."));
            return;
          }
          var months = key === "given" ? buildArchiveGivenTree(tasks) : buildArchiveMonths(tasks);
          for (var i = 0; i < months.length; i++) {
            appendArchiveMonth(body, key, months[i], mode);
          }
        }));
    }

    function renderDoneTab() {
      var container = document.getElementById("tasksContainer");
      if (!container) { return; }
      container.innerHTML = "";
      var role = viewerRole();
      var keys = archiveSectionKeys(role);
      for (var i = 0; i < keys.length; i++) {
        appendArchiveSection(container, keys[i], role);
      }
    }

    // ── Completion toggle ──────────────────────────────────────────────────

    // taskKey is the tasks-table row id. The write goes to /api/tasks/:id, so
    // the same row backs Rafa's page, the client profile and the Overview
    // tile — previously this wrote to sessions.task_completions, which only
    // this page ever read.
    function toggleComplete(taskKey, sessionId) {
      var newVal = !completedMap[taskKey];
      completedMap[taskKey] = newVal;
      // The moment it was marked done, for the tag on a handed-out task; the
      // Worker records its own. Put back as it was if the write fails.
      var toggled = null;
      for (var ti = 0; ti < allTasks.length; ti++) { if (allTasks[ti].key === taskKey) { toggled = allTasks[ti]; } }
      var hadCompletedAt = toggled ? toggled.completedAt : null;
      if (toggled) { toggled.completedAt = newVal ? new Date().toISOString() : null; }

      // Optimistic: repaint now, reconcile if the write fails.
      updateTabCounts();
      updateTasksHeroTiles();
      updateDoneChip(getTabTasks());
      renderTaskView();

      user_getToken().then(function(token) {
        return fetch(WORKER_URL + "/api/tasks/" + encodeURIComponent(taskKey), {
          method: "PATCH",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ status: newVal ? "done" : "pending" })
        });
      }).then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
      }).catch(function() {
        // Roll back rather than fail silently: leaving the checkbox ticked
        // while D1 still says pending is the exact divergence this unification
        // was meant to remove.
        completedMap[taskKey] = !newVal;
        if (toggled) { toggled.completedAt = hadCompletedAt; }
        updateTabCounts();
        updateTasksHeroTiles();
        updateDoneChip(getTabTasks());
        renderTaskView();
      });
    }

    // ── DOM builders ───────────────────────────────────────────────────────

    // Is this task given, and by which role? Given = created_by_role is set
    // and differs from the owner (assigned_to, or the consultant when empty).
    function taskGivenBy(task) {
      var by = task.createdByRole ? String(task.createdByRole) : "";
      if (!by) { return null; }
      var owner = task.assignedTo ? String(task.assignedTo) : "rafa";
      return by === owner ? null : by;
    }

    // mode says which list the row is in:
    //   "own"    a section of the viewer's own tasks (Mine, From sessions):
    //            a checkbox, and a From tag when someone else gave it.
    //   "given"  Given to others: no checkbox, and a tag saying who has it.
    //   ""       the Client and Consultant lists, drawn as they always were.
    function makeTaskRow(task, showTypeTag, suppressDoneStyle, mode) {
      var isDone = !!completedMap[task.key];
      var showDone = isDone && !suppressDoneStyle;

      var row = document.createElement("div");
      row.className = "task-row" + (showDone ? " done" : "");

      var noCheck = !!task.assignedTo && !givenCanCheck(task);
      if (mode === "given") { noCheck = true; }
      if (mode === "own")   { noCheck = false; }

      if (noCheck) {
        // A task handed to someone else: no checkbox for anyone but that
        // person. An empty space of the same size keeps the words in line.
        var gap = document.createElement("span");
        gap.className = "task-check";
        gap.style.visibility = "hidden";
        gap.setAttribute("aria-hidden", "true");
        row.appendChild(gap);
      } else {
      // Checkbox toggle button
      var check = document.createElement("button");
      check.className = "task-check" + (showDone ? " checked" : "");
      check.title = t("Marcar como concluída", "Mark complete");
      check.setAttribute("aria-label", "Toggle complete");
      // Use a self-contained closure via data attributes to avoid closure issues in loops
      (function(tKey, sId) {
        check.onclick = function() { toggleComplete(tKey, sId); };
      })(task.key, task.sessionId);
      row.appendChild(check);
      }

      var body = document.createElement("div");
      body.className = "task-body";

      // Task text
      var textEl = document.createElement("div");
      textEl.className = "task-text";
      textEl.textContent = task.text;
      body.appendChild(textEl);

      // A staff task can be opened (task-sheet.js): its words open the
      // sheet, the latest note shows under them, and its pill is in the tags.
      // A client's own to-do gets none of it.
      var isStaff = task.type === "rafa";
      var sheetTags = [];
      var noteLine = (isStaff && typeof taskSheetRowNote === "function")
        ? taskSheetRowNote(task.lastNote, task.noteCount) : null;
      if (noteLine) { body.appendChild(noteLine); }

      // Meta line
      var meta = document.createElement("div");
      meta.className = "task-meta";

      // Client name (link if has client_id)
      if (task.clientId) {
        var clientLink = document.createElement("a");
        clientLink.className = "task-client";
        clientLink.href = "client.html?id=" + encodeURIComponent(task.clientId);
        clientLink.textContent = task.clientName;
        meta.appendChild(clientLink);
      } else if (task.clientName) {
        var clientSpan = document.createElement("span");
        clientSpan.className = "task-client";
        clientSpan.style.textDecoration = "none";
        clientSpan.textContent = task.clientName;
        meta.appendChild(clientSpan);
      }

      // Session date
      if (task.sessionDate) {
        var sep = document.createElement("span");
        sep.style.cssText = "color:var(--border);font-size:11px;";
        sep.textContent = "·";
        // No separator in front of the first item (a task with no client).
        if (meta.childNodes.length) { meta.appendChild(sep); }

        var sdEl = document.createElement("span");
        sdEl.className = "task-session-date";
        sdEl.innerHTML =
          '<span class="show-pt">Sessão ' + escHtml(formatDate(task.sessionDate)) + '</span>' +
          '<span class="show-en">Session ' + escHtml(formatDate(task.sessionDate)) + '</span>';
        meta.appendChild(sdEl);
      }

      // Due date pill
      if (task.due) {
        var sep2 = document.createElement("span");
        sep2.style.cssText = "color:var(--border);font-size:11px;";
        sep2.textContent = "·";
        if (meta.childNodes.length) { meta.appendChild(sep2); }

        var dueEl = document.createElement("span");
        dueEl.className = "task-due" + (task.overdue && !isDone ? " overdue" : "");
        dueEl.innerHTML =
          '<span class="show-pt">Prazo: ' + escHtml(formatDate(task.due)) + '</span>' +
          '<span class="show-en">Due: ' + escHtml(formatDate(task.due)) + '</span>';
        meta.appendChild(dueEl);
      }

      // A handed-out task: who has it. Not on the viewer's own row: they
      // know it is theirs.
      var showWho = mode === "given" || (mode !== "own" && !!task.assignedTo);
      if (showWho) {
        var whoEl = document.createElement("span");
        whoEl.className = "task-type-tag";
        // The system is never a person's name.
        if (task.assignedTo === "developer") {
          whoEl.innerHTML = '<span class="show-pt">Sistema</span><span class="show-en">System</span>';
        } else if (task.assignedTo) {
          whoEl.textContent = task.assigneeName || "Alice";
        } else {
          // Given to the consultant.
          whoEl.textContent = task.ownerName || "Rafa";
        }
        meta.appendChild(whoEl);
        sheetTags.push(whoEl.innerHTML);
      }

      // When it was done, on every done row.
      var doneWhen = isDone ? givenDoneWhen(task) : "";
      if (doneWhen) {
        var doneEl = document.createElement("span");
        doneEl.className = "task-due";
        doneEl.innerHTML =
          '<span class="show-pt">Conclu&iacute;da ' + escHtml(doneWhen) + '</span>' +
          '<span class="show-en">Done ' + escHtml(doneWhen) + '</span>';
        meta.appendChild(doneEl);
      }

      // A task someone else gave its owner says who it came from. A task
      // the owner made for themself, or an old row, has no such tag.
      // Rows handed to someone else keep the tag that says who has them.
      var giverRole = null;
      if (mode === "own") { giverRole = taskGivenBy(task); }
      else if (mode !== "given" && !task.assignedTo) { giverRole = taskGivenBy(task); }
      if (giverRole) {
        var fromEl = document.createElement("span");
        fromEl.className = "task-type-tag";
        if (giverRole === "developer") {
          fromEl.innerHTML = '<span class="show-pt">Do sistema</span><span class="show-en">From the system</span>';
        } else {
          var fromName = escHtml(task.giverName || (giverRole === "alice" ? "Alice" : "Rafa"));
          fromEl.innerHTML = '<span class="show-pt">De ' + fromName + '</span><span class="show-en">From ' + fromName + '</span>';
        }
        meta.appendChild(fromEl);
        sheetTags.push(fromEl.innerHTML);
      }

      // Type tag (only shown in consultant tab, by-date view)
      if (showTypeTag && task.type !== "client" && !task.assignedTo) {
        var tagEl = document.createElement("span");
        if (task.type === "rafa") {
          tagEl.className = "task-type-tag rafa";
          tagEl.innerHTML = '<span class="show-pt">Consultor</span><span class="show-en">Consultant</span>';
        } else {
          tagEl.className = "task-type-tag";
          tagEl.innerHTML = '<span class="show-pt">Resumo</span><span class="show-en">Summary</span>';
        }
        meta.appendChild(tagEl);
      }

      // The one-click status, when it is set. A done task has none.
      var pill = (isStaff && !isDone && typeof taskSheetRowPill === "function")
        ? taskSheetRowPill(task.progress, "task-due") : null;
      if (pill) { meta.appendChild(pill); }

      body.appendChild(meta);
      row.appendChild(body);
      if (isStaff && typeof taskSheetMakeOpener === "function") {
        (function(tk, tags, done) {
          taskSheetMakeOpener(textEl, tk.key, function() { openTaskSheet(tk, tags, done); });
        })(task, sheetTags, isDone);
      }
      return row;
    }

    // Opens a staff task in the sheet (task-sheet.js). tags are the
    // who-has-it / who-gave-it tags of the row that was pressed.
    function openTaskSheet(task, tags, isDone) {
      if (typeof taskSheetOpen !== "function") { return; }
      taskSheetOpen({
        id: task.key, description: task.text,
        clientName: task.clientName && task.clientName !== "\u2014" ? task.clientName : "",
        tags: tags, done: !!isDone,
        progress: task.progress || null, dueDate: task.due || null,
        apiBase: WORKER_URL, getToken: user_getToken,
        onChange: taskSheetChanged, onClose: taskSheetClosed
      });
    }

    // What was saved in the sheet goes onto the task this page holds, so the
    // row is right without loading again. The due date is kept the same three
    // ways rowsToTasks keeps it.
    function taskSheetChanged(c) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      for (var i = 0; i < allTasks.length; i++) {
        var tk = allTasks[i];
        if (tk.key !== c.id) { continue; }
        tk.progress = c.progress || null;
        tk.due = c.due_date || null;
        if (c.description) { tk.text = c.description; }
        tk.dueDate = null;
        if (tk.due) {
          var p = String(tk.due).split("-");
          tk.dueDate = new Date(+p[0], +p[1] - 1, +p[2]);
          tk.dueDate.setHours(0, 0, 0, 0);
        }
        tk.overdue = (!completedMap[tk.key] && tk.dueDate) ? tk.dueDate < today : false;
        if (c.hasOwnProperty("note_count")) {
          tk.noteCount = c.note_count || 0;
          tk.lastNote = c.last_note || null;
        }
      }
    }

    // The sheet closed: the counts and the list are drawn again from what the
    // page already holds (no reload).
    function taskSheetClosed() {
      updateTabCounts();
      updateTasksHeroTiles();
      renderTaskView();
    }

    function makeEmpty() {
      var el = document.createElement("div");
      el.className = "tasks-empty";
      el.innerHTML =
        '<div class="tasks-empty-icon">&#10003;</div>' +
        '<span class="show-pt">Nenhuma tarefa encontrada.<br>Tarefas aparecem aqui após sessões serem resumidas.</span>' +
        '<span class="show-en">No tasks found.<br>Tasks appear here after sessions are summarized.</span>';
      return el;
    }

    function makeFooterNote() {
      var el = document.createElement("div");
      el.className = "tasks-footer-note";
      el.innerHTML =
        '<span class="show-pt">Tarefas derivadas automaticamente dos resumos de sessão.</span>' +
        '<span class="show-en">Tasks automatically derived from session summaries.</span>';
      return el;
    }

    // ── Utilities ──────────────────────────────────────────────────────────

        function isEn() {
      return window.apexIsEn ? window.apexIsEn() : document.body.classList.contains("lang-en");
    }
    function t(pt, en) { return isEn() ? en : pt; }

function escHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ── Bootstrap ──────────────────────────────────────────────────────────
    window.onload = function() { init(); };
  </script>

  <!-- Mobile nav containers: static HTML on purpose. A previous runtime-
       injected fixed-position nav broke the desktop flex layout, so these
       must exist in the markup from page load. nav.js only fills them in;
       mobile.css alone controls their visibility and positioning. -->
  <div id="mobile-tab-bar"></div>
  <div id="mobile-more-menu"></div>
</body>
</html>
