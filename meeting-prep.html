<script>
  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      // Same cookie the trace buffer uses, so one replay surfaces both.
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      // And straight to native if the plugin is already up.
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      // Resource load failures (img/script 404) surface here with no ev.error;
      // they are worth seeing too, since a failed script tag would explain a
      // missing function just as well as a thrown exception.
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=1">
  <script src="datetime.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #f9f7f4;
      --header: #1a1a1d;
      --gold: #C9A43A;
      --gold-dim: rgba(201,164,58,0.14);
      --text: #1a1a1d;
      --muted: #6b6660;
      --border: #e8e2d9;
      --card: #ffffff;
      --radius: 10px;
      --shadow: 0 2px 16px rgba(26,26,29,0.08);
      --navy: #14243D;
      --good: #2d6a4f;
      --warn: #8a6d1d;
      --crit: #b44040;
    }

    * { box-sizing: border-box; }

    /* The language toggle. Without these two rules every ptEn() pair renders
       both languages at once and the PT/EN button appears to do nothing. */
    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    /* Without this the page renders black text on a dark ground. */
    body {
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--header);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .header-logo { height: 26px; width: auto; display: block; }
    .header-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #fff; white-space: nowrap;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .hdr-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.28);
      color: #fff; font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.1); }

    main { max-width: 940px; margin: 0 auto; padding: 24px 20px 80px; }

    #stateMsg { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px; margin-bottom: 16px;
    }

    .sec-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
    }

    /* 1 Header block */
    .prep-name { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
    .prep-meta { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .prep-confid {
      font-size: 12px; color: var(--muted); border-top: 1px solid var(--border);
      padding-top: 10px; margin-top: 12px;
    }
    .pkg-open {
      display: inline-block; font-size: 13px; font-weight: 600; color: var(--gold);
      text-decoration: none; border-bottom: 1px solid transparent;
    }
    .pkg-open:hover { border-bottom-color: currentColor; }
    .pkg-note { font-size: 11px; color: var(--muted); margin-left: 8px; }

    /* example=1 label: one quiet line, muted, no banner and no colour block. */
    .example-line { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

    .kv { display: flex; flex-wrap: wrap; gap: 10px 28px; }
    .kv-item { min-width: 130px; }
    .kv-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
    }
    .kv-value { font-size: 15px; font-weight: 600; }

    .constraint {
      border-left: 3px solid var(--warn); padding: 8px 0 8px 12px;
      margin-bottom: 10px; font-size: 14px;
    }
    .constraint:last-child { margin-bottom: 0; }
    .constraint-src { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

    textarea.bottleneck {
      width: 100%; min-height: 110px; resize: vertical;
      font-family: inherit; font-size: 15px; line-height: 1.55; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
    }
    textarea.bottleneck:focus { outline: none; border-color: var(--gold); background: #fff; }
    .ask-line {
      font-size: 15px; font-weight: 500; color: var(--text);
      background: var(--gold-dim); border-radius: 8px;
      padding: 10px 12px; margin: 0 0 10px;
    }
    .save-state { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 14px; }

    /* Owner load */
    .load-line { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 0 0 10px; }
    .load-line .num { color: var(--navy); font-weight: 800; }
    .load-sub { font-size: 12px; color: var(--muted); margin: 0; }
    .load-bar { height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; margin: 12px 0 8px; }
    .load-bar span { display: block; height: 100%; background: var(--navy); border-radius: 5px; }

    /* Scores */
    details.block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); margin-bottom: 16px; }
    details.block > summary {
      list-style: none; cursor: pointer; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    .sum-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .sum-hint { font-size: 11px; color: var(--muted); font-weight: 500; }
    .block-body { padding: 0 20px 20px; }

    .area { padding: 14px 0; border-top: 1px solid var(--border); }
    .area:first-child { border-top: none; padding-top: 0; }
    .area-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .area-name { font-size: 15px; font-weight: 700; }
    .area-score { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .bar { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; }
    .bar span { display: block; height: 100%; border-radius: 4px; }
    .area-ev { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
    .s-good { color: var(--good); } .fill-good { background: var(--good); }
    .s-warn { color: var(--warn); } .fill-warn { background: var(--warn); }
    .s-crit { color: var(--crit); } .fill-crit { background: var(--crit); }
    .positive {
      margin-top: 16px; padding: 14px; background: var(--gold-dim);
      border-radius: 8px; font-size: 14px; line-height: 1.6;
    }
    .positive-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--warn); display: block; margin-bottom: 4px;
    }

    /* Area drill-down, from score_json.action_plan */
    details.area-d { border: none; }
    details.area-d > summary { list-style: none; cursor: pointer; }
    details.area-d > summary::-webkit-details-marker { display: none; }
    .area-more {
      font-size: 11px; font-weight: 600; color: var(--muted);
      margin-top: 8px; display: inline-block;
    }
    details.area-d[open] > summary .area-more-shut { display: none; }
    details.area-d:not([open]) > summary .area-more-open { display: none; }
    .plan { margin-top: 12px; padding: 14px; background: var(--surface); border-radius: 8px; }
    .plan-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .plan-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; color: #fff; background: var(--crit);
    }
    .plan-tag.t-warn { background: var(--warn); }
    .plan-tag.t-good { background: var(--good); }
    .plan-frac { font-size: 12px; font-weight: 700; color: var(--text); }
    .plan-when { font-size: 12px; color: var(--muted); }
    .plan-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 5px;
    }
    .plan ul { margin: 0 0 12px; padding-left: 18px; }
    .plan li { font-size: 13px; line-height: 1.6; margin-bottom: 4px; }
    .plan-succ {
      font-size: 13px; line-height: 1.55; border-left: 3px solid var(--good);
      padding-left: 10px; color: var(--text);
    }

    /* 62 questions */
    .q-area-name { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy); margin: 16px 0 6px; }
    .q-row { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .q-mark { flex: 0 0 22px; font-weight: 700; }
    .q-yes { color: var(--good); } .q-no { color: var(--crit); }
    .q-text { color: var(--text); }

    /* Stories */
    .story { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--card); }
    .story > summary { list-style: none; cursor: pointer; padding: 12px 14px; }
    .story > summary::-webkit-details-marker { display: none; }
    .story-line { font-size: 14px; font-weight: 600; line-height: 1.45; }
    .story-why { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      background: var(--gold-dim); color: var(--warn);
      padding: 2px 7px; border-radius: 20px; margin-right: 5px;
    }
    .story-body { padding: 0 14px 14px; }
    .story-narr { font-size: 14px; line-height: 1.65; margin-bottom: 12px; }
    .story-narr p { margin: 0 0 10px; }
    .story-narr p:last-child { margin-bottom: 0; }
    .story-more { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 6px; display: inline-block; }
    details.story[open] > summary .story-more-shut { display: none; }
    details.story:not([open]) > summary .story-more-open { display: none; }
    .story-note {
      font-size: 12px; line-height: 1.55; color: var(--text);
      border-left: 3px solid var(--crit); background: var(--surface);
      padding: 9px 12px; border-radius: 0 6px 6px 0;
    }
    .story-note b { color: var(--crit); }
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin: 18px 0 10px;
    }
    .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* Assets */
    .asset-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .asset-row:first-child { border-top: none; }
    .asset-label { flex: 0 0 150px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .asset-gap { color: var(--crit); font-size: 12px; font-weight: 600; }

    /* Meeting type picker, shown when no ?type= is present. */
    .pick-name { font-size: 22px; font-weight: 800; margin: 0 0 2px; letter-spacing: -0.02em; }
    .pick-ask { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
    .pick-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 0; border-top: 1px solid var(--border);
    }
    .pick-row:first-of-type { border-top: none; }
    .pick-go {
      display: inline-block; font-size: 15px; font-weight: 700; color: var(--text);
      text-decoration: none; border-bottom: 1px solid transparent;
    }
    .pick-go:hover { border-bottom-color: var(--gold); }
    /* Unbuilt types stay visible so he can see the shape of what is coming,
       but must not read as live buttons that lead nowhere. */
    .pick-soon { font-size: 15px; font-weight: 600; color: var(--muted); opacity: 0.65; }
    .pick-soon-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--border); border-radius: 20px;
      padding: 3px 9px; white-space: nowrap;
    }
    .pick-example { font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: underline; }
    .pick-example:hover { color: var(--text); }

    /* Resultado: the lead outcome, the last thing on the page. */
    .out-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .out-btn {
      font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 11px 18px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .out-btn:hover { border-color: var(--gold); }
    .out-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
    .out-btn.primary:hover { opacity: 0.9; }
    .out-sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
    .out-pick { margin-top: 12px; }
    .out-pick select {
      font-family: inherit; font-size: 14px; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
      color: var(--text); min-width: 200px;
    }
    .out-state { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 15px; }
    .out-done {
      font-size: 14px; line-height: 1.55; padding: 12px 14px;
      background: var(--gold-dim); border-radius: 8px;
    }

    /* Checklist */
    .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
    .check-row:first-child { border-top: none; }
    .check-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--gold); flex: 0 0 auto; }
    .check-row label { font-size: 14px; line-height: 1.45; }

    @media (max-width: 620px) {
      main { padding: 16px 12px 60px; }
      .card, .block-body { padding: 16px; }
      .asset-label { flex-basis: 110px; }
      .prep-name { font-size: 21px; }
    }
  </style>
</head>

    var currentUser = null;

    // Every string in this file is plain ASCII. Portuguese accented text lives

    var PATTERN_LABELS = {

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function isEn() { return document.body.classList.contains("lang-en"); }

    function ptEn(pt, en) {
      return '<span class="show-pt">' + pt + '</span><span class="show-en">' + en + '</span>';
    }

    function toggleLang() {
      var b = document.body;
      if (b.classList.contains("lang-pt")) { b.classList.remove("lang-pt"); b.classList.add("lang-en"); }
      else { b.classList.remove("lang-en"); b.classList.add("lang-pt"); }
      if (window.apexApplyTitle) { window.apexApplyTitle(); }
      if (prepData) { render(prepData); }
    }

    function goBack() {
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = "dashboard.html"; }
    }

    function firebaseUser() {
      if (currentUser) { return Promise.resolve(currentUser); }
      return new Promise(function(resolve, reject) {
        if (!auth) {
          firebase.initializeApp(FIREBASE_CONFIG);
          auth = firebase.auth();
        }
        auth.onAuthStateChanged(function(user) {
          if (user) { currentUser = user; resolve(user); }
          else { reject(new Error("Not authenticated")); }
        });
      });
    }

    function getToken() {
      if (currentUser) { return currentUser.getIdToken(); }
      return Promise.reject(new Error("Not authenticated"));
    }

    function apiFetch(path, opts) {
      return getToken().then(function(token) {
        var o = opts || {};
        var headers = { "Authorization": "Bearer " + token };
        if (o.body) { headers["Content-Type"] = "application/json"; }
        return fetch(WORKER_URL + path, {
          method:  o.method || "GET",
          headers: headers,
          body:    o.body || undefined
        });
      });
    }

    function showMsg(pt, en) {
      var el = document.getElementById("stateMsg");
      if (!el) { return; }
      el.hidden = false;
      el.innerHTML = ptEn(escHtml(pt), escHtml(en));
      var body = document.getElementById("prepBody");
      if (body) { body.hidden = true; }
    }

    // Status -> semantic colour. Accented and unaccented spellings both appear
    // in score_json depending on which instrument wrote the row, so both are
    // handled. Anything unrecognised falls through to the neutral warn tone
    // rather than being asserted as good or critical.
    function statusClass(status) {
      var s = String(status || "");
      if (s === "Bom") { return "good"; }
      if (s === "Moderado") { return "warn"; }
      if (s === "Critico" || s === "Cr\u00edtico") { return "crit"; }
      return "warn";
    }

    // ---- 1 Header ---------------------------------------------------------
    function renderHead(d) {
      var c = d.client || {};
      var bits = [];
      if (c.owners)   { bits.push(escHtml(c.owners)); }
      if (c.location) { bits.push(escHtml(c.location)); }
      if (c.industry) { bits.push(escHtml(c.industry)); }

      var typeLabel = d.meeting_type === "xray_results"
        ? ptEn("Reuni&#227;o de resultados do Raio-X", "X-Ray results meeting")
        : escHtml(d.meeting_type || "");

      var h = '<div class="card">';
      if (IS_EXAMPLE) {
        h += '<p class="example-line">' +
             ptEn("Exemplo, com dados reais da Brax Facilities.",
                  "Example, with real Brax Facilities data.") + '</p>';
      }
      h += '<h1 class="prep-name">' + escHtml(c.name || "") + '</h1>';
      if (bits.length) { h += '<p class="prep-meta">' + bits.join(" &middot; ") + '</p>'; }
      h += '<p class="prep-meta">' + typeLabel + '</p>';
      h += '<p style="margin:0 0 4px;"><a class="pkg-open" href="packages.html" target="_blank" rel="noopener">' +
           ptEn("Abrir a tela de pacotes", "Open the packages screen") + '</a>' +
           '<span class="pkg-note">' +
           ptEn("abre em outra aba, para mostrar ao cliente",
                "opens in a new tab, to show the client") + '</span></p>';
      h += '<p class="prep-confid">' +
           ptEn("Esta p&#225;gina &#233; apenas para o consultor. Qualquer material mostrado ao cliente abre em separado.",
                "This page is consultant-only. Anything shown on screen opens separately.") +
           '</p>';
      h += '</div>';
      return h;
    }

    // ---- 2 Before you start ----------------------------------------------
    // Money or timing constraints surfaced at the TOP. In the real Brax meeting
    // the cash objection did not appear until minute 55 and the deal did not
    // close. Renders nothing at all when there is nothing true to show.
    function renderBefore(d) {
      var c = d.client || {};
      var rows = [];

      var sc = d.assessment && d.assessment.score;
      var areas = (sc && sc.areas) || [];
      for (var i = 0; i < areas.length; i++) {
        var a = areas[i];
        if (!a.evidencePt) { continue; }
        var cls = statusClass(a.status);
        if (cls !== "crit" && cls !== "warn") { continue; }
        var ev = String(a.evidencePt);
        // Only the money-and-timing evidence belongs at the top of the page.
        if (!/margem|preco|preço|custo|receita|financ|DRE|caixa|pagamento|dinheiro/i.test(ev)) { continue; }
        rows.push(
          '<div class="constraint">' + escHtml(ev) +
          '<span class="constraint-src">' + escHtml(a.namePt || a.key || "") + '</span></div>'
        );
      }

      var side = [];
      if (c.owners) {
        side.push('<div class="kv-item"><div class="kv-label">' +
          ptEn("Quem participa", "Attending") + '</div><div class="kv-value">' +
          escHtml(c.owners) + '</div></div>');
      }
      if (c.package) {
        side.push('<div class="kv-item"><div class="kv-label">' +
          ptEn("Multiplicador do pipeline", "Pipeline multiplier") + '</div><div class="kv-value">' +
          escHtml(c.package) + '</div></div>');
      }

      if (!rows.length && !side.length) { return ""; }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Antes de come&#231;ar", "Before you start") + '</p>';
      h += rows.join("");
      if (side.length) {
        h += '<div class="kv" style="margin-top:' + (rows.length ? "14px" : "0") + ';">' + side.join("") + '</div>';
      }
      h += '</div>';
      return h;
    }

    // ---- 3 What he says the bottleneck is --------------------------------
    function renderBottleneck(d) {
      var txt = (d.bottleneck && d.bottleneck.text) || "";
      lastSaved = txt;
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("O gargalo, na palavra dele", "What he says the bottleneck is") + '</p>';
      h += '<p class="ask-line">' +
           ptEn("Me fala um pouquinho, o que voc&#234; mais percebe aqui, na sua empresa, de gargalo?",
                "Tell me a little: what do you notice most here in your company as a bottleneck?") +
           '</p>';
      h += '<textarea id="bottleneckBox" class="bottleneck">' + escHtml(txt) + '</textarea>';
      h += '<div class="save-state" id="saveState"></div>';
      h += '</div>';
      return h;
    }

    // ---- 4 Owner dependency, precomputed ---------------------------------
    // The arithmetic the X-Ray can actually prove. Renders nothing when no
    // practice activity was answered: "0 activities" and "never filled in"
    // are not the same claim, and only one of them is true here.
    function renderOwnerLoad(d) {
      var o = d.ownerLoad;
      if (!o || !o.answered) { return ""; }

      var pct = o.answered ? Math.round((o.owner_count / o.answered) * 100) : 0;
      var lowTxt  = String(o.hours_low);
      var highTxt = String(o.hours_high);

      var linePt = 'O dono faz <span class="num">' + o.owner_count + '</span> das ' +
                   o.total_activities + ' atividades, cerca de <span class="num">' +
                   lowTxt + ' a ' + highTxt + '</span> horas por semana antes de tocar no trabalho em si.';
      var lineEn = 'The owner personally does <span class="num">' + o.owner_count + '</span> of ' +
                   o.total_activities + ' activities, about <span class="num">' +
                   lowTxt + ' to ' + highTxt + '</span> hours a week before touching the work itself.';

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("A depend&#234;ncia do dono", "Owner dependency") + '</p>';
      h += '<p class="load-line">' + ptEn(linePt, lineEn) + '</p>';
      h += '<div class="load-bar"><span style="width:' + pct + '%;"></span></div>';
      h += '<p class="load-sub">' +
           ptEn(escHtml(o.answered + " de " + o.total_activities + " atividades foram respondidas."),
                escHtml(o.answered + " of " + o.total_activities + " activities were answered.")) +
           '</p>';
      if (o.allOwner) {
        h += '<p class="load-sub" style="margin-top:6px;">' +
             ptEn("Todas as atividades respondidas s&#227;o feitas pelo dono.",
                  "Every answered activity is done by the owner.") + '</p>';
      }
      h += '</div>';
      return h;
    }

    // One area's entry from score_json.action_plan. Every field is optional:
    // a plan missing its timeframe or success criterion renders without them
    // rather than showing an empty row.
    function renderPlan(p) {
      var tagCls = "";
      var st = String(p.status || "");
      if (st === "Moderado" || st === "Aten\u00e7\u00e3o") { tagCls = " t-warn"; }
      else if (st === "Bom") { tagCls = " t-good"; }

      var h = '<div class="plan"><div class="plan-head">';
      if (p.tag)      { h += '<span class="plan-tag' + tagCls + '">' + escHtml(p.tag) + '</span>'; }
      if (p.fraction) { h += '<span class="plan-frac">' + escHtml(p.fraction) + '</span>'; }
      var when = isEn() ? (p.timeframeEn || p.timeframePt) : (p.timeframePt || p.timeframeEn);
      if (when)       { h += '<span class="plan-when">' + escHtml(when) + '</span>'; }
      h += '</div>';

      var acts = (isEn() ? (p.actionsEn || p.actionsPt) : (p.actionsPt || p.actionsEn)) || [];
      if (acts.length) {
        h += '<p class="plan-label">' + ptEn("O que fazer", "What to do") + '</p><ul>';
        for (var i = 0; i < acts.length; i++) {
          h += '<li>' + escHtml(acts[i]) + '</li>';
        }
        h += '</ul>';
      }

      var succ = isEn() ? (p.criterioSucessoEn || p.criterioSucessoPt)
                        : (p.criterioSucessoPt || p.criterioSucessoEn);
      if (succ) {
        h += '<p class="plan-label">' + ptEn("Crit&#233;rio de sucesso", "Success criterion") + '</p>';
        h += '<p class="plan-succ">' + escHtml(succ) + '</p>';
      }
      h += '</div>';
      return h;
    }

    // ---- 5 X-Ray scores, expandable, open by default ---------------------
    // Never assumes six areas: BRAX carries the legacy four. Ends on the
    // genuine positive, which is how he always closes that block.
    function renderScores(d) {
      var sc = d.assessment && d.assessment.score;
      if (!sc) { return ""; }
      var areas = sc.areas || [];
      if (!areas.length) { return ""; }

      var h = '<details class="block" open><summary><span class="sum-title">' +
              ptEn("As notas do Raio-X", "The X-Ray scores") + '</span>';
      if (typeof sc.pct === "number") {
        h += '<span class="sum-hint">' + sc.pct + '%';
        if (typeof sc.score === "number" && typeof sc.max_score === "number") {
          h += ' &middot; ' + sc.score + '/' + sc.max_score;
        }
        h += '</span>';
      }
      h += '</summary><div class="block-body">';

      // action_plan is keyed by areaKey. A client whose score_json predates the
      // plan simply has none, and those areas render flat rather than opening
      // onto an empty drawer.
      var planBy = {};
      var plans = sc.action_plan || [];
      for (var pi = 0; pi < plans.length; pi++) {
        if (plans[pi] && plans[pi].areaKey) { planBy[plans[pi].areaKey] = plans[pi]; }
      }

      // Worst first: that is the order he reads them in. Sorted on a copy so
      // the stored order is left alone.
      var ordered = areas.slice().sort(function(x, y) {
        var xp = typeof x.pct === "number" ? x.pct : 101;
        var yp = typeof y.pct === "number" ? y.pct : 101;
        return xp - yp;
      });

      for (var i = 0; i < ordered.length; i++) {
        var a = ordered[i];
        var cls = statusClass(a.status);
        // Score out of 10, as the section specifies, derived from the area's
        // own percentage so a 4-area and a 6-area instrument read alike.
        var outOf10 = typeof a.pct === "number" ? Math.round(a.pct / 10) : null;
        var name = isEn() ? (a.nameEn || a.namePt || a.key) : (a.namePt || a.nameEn || a.key);
        var plan = planBy[a.key];

        var head = '<div class="area-head">';
        head += '<span class="area-name">' + escHtml(name) + '</span>';
        if (outOf10 !== null) {
          head += '<span class="area-score s-' + cls + '">' + outOf10 + '/10</span>';
        }
        head += '</div>';
        if (typeof a.pct === "number") {
          head += '<div class="bar"><span class="fill-' + cls + '" style="width:' + a.pct + '%;"></span></div>';
        }
        if (a.evidencePt) {
          head += '<p class="area-ev">' + escHtml(a.evidencePt) + '</p>';
        }

        h += '<div class="area">';
        if (plan) {
          h += '<details class="area-d"><summary>' + head +
               '<span class="area-more">' +
               '<span class="area-more-shut">' + ptEn("Ver o plano", "See the plan") + '</span>' +
               '<span class="area-more-open">' + ptEn("Fechar", "Close") + '</span>' +
               '</span></summary>' + renderPlan(plan) + '</details>';
        } else {
          h += head;
        }
        h += '</div>';
      }

      if (sc.positivoPt) {
        h += '<div class="positive"><span class="positive-label">' +
             ptEn("O ponto positivo", "The genuine positive") + '</span>' +
             escHtml(sc.positivoPt) + '</div>';
      }
      h += '</div></details>';
      return h;
    }

    // ---- 6 The 62 questionnaire answers, collapsed -----------------------
    function renderQuestions(d) {
      if (!d.answeredCount) { return ""; }
      var groups = d.areaQuestions || [];
      var h = '<details class="block"><summary><span class="sum-title">' +
              ptEn("As 62 respostas do question&#225;rio", "The 62 questionnaire answers") +
              '</span><span class="sum-hint">' + d.answeredCount + '</span></summary>' +
              '<div class="block-body">';
      for (var i = 0; i < groups.length; i++) {
        var g = groups[i];
        var qs = g.questions || [];
        var shown = [];
        for (var j = 0; j < qs.length; j++) {
          if (qs[j].answer === 0 || qs[j].answer === 1) { shown.push(qs[j]); }
        }
        if (!shown.length) { continue; }
        h += '<p class="q-area-name">' + escHtml(isEn() ? (g.nameEn || g.namePt) : (g.namePt || g.nameEn)) + '</p>';
        for (var k = 0; k < shown.length; k++) {
          var q = shown[k];
          var yes = q.answer === 1;
          h += '<div class="q-row"><span class="q-mark ' + (yes ? "q-yes" : "q-no") + '">' +
               (yes ? ptEn("Sim", "Yes") : ptEn("N&#227;o", "No")) + '</span><span class="q-text">' +
               escHtml(isEn() ? (q.labelEn || q.labelPt) : (q.labelPt || q.labelEn)) +
               '</span></div>';
        }
      }
      h += '</div></details>';
      return h;
    }

    // ---- 7 Stories, ranked -----------------------------------------------
    // The system ranks. He picks. Never auto-select, never hide the rest:
    // a meeting turns and he needs the others in his back pocket.
    // Names the patterns, in the page's own words, as a readable list:
    // "medo de prospectar e zona de conforto" / "a and b" -- never a bare id.
    // Takes the joiner rather than calling ptEn() itself: the result is built
    // into one side of a ptEn() pair, and a nested pair would leak the
    // Portuguese joiner into the English sentence.
    function patternList(keys, joiner) {
      var out = [];
      for (var i = 0; i < keys.length; i++) {
        out.push(escHtml(PATTERN_LABELS[keys[i]] || keys[i]));
      }
      if (out.length === 1) { return out[0]; }
      var last = out.pop();
      return out.join(", ") + joiner + last;
    }

    // The real reason THIS story ranked where it did. A story that matched
    // nothing gets no line at all: the same generic sentence on all sixteen
    // rows tells him nothing and is worse than silence.
    function storyReason(mb, mp) {
      if (mb.length) {
        // The bottleneck he just typed is the stronger signal, so that is the
        // source named when a story hits both.
        return ptEn(
          "Casa com o gargalo que ele descreveu: " + patternList(mb, " e "),
          "Matches the bottleneck he described: " + patternList(mb, " and ")
        );
      }
      if (mp.length) {
        return ptEn(
          "Casa com o Raio-X: " + patternList(mp, " e "),
          "Matches the X-Ray: " + patternList(mp, " and ")
        );
      }
      return "";
    }

    // A narrative is now full prose, several paragraphs long. Blank lines are
    // paragraph breaks and render as such; one undivided block is unreadable
    // mid-meeting.
    function narrativeHtml(text) {
      var paras = String(text).split(/\n\s*\n/);
      var out = "";
      for (var i = 0; i < paras.length; i++) {
        var t = paras[i].replace(/^\s+|\s+$/g, "");
        if (!t) { continue; }
        out += '<p>' + escHtml(t) + '</p>';
      }
      return out;
    }

    function storyCard(s) {
      var why = [];
      var mb = s.matched_bottleneck || [];
      var mp = s.matched_patterns || [];
      for (var i = 0; i < mb.length; i++) {
        why.push('<span class="tag">' + escHtml(PATTERN_LABELS[mb[i]] || mb[i]) + '</span>');
      }
      for (var j = 0; j < mp.length; j++) {
        if (mb.indexOf(mp[j]) > -1) { continue; }
        why.push('<span class="tag">' + escHtml(PATTERN_LABELS[mp[j]] || mp[j]) + '</span>');
      }

      var reason = storyReason(mb, mp);

      var h = '<details class="story"><summary>';
      h += '<div class="story-line">' + escHtml(s.one_liner || "") + '</div>';
      if (why.length || reason) {
        h += '<div class="story-why">' + why.join("") +
             (reason ? '<span>' + reason + '</span>' : "") + '</div>';
      }
      h += '<span class="story-more">' +
           '<span class="story-more-shut">' + ptEn("Ver a hist&#243;ria", "See the story") + '</span>' +
           '<span class="story-more-open">' + ptEn("Fechar", "Close") + '</span>' +
           '</span>';
      h += '</summary><div class="story-body">';
      // narrative_en is filled in row by row; falling back to the Portuguese
      // keeps the body from rendering blank while that work is in flight.
      var narr = isEn() ? (s.narrative_en || s.narrative) : s.narrative;
      if (narr) {
        h += '<div class="story-narr">' + narrativeHtml(narr) + '</div>';
      }
      // telling_note is ALWAYS rendered: it says what must not be claimed.
      if (s.telling_note) {
        h += '<div class="story-note"><b>' +
             ptEn("Ao contar:", "When telling it:") + '</b> ' +
             escHtml(s.telling_note) + '</div>';
      }
      h += '</div></details>';
      return h;
    }

    function renderStories(d) {
      var list = d.stories || [];
      if (!list.length) { return ""; }
      var matched = [];
      var rest    = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].matched) { matched.push(list[i]); } else { rest.push(list[i]); }
      }

      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Hist&#243;rias", "Stories") + '</p>';
      for (var m = 0; m < matched.length; m++) { h += storyCard(matched[m]); }
      if (matched.length && rest.length) {
        h += '<div class="divider">' + ptEn("As demais", "The rest") + '</div>';
      }
      for (var r = 0; r < rest.length; r++) { h += storyCard(rest[r]); }
      h += '</div>';
      return h;
    }

    // ---- 8 What he already has -------------------------------------------
    function renderAssets(d) {
      var c = d.client || {};
      var dp = {};
      if (c.digital_presence) {
        try { dp = JSON.parse(c.digital_presence) || {}; } catch (e) { dp = {}; }
      }

      var items = [
        { pt: "Site",       en: "Website",                 val: dp.website || dp.site || null },
        { pt: "Google",     en: "Google Business Profile", val: dp.google || dp.google_business || null },
        { pt: "Instagram",  en: "Instagram",               val: c.instagram_handle || dp.instagram || null },
        { pt: "E-mail",     en: "Email",                   val: c.email || null },
        { pt: "Equipe",     en: "Team size",               val: dp.team_size || dp.equipe || null }
      ];

      var rows = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var has = it.val !== null && it.val !== undefined && String(it.val).trim() !== "";
        rows.push(
          '<div class="asset-row"><span class="asset-label">' + ptEn(it.pt, it.en) + '</span>' +
          (has
            ? '<span>' + escHtml(String(it.val)) + '</span>'
            : '<span class="asset-gap">' + ptEn("n&#227;o consta", "not on record") + '</span>') +
          '</div>'
        );
      }

      return '<div class="card"><p class="sec-title">' +
             ptEn("O que ele j&#225; tem", "What he already has") + '</p>' +
             rows.join("") + '</div>';
    }

    // ---- 9 After the meeting ---------------------------------------------
    function renderChecklist() {
      var h = '<div class="card"><p class="sec-title">' +
              ptEn("Depois da reuni&#227;o", "After the meeting") + '</p>';
      for (var i = 0; i < AFTER_MEETING.length; i++) {
        var it = AFTER_MEETING[i];
        h += '<div class="check-row"><input type="checkbox" id="' + it.id + '">' +
             '<label for="' + it.id + '">' + ptEn(it.pt, it.en) + '</label></div>';
      }
      h += '</div>';
      return h;
    }

    // ---- 0 Meeting type picker -------------------------------------------
    // A client meeting is not one thing: kickoff, weekly RDE, 30-day close and
    // X-Ray results each need different prep. Only the X-Ray one is built, so
    // the other three are shown as unavailable rather than as live buttons.
    // Reached only when the URL carries no ?type=; existing typed links skip it.
    var MEETING_TYPES = [
      { type: "xray_results", built: true,
        pt: "Raio-X - Resultados",  en: "X-Ray - Results" },
      { type: "kickoff",      built: false,
        pt: "Kickoff",              en: "Kickoff" },
      { type: "rde_semanal",  built: false,
        pt: "RDE semanal",          en: "Weekly RDE" },
      { type: "fechamento",   built: false,
        pt: "Fechamento de ciclo",  en: "Cycle close" }
    ];

    function renderPicker(d) {
      var c = (d && d.client) || {};
      var h = '<div class="card">';
      h += '<h1 class="pick-name">' + escHtml(c.name || "") + '</h1>';
      h += '<p class="pick-ask">' +
           ptEn("Qual &#233; esta reuni&#227;o?", "Which meeting is this?") + '</p>';

      for (var i = 0; i < MEETING_TYPES.length; i++) {
        var t = MEETING_TYPES[i];
        h += '<div class="pick-row">';
        if (t.built) {
          h += '<a class="pick-go" href="meeting-prep.html?client=' +
               encodeURIComponent(CLIENT_ID) + '&type=' + encodeURIComponent(t.type) + '">' +
               ptEn(t.pt, t.en) + '</a>';
          // The example belongs here, next to the type it is an example of.
          h += '<a class="pick-example" href="' + EXAMPLE_URL + '">' +
               ptEn("Ver exemplo", "See example") + '</a>';
        } else {
          h += '<span class="pick-soon">' + ptEn(t.pt, t.en) + '</span>';
          h += '<span class="pick-soon-tag">' + ptEn("em breve", "not yet") + '</span>';
        }
        h += '</div>';
      }

      h += '</div>';
      return h;
    }

    // ---- 10 Resultado ----------------------------------------------------
    // The moment he actually resolves the lead, so the decision belongs here
    // as well as on the client page. Reuses POST /api/clients/:id/lead-outcome
    // -- the same single handler the client page posts to, not a second path.
    // Shown only while status is 'lead': on an active client it makes no sense.
    function renderOutcome(d) {
      var c = d.client || {};
      if (String(c.status || "") !== "lead") { return ""; }

      var h = '<div class="card" id="outcomeCard"><p class="sec-title">' +
              ptEn("Resultado", "Outcome") + '</p>';
      h += '<p class="out-sub">' +
           ptEn("Como esta reuni&#227;o terminou?", "How did this meeting end?") + '</p>';
      h += '<div class="out-actions">';
      h += '<button type="button" class="out-btn primary" onclick="openConvert()">' +
           ptEn("Virou cliente", "Became a client") + '</button>';
      // NOT "lost": Rafa works this list to revive them, so it is worded as a
      // return-to later, not as a rejection.
      h += '<button type="button" class="out-btn" onclick="markDormant()">' +
           ptEn("Ainda n&#227;o, retomar depois", "Not yet, come back to them") + '</button>';
      h += '</div>';

      // The package picker, hidden until "became a client" is chosen: a
      // package is required for the converted outcome.
      h += '<div class="out-pick" id="outPick" hidden>';
      h += '<p class="out-sub" style="margin-bottom:6px;">' +
           ptEn("Qual pacote?", "Which package?") + '</p>';
      h += '<select id="outPackage"><option value="">' +
           ptEn("-- Pacote --", "-- Package --") + '</option></select> ';
      h += '<button type="button" class="out-btn primary" onclick="confirmConvert()">' +
           ptEn("Confirmar", "Confirm") + '</button>';
      h += '</div>';

      h += '<div class="out-state" id="outState"></div>';
      h += '</div>';
      return h;
    }

    var outPackagesLoaded = false;

    function openConvert() {
      var pick = document.getElementById("outPick");
      if (pick) { pick.hidden = false; }
      setOutState("", "");
      if (outPackagesLoaded) { return; }
      // Same live package source the client page's convert modal uses.
      apiFetch("/api/settings/packages")
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var pkgs = data.packages || [];
          if (!pkgs.length) { return; }
          outPackagesLoaded = true;
          var newPkgs    = pkgs.filter(function(p) { return p.sort_order !== null && p.sort_order < 1; });
          var legacyPkgs = pkgs.filter(function(p) { return !(p.sort_order !== null && p.sort_order < 1); });
          var html = '<option value="">' + ptEn("-- Pacote --", "-- Package --") + '</option>';
          for (var i = 0; i < newPkgs.length; i++) {
            html += '<option value="' + escHtml(newPkgs[i].short_name) + '">' +
                    escHtml(newPkgs[i].short_name) + '</option>';
          }
          if (newPkgs.length && legacyPkgs.length) {
            html += '<option value="" disabled>----- Legacy / Legado -----</option>';
          }
          for (var j = 0; j < legacyPkgs.length; j++) {
            html += '<option value="' + escHtml(legacyPkgs[j].short_name) + '">' +
                    escHtml(legacyPkgs[j].short_name) + '</option>';
          }
          var sel = document.getElementById("outPackage");
          if (sel) { sel.innerHTML = html; }
        })
        .catch(function() { /* the static placeholder option stays in the DOM */ });
    }

    function setOutState(pt, en) {
      var el = document.getElementById("outState");
      if (!el) { return; }
      el.innerHTML = (pt || en) ? ptEn(pt, en) : "";
    }

    function confirmConvert() {
      var sel = document.getElementById("outPackage");
      var pkg = sel ? sel.value : "";
      if (!pkg) {
        setOutState("Escolha um pacote.", "Choose a package.");
        return;
      }
      postOutcome({ outcome: "converted", "package": pkg });
    }

    function markDormant() {
      postOutcome({ outcome: "dormant" });
    }

    // Reports what happened and leaves the page usable. Deliberately no
    // redirect: he is mid-meeting and moving him elsewhere would lose the prep.
    function postOutcome(payload) {
      setOutState("Salvando...", "Saving...");
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/lead-outcome", {
        method: "POST",
        body: JSON.stringify(payload)
      })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.error) { throw new Error(data.error); }
          var card = document.getElementById("outcomeCard");
          if (!card) { return; }
          var msg;
          if (payload.outcome === "converted") {
            msg = ptEn(
              "Virou cliente, no pacote " + escHtml(payload["package"]) + ".",
              "Now a client, on the " + escHtml(payload["package"]) + " package."
            );
          } else {
            msg = ptEn(
              "Marcado para retomar depois. Fica em Consolidados, em Leads para reativar.",
              "Marked to come back to. It sits under Consolidados, in leads to reactivate."
            );
          }
          card.innerHTML = '<p class="sec-title">' + ptEn("Resultado", "Outcome") +
                           '</p><div class="out-done">' + msg + '</div>';
          // Keep the cached copy honest so a language toggle re-render, which
          // rebuilds from prepData, does not resurrect the buttons.
          if (prepData && prepData.client) {
            prepData.client.status = (payload.outcome === "converted") ? "active" : "lead_dormant";
          }
        })
        .catch(function(e) {
          setOutState("N&#227;o foi poss&#237;vel salvar: " + escHtml(e.message),
                      "Could not save: " + escHtml(e.message));
        });
    }

    function render(d) {
      var body = document.getElementById("prepBody");
      if (!body) { return; }
      var h = "";
      if (!HAS_TYPE) {
        body.innerHTML = renderPicker(d);
        body.hidden = false;
        var pm = document.getElementById("stateMsg");
        if (pm) { pm.hidden = true; }
        return;
      }
      h += renderHead(d);
      h += renderBefore(d);
      h += renderBottleneck(d);
      h += renderOwnerLoad(d);
      h += renderScores(d);
      h += renderQuestions(d);
      h += renderStories(d);
      h += renderAssets(d);
      h += renderChecklist();
      h += renderOutcome(d);
      body.innerHTML = h;
      body.hidden = false;
      var msg = document.getElementById("stateMsg");
      if (msg) { msg.hidden = true; }
      wireBottleneck();
    }

    // Autosave on blur, debounced. A save that changes the text re-ranks the
    // stories, so the page reloads its data rather than leaving stale order.
    function wireBottleneck() {
      var box = document.getElementById("bottleneckBox");
      if (!box) { return; }
      box.addEventListener("blur", function() {
        if (saveTimer) { clearTimeout(saveTimer); }
        saveTimer = setTimeout(saveBottleneck, 400);
      });
    }

    function setSaveState(pt, en) {
      var el = document.getElementById("saveState");
      if (!el) { return; }
      el.innerHTML = ptEn(escHtml(pt), escHtml(en));
    }

    function saveBottleneck() {
      var box = document.getElementById("bottleneckBox");
      if (!box) { return; }
      var txt = box.value;
      if (txt === lastSaved) { return; }
      setSaveState("Salvando...", "Saving...");
      apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) + "/meeting-prep/bottleneck", {
        method: "PUT",
        body: JSON.stringify({ bottleneck: txt, meeting_type: MEETING_TYPE })
      }).then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      }).then(function() {
        lastSaved = txt;
        setSaveState("Salvo. As hist&#243;rias foram reordenadas.", "Saved. Stories reordered.");
        return loadPrep(true);
      }).catch(function() {
        setSaveState("N&#227;o foi poss&#237;vel salvar.", "Could not save.");
      });
    }

    function loadPrep(quiet) {
      return apiFetch("/api/clients/" + encodeURIComponent(CLIENT_ID) +
                      "/meeting-prep?type=" + encodeURIComponent(MEETING_TYPE))
        .then(function(res) {
          if (res.status === 403) { throw new Error("forbidden"); }
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        })
        .then(function(data) {
          prepData = data;
          // Preserve what he is typing: a background reload after a save must
          // never overwrite the textarea under his cursor.
          var box = document.getElementById("bottleneckBox");
          var live = box ? box.value : null;
          render(data);
          if (quiet && live !== null) {
            var nb = document.getElementById("bottleneckBox");
            if (nb) { nb.value = live; }
          }
        })
        .catch(function(err) {
          if (quiet) { return; }
          if (err && err.message === "forbidden") {
            showMsg("Esta p&#225;gina &#233; apenas para a equipe.", "This page is staff only.");
          } else {
            showMsg("N&#227;o foi poss&#237;vel carregar a prepara&#231;&#227;o.", "Could not load the meeting prep.");
          }
        });
    }

    function init() {
      if (!CLIENT_ID) {
        showMsg("Cliente n&#227;o informado.", "No client specified.");
        return;
      }
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      auth.onAuthStateChanged(function(user) {
        if (!user) {
          window.location.href = "index.html";
          return;
        }
        currentUser = user;
        loadPrep(false);
      });
    }

    window.onload = function() {
      init();
    };
  </script>
</body>
</html>
