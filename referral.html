<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- GLOBAL JS ERROR HOOK. Must be the FIRST script on the page, before
       native-bridge.js?v=1788492932, so it is installed before anything that can throw.

       WHY: the log showed "⚡️ JS Eval error A JavaScript exception occurred"
       with no detail, and every downstream symptom (no WIRE-INIT, no WIRE-POLL,
       no replay block, hasListeners=false forever) is consistent with a script
       dying early. Capacitor only prints that generic string, so the actual
       message, file, line and stack have to be captured here.

       Buffers into a cookie as well as the console, because the native log is
       only reachable once the Capacitor plugin exists -- which is exactly what
       may not have happened yet when the error fires. native-bridge.js?v=1788492932 replays
       this buffer into the native log once the plugin appears. -->
  <script>
  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      // Same cookie the trace buffer uses, so one replay surfaces both.
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      // And straight to native if the plugin is already up.
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      // Resource load failures (img/script 404) surface here with no ev.error;
      // they are worth seeing too, since a failed script tag would explain a
      // missing function just as well as a thrown exception.
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();
  </script>
  <script src="native-bridge.js?v=1788492932"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Indicação / Referral</title>
  <style>
    /* Public, no-login page: everything self-contained, no app JS/CSS pulled
       in (this page must never grow a dependency on authenticated code). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Apex's own palette is the hardcoded baseline. A client who has set
       branding overrides --brand-bg / --brand-accent at runtime (see
       applyBranding); everything visual reads through those two, so the
       fallback is literally "leave them alone". --gold/--ink stay as the
       Apex-named originals so the fallback values live in exactly one place. */
    :root {
      --gold: #C9A43A; --ink: #1a1a1d; --muted: #6b6660;
      --border: #e3ded6; --bg: #f7f4ee; --red: #b44040; --green: #3f7d4e;
      --brand-bg: var(--ink);        /* header/dark surface — clients.referral_bg_color */
      --brand-accent: var(--gold);   /* accents/buttons  — clients.referral_text_color */
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 14px 40px;
    }
    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 18px; width: 100%; max-width: 440px; margin-top: 14px;
      box-shadow: 0 2px 10px rgba(26,26,29,0.06);
    }
    /* Branded band behind the header block. Full-bleed regardless of body
       padding, so a client's background color reads as a real header rather
       than a floating rectangle. */
    .brandbar {
      background: var(--brand-bg);
      width: 100vw; margin-left: calc(50% - 50vw);
      padding: 18px 14px 20px; margin-bottom: 6px;
    }
    .brandbar .brand { margin-top: 0; }
    .brandbar .brand h1 { color: #fff; }
    .brandbar .brand .sub { color: rgba(255,255,255,0.72); }
    .brand { text-align: center; margin-top: 8px; }
    .brand .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--brand-accent); font-weight: 700; }
    .brand h1 { font-size: 22px; margin-top: 4px; }
    /* Client logo. Hidden until we know one exists — a broken image icon on a
       client's own branded page looks worse than no logo at all. Apex's mark is
       deliberately never shown here as a fallback: this is the CLIENT's page. */
    .brand .logo { display: none; margin: 0 auto 10px; max-height: 72px; max-width: 200px; width: auto; }
    .brand .logo.on { display: block; }
    .brand .sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.45; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
    input[type="text"], input[type="tel"] {
      width: 100%; min-height: 48px; padding: 10px 12px; font-size: 16px;
      border: 1px solid var(--border); border-radius: 10px; background: #fff;
    }
    input:focus { outline: none; border-color: var(--brand-accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button {
      min-height: 48px; padding: 10px 14px; font-size: 15px; border-radius: 999px;
      border: 1px solid var(--border); background: #fff; color: var(--ink); cursor: pointer;
    }
    .chips button.sel { background: var(--brand-accent); border-color: var(--brand-accent); color: #fff; font-weight: 700; }
    .btn {
      width: 100%; min-height: 52px; margin-top: 18px; border: none; border-radius: 10px;
      background: var(--brand-accent); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .btn[disabled] { opacity: 0.6; }
    .err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 18px; }
    .lang-btn {
      align-self: flex-end; min-height: 44px; padding: 8px 14px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 999px; background: #fff;
      color: var(--muted); cursor: pointer;
    }
    .done { text-align: center; padding: 10px 0; }
    .done .check { font-size: 44px; color: var(--green); }
    .done h2 { font-size: 20px; margin: 10px 0 8px; }
    .done p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    /* Honeypot: visually removed but present in the DOM for bots. */
    .hp-field { position: absolute; left: -9999px; top: -9999px; height: 0; overflow: hidden; }
    .loading, .notfound { text-align: center; color: var(--muted); padding: 30px 0; font-size: 15px; }
  </style>
</head>
<body class="lang-pt">
  <button type="button" class="lang-btn" onclick="toggleLang()">
    <span class="show-pt">English</span><span class="show-en">Português</span>
  </button>

  <div class="brandbar">
    <div class="brand">
      <!-- Shown only once we know the client has a logo (see applyBranding). -->
      <img class="logo" id="bizLogo" alt="">
      <div class="eyebrow"><span class="show-pt">Indicação</span><span class="show-en">Referral</span></div>
      <h1 id="bizName">&nbsp;</h1>
      <div class="sub" id="introLine"></div>
    </div>
  </div>

  <div class="card" id="cardLoading">
    <div class="loading">
      <span class="show-pt">Carregando…</span><span class="show-en">Loading…</span>
    </div>
  </div>

  <div class="card" id="cardNotFound" hidden>
    <div class="notfound">
      <span class="show-pt">Link de indicação inválido ou expirado.</span>
      <span class="show-en">Invalid or expired referral link.</span>
    </div>
  </div>

  <div class="card" id="cardForm" hidden>
    <label for="fNome"><span class="show-pt">Seu nome</span><span class="show-en">Your name</span> *</label>
    <input type="text" id="fNome" autocomplete="name">
    <label for="fTel"><span class="show-pt">Telefone</span><span class="show-en">Phone</span></label>
    <input type="tel" id="fTel" autocomplete="tel">
    <label><span class="show-pt">Quais serviços você procura? Pode marcar mais de um.</span><span class="show-en">Which services are you looking for? You can pick more than one.</span></label>
    <div class="chips" id="chips"></div>
    <!-- Honeypot: humans never see or fill this. -->
    <div class="hp-field" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="err" id="formErr"></div>
    <button type="button" class="btn" id="btnSend" onclick="submitReferral()">
      <span class="show-pt">Enviar</span><span class="show-en">Send</span>
    </button>
  </div>

  <div class="card" id="cardDone" hidden>
    <div class="done">
      <div class="check">&#10003;</div>
      <h2><span class="show-pt">Recebido!</span><span class="show-en">Received!</span></h2>
      <p>
        <span class="show-pt">Obrigado! <span id="doneBiz"></span> recebeu seus dados e vai entrar em contato em breve.</span>
        <span class="show-en">Thank you! <span id="doneBizEn"></span> has received your details and will reach out shortly.</span>
      </p>
    </div>
  </div>

  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";
    var slug = (window.location.search.match(/[?&]p=([a-z2-7]{10,40})/) || [])[1] || null;
    var loadedAt = Date.now();
    var pickedServicos = [];
    var bizName = "";

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function toggleLang() {
      var b = document.body;
      if (b.classList.contains("lang-pt")) { b.classList.remove("lang-pt"); b.classList.add("lang-en"); }
      else { b.classList.remove("lang-en"); b.classList.add("lang-pt"); }
    }

    // Set the STARTING language from the client's setting. The manual toggle
    // above is untouched — a visitor can always switch; this only decides
    // which language the page opens in. Anything other than an explicit "en"
    // keeps today's PT default, so a null/missing/garbage value is safe.
    function applyLanguage(lang) {
      var b = document.body;
      b.classList.remove("lang-pt", "lang-en");
      b.classList.add(lang === "en" ? "lang-en" : "lang-pt");
    }

    // Client branding over the hardcoded Apex palette. The Worker already
    // resolves null columns to Apex's own #1a1a1d / #C9A43A, but this page is
    // public and must never trust what it is handed: a value that is not a
    // 6-digit hex is dropped, leaving the CSS default in place.
    function applyBranding(d) {
      var hex = /^#[0-9a-fA-F]{6}$/;
      if (hex.test(d.referral_bg_color || "")) {
        document.documentElement.style.setProperty("--brand-bg", d.referral_bg_color);
      }
      if (hex.test(d.referral_text_color || "")) {
        document.documentElement.style.setProperty("--brand-accent", d.referral_text_color);
      }
      // Logo: only ever the client's own, served through the existing
      // logo-image route. No logo -> business name as text only. Apex's mark
      // is deliberately NOT substituted — on a client's own branded page it
      // would read as a mistake, not as a fallback.
      if (d.has_logo && d.logo_url) {
        var img = document.getElementById("bizLogo");
        img.onload = function() { img.className = "logo on"; };
        img.onerror = function() { img.className = "logo"; };   // stay hidden
        img.alt = d.business_name || "";
        img.src = d.logo_url;
      }
    }

    function showCard(id) {
      ["cardLoading", "cardNotFound", "cardForm", "cardDone"].forEach(function(c) {
        document.getElementById(c).hidden = (c !== id);
      });
    }

    function pickChip(btn) {
      // Multi-select: each chip toggles independently — a referred lead can
      // be interested in more than one service.
      var opt = btn.textContent;
      var pos = pickedServicos.indexOf(opt);
      if (pos === -1) {
        pickedServicos.push(opt);
        btn.classList.add("sel");
      } else {
        pickedServicos.splice(pos, 1);
        btn.classList.remove("sel");
      }
    }

    function loadForm() {
      if (!slug) { showCard("cardNotFound"); return; }
      fetch(WORKER_URL + "/api/referral/" + slug)
        .then(function(res) {
          if (!res.ok) { throw new Error("nf"); }
          return res.json();
        })
        .then(function(d) {
          applyLanguage(d.language);
          applyBranding(d);
          bizName = d.business_name || "";
          document.getElementById("bizName").textContent = bizName;
          document.getElementById("doneBiz").textContent = bizName;
          document.getElementById("doneBizEn").textContent = bizName;
          document.getElementById("introLine").innerHTML =
            '<span class="show-pt">' + (d.partner_name ? escHtml(d.partner_name) + ' indicou você. ' : '') +
            'Deixe seus dados e a equipe entra em contato.</span>' +
            '<span class="show-en">' + (d.partner_name ? escHtml(d.partner_name) + ' referred you. ' : '') +
            'Leave your details and the team will contact you.</span>';
          var chips = "";
          (d.servicos || []).forEach(function(s) {
            chips += '<button type="button" onclick="pickChip(this)">' + escHtml(s) + '</button>';
          });
          document.getElementById("chips").innerHTML = chips;
          showCard("cardForm");
        })
        .catch(function() { showCard("cardNotFound"); });
    }

    function submitReferral() {
      var err = document.getElementById("formErr");
      err.textContent = "";
      var nome = document.getElementById("fNome").value.trim();
      if (!nome) {
        err.textContent = document.body.classList.contains("lang-en")
          ? "Please fill in your name." : "Preencha seu nome.";
        return;
      }
      var btn = document.getElementById("btnSend");
      btn.disabled = true;
      fetch(WORKER_URL + "/api/referral/" + slug, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome: nome,
          telefone: document.getElementById("fTel").value.trim() || null,
          servico: pickedServicos.length ? pickedServicos.join(", ") : null,
          website: document.getElementById("website").value || null,
          elapsed_ms: Date.now() - loadedAt
        })
      })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(r) {
          btn.disabled = false;
          if (!r.ok) { throw new Error(r.data.error || "Error"); }
          showCard("cardDone");
          window.scrollTo(0, 0);
        })
        .catch(function(e) {
          btn.disabled = false;
          err.textContent = e.message;
        });
    }

    loadForm();
  </script>
</body>
</html>
