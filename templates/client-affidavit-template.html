<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fixed layout width (F45): a phone lays the page out at paper width and
       shows it zoomed out, so what it prints is the same as a desktop. -->
  <meta name="viewport" content="width=816">
  <meta name="robots" content="noindex">
  <title>Final Payment Affidavit</title>
  <link rel="stylesheet" href="../doc-hero.css?v=1790541646">
  <script src="../doc-hero.js?v=1790541647"></script>
  <style>
    /* PRINT TEMPLATE for the CONTRACTOR'S FINAL PAYMENT AFFIDAVIT (contracts
       build, checkpoint D1). Copied from client-change-order-template.html /
       client-contract-template.html (fix-build header, paginator, print sizing).
       ORIGINAL NOTE:
       Copied from client-estimate-template.html (fix-build header, paginator,
       print sizing, signature block); only the block builder differs.
       Long text flows between pages at paragraph and line level (fix build F45). Every page is a
       <section class="slide">; a JavaScript paginator measures each block and
       opens a new slide when the next block would not fit. The footer is
       ::after INSIDE the slide -- never position:fixed, never @bottom-center.
       Every slide is a fixed 7.5in x 10in box (the Letter page less the
       0.5in @page margins) on screen and in print, on a phone or a desktop:
       the paginator's budget never depends on the screen (F45/F47). No Apex branding anywhere: the client's photo, logo and
       colours only. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1f2328; --muted: #5a6470; --rule: #E3E7EC; --brand: #2b2f36; --accent: #2b2f36; --on-brand: #fff; --on-accent: #fff;
      /* Slide geometry. --pad-x / --pad-top are shared by the slide padding
         and the hero band's negative margins, so the photo is full-bleed. */
      --pad-x: 0.25in; --pad-top: 0.45in; --pad-bottom: 0.8in;
    }
    html, body { background: #e9ebee; }
    body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); font-size: 10.5pt; line-height: 1.4; padding: 24px 0; }
    .toolbar { max-width: 7.5in; margin: 0 auto 14px; display: flex; gap: 10px; justify-content: flex-end; }
    .toolbar button { min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #c8ccd2; background: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
    .slide { position: relative; width: 7.5in; height: 10in; margin: 0 auto 24px; background: #fff; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); overflow: visible; box-shadow: 0 2px 14px rgba(0,0,0,0.12); }
    .slide::before { content: ""; position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: .56in; height: 1px; background: #E3E7EC; }
    .slide::after { content: attr(data-footer); position: absolute; left: var(--pad-x); bottom: .32in; font-size: 8pt; color: #5A6470; }
    .pg { position: absolute; right: var(--pad-x); bottom: .32in; font-size: 8pt; color: #5A6470; }
    .blk { margin-bottom: 8pt; }

    /* ---- HERO BAND + TILE ROW: ../doc-hero.css (shared with the homeowner
       pages and the portal hero picker); framing and tone from ../doc-hero.js. */

    /* ---- META AREA (DRAFT .invoice-meta-area): customer + business on the
       left, document number / dates / terms on the right, the amount tile
       under them. License, phone, email, address live HERE, never in a band. */
    .meta-area { display: flex; justify-content: space-between; align-items: flex-start; gap: 24pt; }
    .meta-left { flex: 1; min-width: 0; font-size: 9.5pt; }
    .meta-left .k, .meta-right .k { font-size: 7.5pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2pt; }
    .meta-left .who { font-size: 12pt; font-weight: 700; }
    .meta-left .from { margin-top: 8pt; font-size: 8.5pt; color: #444; line-height: 1.5; }
    .meta-right { min-width: 2.9in; max-width: 3.2in; text-align: right; }
    .meta-right .title { font-size: 20pt; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; color: var(--brand); line-height: 1.1; }
    .meta-right .num { font-size: 12pt; font-weight: 700; color: var(--accent); margin-bottom: 4pt; }
    .meta-right table { width: 100%; border-collapse: collapse; }
    .meta-right td { padding: 2pt 6pt; font-size: 9pt; vertical-align: top; border: none; }
    .meta-right td.fl { font-weight: 600; color: #444; white-space: nowrap; text-align: left; }
    .meta-right td.fv { color: #111; text-align: right; }
    .stamp { display: inline-block; margin-top: 4pt; font-size: 8.5pt; font-weight: 800; letter-spacing: 0.06em; }
    .stamp.ok { color: #2f6b3e; } .stamp.bad { color: #a63d3d; }
    /* DRAFT .amount-due-tile, in the client's accent colour instead of gold. */
    /* SOFT PRICES (hero build, D, Nicole 2026-09-27): a light weight reads as more
       affordable than bold, presence comes from a contained charcoal pill, not size;
       every other amount is weight 400 so nothing screams. Comma and cents kept. */
    .amount-due-tile { background: #faf7f1; color: #2b2b2b; border: 1px solid var(--accent); border-radius: 999px; padding: 10px 24px; max-width: 360px; margin: 8pt auto 0; text-align: center; }
    .amount-due-tile .adt-label { font-size: 10px; font-weight: 600; color: #6b6b6b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2pt; }
    .amount-due-tile .adt-value { font-size: 21px; font-weight: 300; letter-spacing: 0; color: #2b2b2b; }

    .sec-title { font-size: 11pt; font-weight: 800; padding: 6pt 0 3pt; border-bottom: 1.5px solid var(--accent); margin-top: 6pt; }
    .cat-title { font-size: 9.5pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6pt 0 2pt; }
    .tier-title { font-size: 13pt; font-weight: 900; color: var(--brand); padding: 8pt 0 2pt; }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    thead th { text-align: left; font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 4pt 4pt; border-bottom: 1px solid var(--rule); }
    td { padding: 5pt 4pt; border-bottom: 1px solid var(--rule); vertical-align: top; }
    td.q, th.q { width: 0.9in; white-space: nowrap; }
    td.r, th.r { width: 1in; text-align: right; white-space: nowrap; }
    td.a, th.a { width: 1.1in; text-align: right; white-space: nowrap; font-weight: 400; }
    td .desc { font-size: 8.5pt; color: var(--muted); white-space: pre-wrap; }
    tr.sub td { font-weight: 700; color: var(--muted); border-bottom: none; }
    tr.sub td.a { font-weight: 400; }
    .totals { margin-left: auto; width: 3.2in; font-size: 10pt; }
    .totals .row { display: flex; justify-content: space-between; padding: 3pt 0; }
    .totals .grand { font-size: 17px; font-weight: 500; border-top: 2px solid var(--ink); padding-top: 5pt; margin-top: 3pt; }
    .totals .grand span:last-child { font-weight: 300; }
    .tier-price { font-weight: 400; }
    .terms p { white-space: pre-wrap; font-size: 9.5pt; margin-bottom: 6pt; }
    .terms b { display: block; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 4pt; }
    /* DRAFT .payment-tiles / .payment-tile: one tile per accepted method,
       the detail as plain text (Zelle: the handle, never a button). */
    .payment-tiles { display: flex; gap: 8pt; margin-top: 4pt; flex-wrap: wrap; break-inside: avoid; page-break-inside: avoid; }
    .payment-tile { background: #fff; border: 1px solid #e0ddd5; border-radius: 8px; padding: 6pt 10pt; display: flex; flex-direction: column; align-items: flex-start; gap: 2pt; min-width: 1.3in; max-width: 3.3in; }
    .payment-tile .pt-label { font-size: 8pt; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.05em; }
    .payment-tile .pt-detail { font-size: 9pt; color: #111; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sigblock { border: 1px solid var(--rule); border-radius: 6pt; padding: 12pt; break-inside: avoid; page-break-inside: avoid; }
    .sigblock .t { font-weight: 800; margin-bottom: 6pt; }
    .sigblock .grid { display: flex; gap: 18pt; font-size: 9.5pt; }
    .sigblock .grid > div { flex: 1; min-width: 0; }
    .sigblock .k { font-size: 7.5pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6pt; }
    .sigblock .k:first-child { margin-top: 0; }
    .sigblock img { max-height: 70pt; max-width: 240pt; display: block; margin: 4pt 0; }
    .sigblock .typed { font-family: "Snell Roundhand", "Brush Script MT", cursive; font-size: 18pt; padding: 4pt 0; }
    .sigblock .line { border-bottom: 1px solid var(--ink); height: 34pt; }
    .sigblock .hash { font-family: ui-monospace, Menlo, monospace; font-size: 7pt; color: var(--muted); overflow-wrap: anywhere; }
    .banner { border-radius: 6pt; padding: 8pt 12pt; font-size: 9.5pt; break-inside: avoid; page-break-inside: avoid; }
    .banner.bad { background: #fbeaea; border: 1px solid #e3b4b4; color: #7a2a2a; }
    .banner.ok { background: #eaf4ec; border: 1px solid #b9d7c0; color: #23532f; }
    .banner b { display: block; font-size: 10.5pt; margin-bottom: 2pt; }
    .muted { color: var(--muted); }
    /* ---- Contract blocks ---- */
    .clause { break-inside: avoid; page-break-inside: avoid; }
    .clause p { font-size: 9.5pt; margin-bottom: 5pt; white-space: pre-wrap; }
    .clause .h { font-size: 10.5pt; font-weight: 800; }
    .locked { break-inside: avoid; page-break-inside: avoid; }
    .locked p { font-size: 9.5pt; font-weight: 700; margin-bottom: 5pt; white-space: pre-wrap; }
    .lien { padding-top: 0.4in; }
    .lien p { font-size: 12pt; font-weight: 700; text-transform: uppercase; line-height: 1.45; margin-bottom: 8pt; white-space: pre-wrap; }
    .lien .sigrow { display: flex; gap: 24pt; margin-top: 14pt; font-size: 10pt; font-weight: 700; text-transform: uppercase; }
    .lien .sigrow > div { flex: 1; }
    .lien .sigrow .line { border-bottom: 1.5px solid var(--ink); height: 40pt; }
    .lien .sigrow img { max-height: 40pt; max-width: 220pt; display: block; }
    .noc { padding-top: 0.2in; }
    .noc p { font-size: 10pt; font-weight: 700; margin-bottom: 7pt; white-space: pre-wrap; }
    .noc .copy { font-size: 8pt; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8pt; }
    .l5a { font-size: 10pt; font-weight: 700; margin: 6pt 0; white-space: pre-wrap; }
    .disclaimer { font-size: 8.5pt; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 6pt; margin-top: 8pt; }
    /* NOT SIGNED band: inside the footer zone of every page, outside the flow. */
    .nsband { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 0.6in; text-align: center; font-size: 8pt; font-weight: 800; letter-spacing: 0.06em; color: #a63d3d; background: #fbeaea; border: 1px solid #e3b4b4; border-radius: 4pt; padding: 1pt 0; }
    #stage { position: absolute; left: -10000px; top: 0; width: 7in; }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      /* A fixed physical page (contracts fix build, F45): Letter with 0.5in
         margins, each slide exactly the 7.5in x 10in printable box, whatever
         device prints it. Never vw/vh here: on a phone those are the SCREEN,
         which is what printed the whole contract in a half-width column. */
      .slide { width: 7.5in; height: 9.98in; margin: 0; box-shadow: none; break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .slide:last-child { break-after: auto; page-break-after: auto; }
      @page { size: Letter portrait; margin: 0.5in; }
    }
    /* Compact letterhead band (same override as the change-order addendum). */
    .hero-band { height: 0.6in !important; min-height: 0 !important; margin-bottom: 8pt !important; }
    .hero-band .client-logo-tile { width: 1.4in !important; height: 0.42in !important; padding: 4px 12px !important; }
    .hero-band .client-logo-tile img { max-height: 0.36in !important; }
    .hero-band .client-name-mark { font-size: 9pt !important; }
    .hero-band .brand-pill { font-size: 8pt !important; padding: 3px 10px !important; }
    /* The stacked logo + pill (doc-hero.css) is ~133px tall and cannot fit a
       0.55-0.65in letterhead, so here the pair stays side by side. */
    .hero-band .header-tile-row { flex-direction: row !important; gap: 10px !important; }
    /* Affidavit (s. 713.06(3)(d)): legal-document typography. */
    .aff { font-family: Georgia, "Times New Roman", serif; font-size: 10.5pt; line-height: 1.38; }
    .aff h1 { font-size: 13pt; font-weight: 700; text-transform: uppercase; text-align: center; letter-spacing: 0.04em; margin: 2pt 0 8pt; }
    .aff p { margin: 0 0 6pt; }
    .aff .venue { margin-bottom: 8pt; }
    .aff .numbered { margin-left: 18pt; }
    .aff table.lienors { width: 100%; border-collapse: collapse; margin: 2pt 0 8pt; font-size: 10pt; }
    .aff table.lienors th { text-align: left; border-bottom: 1px solid #111; padding: 3pt 4pt; font-weight: 700; }
    .aff table.lienors td { border-bottom: 0.5pt solid #999; padding: 3pt 4pt; vertical-align: top; }
    .aff .sigline { display: inline-block; border-bottom: 1px solid #111; min-width: 2.6in; height: 18pt; vertical-align: bottom; }
    .aff .blank { display: inline-block; border-bottom: 1px solid #111; min-width: 1.1in; height: 12pt; vertical-align: bottom; }
    .aff .jurat { border-top: 1px solid #111; margin-top: 10pt; padding-top: 8pt; }
    .aff .seal { display: inline-block; width: 1.3in; height: 0.75in; border: 1px dashed #999; border-radius: 4pt; text-align: center; font-size: 8pt; color: #666; padding-top: 0.3in; margin-top: 4pt; }
    .aff .sub { font-size: 9pt; color: #444; }
    .sum h2 { font-size: 13pt; font-weight: 800; margin: 0 0 8pt; }
    .sum table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-bottom: 8pt; }
    .sum th { text-align: left; font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 3pt 4pt; border-bottom: 1px solid var(--rule); }
    .sum td { padding: 3pt 4pt; border-bottom: 0.5pt solid #ddd; vertical-align: top; }
    .sum td.r { text-align: right; white-space: nowrap; }
    .warn { background: #fbeaea; border: 1px solid #e3b4b4; color: #7a2a2a; border-radius: 6pt; padding: 8pt 12pt; font-size: 9.5pt; margin-bottom: 6pt; }
    .note { font-size: 8.5pt; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 6pt; margin-top: 8pt; }
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="printWithoutToken()">Print / Save as PDF</button></div>
  <div id="pages"><section class="slide" data-footer=""><p class="muted">Loading...</p></section></div>
  <!-- Off-screen measuring stage, the same width as a slide's content box. -->
  <div id="stage"></div>

  <script>
    var NOT_FOUND = "Affidavit not available.";
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";
    // The affidavit is an OWNER document: it loads through the client session (?job=ID).
    var jobId = (window.location.search.match(/[?&]job=([A-Za-z0-9-]+)/) || [])[1] || null;
    var token = null;
    // Portal preview (owner session) and a local mock for offline checks only.
    var previewId = null;
    var mockUrl = (window.location.search.match(/[?&]mock=([A-Za-z0-9_.\/-]+)/) || [])[1] || null;
    // Docs PDF build: Chrome on the server prints this page to the PDF the
    // phone downloads. It waits for body[data-render-done] ("1" = finished,
    // "notfound" = no document). Owner-side documents are loaded with a
    // Worker-signed render token for this ONE document (rt=, cid=), never a login.
    var renderToken = (window.location.search.match(/[?&]rt=(rndr_[A-Za-z0-9_.-]+)/) || [])[1] || null;
    var renderCid = (window.location.search.match(/[?&]cid=([A-Za-z0-9_-]+)/) || [])[1] || null;
    function renderDone(v) { if (document.body) { document.body.setAttribute("data-render-done", v); } }
    // Content budget per slide, in CSS px: a printed slide is 10in tall =
    // 0.45in top padding + 8.7in content + 0.8in footer zone (0.05in slack).
    // The same number on every screen: the stage is a fixed 7in wide.
    var PAD_TOP_PX = 0.45 * 96;
    var CONTENT_BUDGET = 8.7 * 96;
    var CONTENT_H = CONTENT_BUDGET;
    var aff = null;

    function escHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
    function money(c) { var n = (Number(c) || 0) / 100; var neg = n < 0; n = Math.abs(n); var p = n.toFixed(2).split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (neg ? "-" : "") + "$" + p.join("."); }
    // Plain YYYY-MM-DD dates print as they are; a UTC timestamp from D1 is
    // first converted to the Eastern calendar date (a 10 PM Eastern signature
    // is still that day, never tomorrow).
    function fmtDate(v) {
      if (!v) { return ""; }
      var s = String(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { var p = s.split("-"); return p[1] + "/" + p[2] + "/" + p[0]; }
      var iso = s.replace(" ", "T"); if (!/[Zz]|[+-]\d\d:?\d\d$/.test(iso)) { iso += "Z"; }
      var d = new Date(iso); if (isNaN(d.getTime())) { return s; }
      try {
        var q = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d).reduce(function(a, x) { a[x.type] = x.value; return a; }, {});
        return q.month + "/" + q.day + "/" + q.year;
      } catch (e) { return s.slice(0, 10); }
    }
    // F46: iPhone Safari prints the page URL in its print header/footer, and
    // this URL carries the private ?t= access token. Everything is already
    // loaded, so the token is taken out of the address bar
    // (history.replaceState, same path, other parameters kept) for the
    // duration of the print and put back afterwards. Hooked on
    // beforeprint/afterprint AND a print media-query listener (Safari fires
    // one or the other depending on how printing was started), and wrapped
    // around this page's own print() calls.
    var printUrlSaved = null;
    function printUrlHide() {
      if (printUrlSaved !== null) { return; }
      try {
        var href = window.location.href;
        if (!/[?&]t=[a-f0-9]{48}/.test(href)) { return; }
        var q = window.location.search.replace(/([?&])t=[a-f0-9]{48}&?/, "$1").replace(/[?&]$/, "");
        printUrlSaved = href;
        history.replaceState(history.state, "", window.location.pathname + q + window.location.hash);
      } catch (e) { printUrlSaved = null; console.error(e); }
    }
    function printUrlRestore() {
      if (printUrlSaved === null) { return; }
      try { history.replaceState(history.state, "", printUrlSaved); } catch (e) { console.error(e); }
      printUrlSaved = null;
    }
    function printWithoutToken() { printUrlHide(); window.print(); }
    window.addEventListener("beforeprint", printUrlHide);
    window.addEventListener("afterprint", printUrlRestore);
    if (window.matchMedia) {
      try {
        var printMql = window.matchMedia("print");
        var onPrintMql = function(m) { if (m.matches) { printUrlHide(); } else { printUrlRestore(); } };
        if (printMql.addEventListener) { printMql.addEventListener("change", onPrintMql); } else if (printMql.addListener) { printMql.addListener(onPrintMql); }
      } catch (e) { console.error(e); }
    }
    function fmtDateTime(iso) {
      if (!iso) { return ""; }
      var s = String(iso).replace(" ", "T"); if (!/[Zz]|[+-]\d\d:?\d\d$/.test(s)) { s += "Z"; }
      var d = new Date(s); if (isNaN(d.getTime())) { return iso; }
      try { var p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(d).reduce(function(a, x) { a[x.type] = x.value; return a; }, {});
        return p.month + "/" + p.day + "/" + p.year + " " + p.hour + ":" + p.minute + " " + (p.dayPeriod || "").toUpperCase() + " ET"; } catch (e) { return iso; }
    }
    // (401) 651-4117 whatever was typed; anything that is not a US number prints as typed.
    function fmtPhone(tel) { var d = String(tel || "").replace(/\D/g, ""); if (d.length === 11 && d.charAt(0) === "1") { d = d.slice(1); } if (d.length === 10) { return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6); } return String(tel || ""); }
    function lum(hex) { var h = hex.replace("#", ""); var rgb = [0, 2, 4].map(function(i) { var c = parseInt(h.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]; }
    function textOn(hex) { return (1.05 / (lum(hex) + 0.05)) >= 4.5 ? "#ffffff" : "#111111"; }
    function tierLabel(o) { return o.label || (o.tier === "single" ? "" : o.tier.charAt(0).toUpperCase() + o.tier.slice(1)); }
    var PM = { zelle: "Zelle", check: "Check", cash: "Cash", money_order: "Money order", bank_transfer: "Bank transfer / ACH", card_link: "Card", card: "Card", other: "Other" };

    // ── Shared header blocks (the DRAFT's hero + tile row + meta area) ────
    // Hero band: the client's photo, or a solid band in the primary colour.
    // Inside it the frosted tile with the logo (or the name as a wordmark)
    // and the business name pill in the accent colour. One block, never split.
    function heroBlockHtml(b) {
      var name = b.name || "";
      var tile = b.logo_url ? '<img src="' + escHtml(b.logo_url) + '" alt="">' : '<span class="client-name-mark' + (name.length > 22 ? " is-long" : "") + '">' + escHtml(name) + '</span>';
      var h = b.hero || null;
      var band = typeof docHeroBandStyle === "function" ? docHeroBandStyle(h) : "";
      var tone = typeof docHeroToneClass === "function" ? docHeroToneClass(h) : "";

          return preload([aff.business.logo_url, aff.business.hero_url]).then(function() {
            render();
            if (document.fonts && document.fonts.ready) { return document.fonts.ready.then(function() { render(); }); }

        })
        .then(function() {
          if (aff) { renderDone("1"); }
          if (aff && !/[?&]noprint=1/.test(window.location.search)) { setTimeout(function() { printWithoutToken(); }, 300); }
        })
        .catch(function(e) { console.error(e); notFound(); });
    }

    window.onload = function() { load(); };
