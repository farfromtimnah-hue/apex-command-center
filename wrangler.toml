name              = "apex-api"
main              = "worker/index.js"
compatibility_date = "2024-09-23"
# Required by @cloudflare/puppeteer (docs PDF build, Part A).
compatibility_flags = ["nodejs_compat"]

# Readable customer document links (Nicole, 2026-09-27): the Worker answers
# doc.resonateai.online directly (a Workers custom domain, so its DNS record is
# created by deploy). apex.resonateai.online stays on GitHub Pages, untouched.
# Keep the workers.dev address ON: the whole app calls apex-api.farfromtimnah.workers.dev.
# Declaring routes makes wrangler turn it OFF unless this is explicit (it did, 2026-09-27).
workers_dev = true

routes = [
  { pattern = "doc.resonateai.online", custom_domain = true }
]

[observability]
enabled = true

[[d1_databases]]
binding       = "DB"
database_name = "apex-command-center"
database_id   = "03fdcf49-4a1f-43f3-a0d9-d54772074b74"

[[r2_buckets]]
binding     = "ASSETS"
bucket_name = "apex-command-center"

# Task 1.4: task attachments (photos, PDFs, documents up to 10 MB). Never
# served from a public URL -- every download streams through the Worker
# with the same auth as the task itself.
[[r2_buckets]]
binding     = "TASK_FILES"
bucket_name = "apex-task-files"

# Runs the `scheduled` handler (worker/index.js) every 4 hours to proactively
# exercise the Zoho Books + Google Calendar token refresh and alert Nicole's
# Telegram DM on failure, instead of finding out when a client hits a broken
# button. See worker/index.js checkIntegrationHealth().
[triggers]
crons = ["*/5 * * * *"]

# These vars are placeholders only.
# Required Worker Secrets (set via `wrangler secret put <NAME>`, never commit real keys here):
#   CLAUDE_API_KEY, FIREFLIES_API_KEY, FIREFLIES_WEBHOOK_SECRET,
#   GOOGLE_CALENDAR_CLIENT_ID, GOOGLE_CALENDAR_CLIENT_SECRET,
#   ZOHO_BOOKS_CLIENT_ID, ZOHO_BOOKS_CLIENT_SECRET,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID
# Workers AI: voice booking transcribes with @cf/deepgram/nova-3 before Claude
# extracts the fields. Rafa is overloaded and the booking dialog's questions
# are what he routes around, so the microphone has to be the whole interface.
[ai]
binding = "AI"

# Headless Chrome (Browser Rendering, Workers FREE plan), exactly as the
# rafa-vault Worker declares it. Customer document PDFs are printed here from
# the same templates instead of by the homeowner's phone (docs PDF build).
[browser]
binding = "BROWSER"

# Cloudflare Images (2026-10-19, contact-card vCard photo fix): the ONLY use
# is gmVcardPhotoBytes() padding a business logo of ANY aspect ratio into a
# square canvas (fit: "pad", a brand-color background) so the circle iOS
# draws around a saved contact's photo never crops it. The logo bytes
# themselves still come from R2 (env.ASSETS) -- this binding only transforms
# them, nothing is uploaded to or stored in Cloudflare Images.
[images]
binding = "IMAGES"

[vars]
FIREBASE_PROJECT_ID          = "apex-command-center-4b038"
# Task 1.5: Twilio. GitHub's push protection blocks a Twilio Account/API-key
# SID committed in plaintext even though they are identifiers, not
# passwords -- so TWILIO_ACCOUNT_SID and TWILIO_API_KEY_SID are Worker
# SECRETS (set via `wrangler secret put`, same as TWILIO_API_KEY_SECRET),
# not vars. env.TWILIO_ACCOUNT_SID / env.TWILIO_API_KEY_SID in worker/index.js
# work identically either way -- no code change needed. FROM_NUMBER and
# MESSAGING_SERVICE_SID stay empty until Nicole has a sender; with both
# empty and REMINDER_TEXTS_ENABLED empty, no reminder text can ever send
# (see reminderTextsConfigured in worker/index.js).
TWILIO_FROM_NUMBER           = ""
TWILIO_MESSAGING_SERVICE_SID = ""
REMINDER_TEXTS_ENABLED       = ""
# Task 5.2: "Meu próprio contrato" -- the Claude model that reads an
# uploaded PDF contract and maps its clauses onto the Apex standard
# template's own areas. Defaults to claude-sonnet-5-5 in code
# (gmContractOwnTemplateModel) if this is left unset; reported to Nicole
# for approval in the job's final report.
CONTRACT_READ_MODEL          = "claude-sonnet-5-5"
# TAP_TO_PAY_PUBLIC: unset (developer-only gate, Fix 5, 2026-10-18). Once
# Apple grants the distribution entitlement, set this to "1" here (or via
# `wrangler secret put` / the dashboard) to open Tap to Pay to every business
# owner -- no code change. Left unset deliberately: do not add it as "1"
# without Apple's approval in hand.
# PASSKEY LOGIN (Stytch Consumer project, 2026-10-18). Names only, no values
# here; the reviewer sets them. Every passkey route except
# GET /api/passkey-login/status answers 404 until PASSKEY_LOGIN_ENABLED = "1".
#   PASSKEY_LOGIN_ENABLED      var:    "1" turns the passkey routes on
#   PASSKEY_APP_READY          var:    "1" = invite message offers the iPhone app
#   PASSKEY_SMS_DAILY_CAP      var:    app-wide SMS code sends per 24h (default 30)
#   PASSKEY_ALLOWED_COUNTRIES  var:    calling codes allowed for SMS (default "1,55")
#   STYTCH_ENV                 var:    "live" for api.stytch.com, else test.stytch.com
#   STYTCH_PROJECT_ID          secret: Stytch project id
#   STYTCH_SECRET              secret: Stytch secret (never commit it)
# Login completion build, 2026-10-18. Names only, same rule as above.
#   PASSKEY_WHATSAPP_ENABLED     var: "1" turns on the WhatsApp channel for +55 numbers
#   PASSKEY_WHATSAPP_DAILY_CAP   var: app-wide WhatsApp code sends per 24h (default 30)
#   PASSKEY_TRUSTED_COUNTRIES    var: comma list of ISO country codes (default "US,BR,CA")
# Group 1.3 (2026-10-19): a MONTHLY cap on top of the existing daily one
# (PASSKEY_SMS_DAILY_CAP), plus the two new reminder-text counters (task 1.5).
#   PASSKEY_SMS_MONTHLY_CAP   var: app-wide passkey SMS sends per calendar month (default 600)
#   REMINDER_SMS_DAILY_CAP    var: app-wide reminder-text sends per 24h (default 60)
#   REMINDER_SMS_MONTHLY_CAP  var: app-wide reminder-text sends per calendar month (default 600)
# Task 1.5 (2026-10-19): text reminders for meetings, through Twilio.
# TWILIO_ACCOUNT_SID and TWILIO_API_KEY_SID are identifiers, not secrets by
# nature, but GitHub's push protection still blocks a Twilio SID committed
# in plaintext -- so both are Worker SECRETS here (set via `wrangler secret
# put`, values held by the reviewer, never committed), same as
# TWILIO_API_KEY_SECRET. Names only:
#   TWILIO_ACCOUNT_SID             secret: Twilio Account SID
#   TWILIO_API_KEY_SID             secret: Twilio API key SID
#   TWILIO_FROM_NUMBER             var: unset until Nicole has a sender number
#   TWILIO_MESSAGING_SERVICE_SID   var: unset until Nicole has one (preferred over FROM when set)
#   REMINDER_TEXTS_ENABLED         var: "1" turns reminder sends on; unset/anything else = off
