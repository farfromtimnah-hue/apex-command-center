     Apex-staff "partner" role (the passkey login_role "partner" is a
     client-tier role scoped to one business, not a cross-business admin
     screen), so the brief's "developers and partners" is served here as
     developer-only, matching GET /api/diagnostics/login-activity's own

<head>

  <!-- GLOBAL JS ERROR HOOK. Must be the FIRST script on the page, before
       native-bridge.js, so it is installed before anything that can throw. -->
  <script>
  (function () {
    var P = String(window.location.protocol || "").toLowerCase();
    if (P !== "capacitor:" && P !== "ionic:" && P !== "file:") { return; }

    function stash(kind, detail) {
      var line = "[" + kind + "] " + detail;
      try { if (window.console && console.log) { console.log("[APEXERR] " + line); } } catch (e) {}
      try {
        var name = "apextrace=";
        var parts = String(document.cookie || "").split(";");
        var buf = "";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          while (p.charAt(0) === " ") { p = p.substring(1); }
          if (p.indexOf(name) === 0) { buf = decodeURIComponent(p.substring(name.length)); break; }
        }
        buf = buf + (buf ? "\n" : "") + "ERR " + line;
        if (buf.length > 7000) { buf = buf.slice(buf.length - 7000); }
        document.cookie = "apextrace=" + encodeURIComponent(buf) + "; max-age=86400; path=/";
      } catch (e) {}
      try {
        var C = window.Capacitor;
        if (C && C.Plugins && C.Plugins.ApexLockCover && C.Plugins.ApexLockCover.trace) {
          C.Plugins.ApexLockCover.trace({ message: "JSERROR " + line });
        }
      } catch (e) {}
    }

    window.addEventListener("error", function (ev) {
      if (ev && ev.target && ev.target !== window && ev.target.tagName) {
        stash("RESOURCE", ev.target.tagName + " failed to load: " +
          (ev.target.src || ev.target.href || "?"));
        return;
      }
      var e = ev && ev.error;
      stash("ERROR",
        (ev && ev.message ? ev.message : "?") +
        " @ " + (ev && ev.filename ? ev.filename : "?") +
        ":" + (ev && ev.lineno !== undefined ? ev.lineno : "?") +
        ":" + (ev && ev.colno !== undefined ? ev.colno : "?") +
        " | stack=" + (e && e.stack ? String(e.stack).slice(0, 400) : "none"));
    }, true);

    window.addEventListener("unhandledrejection", function (ev) {
      var r = ev && ev.reason;
      stash("REJECTION",
        (r && r.message ? r.message : String(r)) +
        " | stack=" + (r && r.stack ? String(r.stack).slice(0, 400) : "none"));
    });

    window.__apexErrHookInstalled = true;
  })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface:  #f9f7f4;
      --header:   #1a1a1d;
      --gold:     #C9A43A;
      --gold-dim: rgba(201,164,58,0.14);
      --text:     #1a1a1d;
      --muted:    #6b6660;
      --border:   #e8e2d9;
      --card:     #ffffff;
      --radius:   10px;
      --shadow:   0 2px 16px rgba(26,26,29,0.08);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.lang-pt .show-en { display: none; }
    body.lang-en .show-pt { display: none; }

    #appHeader {
      background: var(--header);
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
    }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .user-pill { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.7); font-size: 13px; }
    .role-badge {
      background: var(--gold-dim); border: 1px solid rgba(201,164,58,0.4); color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 10px;
    }
    .btn-header {
      background: transparent; border: 1.5px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75); font-family: 'Inter', sans-serif; font-size: 12px;
      font-weight: 500; padding: 5px 13px; border-radius: 20px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-header:hover { border-color: rgba(255,255,255,0.45); color: #fff; }
    .lang-btn {
      background: transparent; border: 1.5px solid var(--gold); color: var(--gold);
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      padding: 5px 13px; border-radius: 20px; cursor: pointer; transition: background 0.15s;
    }
    .lang-btn:hover { background: var(--gold-dim); }

    #loadingScreen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; color: var(--muted); font-size: 14px;
    }
    #loadingScreen[hidden] { display: none !important; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #appMain {
      flex: 1; overflow-y: auto; padding: 28px 32px;
      display: flex; flex-direction: column; gap: 24px;
    }

    .page-heading { font-size: 22px; font-weight: 700; color: var(--text); }

    .content-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .content-card-header {
      padding: 18px 24px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .content-card-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .content-card-body  { padding: 20px 24px; }

    /* Tab strip, same shape as gm.js's gmCalViewToggleHtml. */
    .act-tabs { display: flex; gap: 6px; }
    .act-tab-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
      padding: 7px 14px; border-radius: 16px; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .act-tab-btn.active { background: var(--header); color: #fff; border-color: var(--header); }
    .act-tab-btn:hover:not(.active) { background: var(--gold-dim); }

    .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; max-width: 260px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.4px; }
    .form-input, .form-select {
      height: 38px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .form-select { cursor: pointer; padding-right: 8px; }

    .act-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .act-table th {
      text-align: left; padding: 10px 16px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      color: var(--muted); border-bottom: 1px solid var(--border);
      text-transform: uppercase;
    }
    .act-table td {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      color: var(--text); vertical-align: middle;
    }
    .act-table tr:last-child td { border-bottom: none; }
    .act-table tr:hover td { background: rgba(201,164,58,0.04); }

    .flag-pill {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
      background: #fde8e8; color: #b44040;
    }
    .status-pill {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px; text-transform: capitalize;
      background: var(--gold-dim); color: #7a5c2e;
    }

    .table-empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    #forbiddenScreen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px;
    }
    #forbiddenScreen[hidden] { display: none !important; }

    @media (max-width: 768px) {
      #appMain { padding: 16px; }
      .form-row { flex-direction: column; align-items: stretch; }
      .form-group { min-width: 0; max-width: none; width: 100%; }
      .form-input, .form-select { min-height: 44px; }
      .act-table { display: block; overflow-x: auto; }
    }
  </style>
</head>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"
    integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
    crossorigin="anonymous"></script>

  <script>
    var WORKER_URL = "https://apex-api.farfromtimnah.workers.dev";

    var FIREBASE_CONFIG = {
      apiKey:            "AIzaSyB_OFg5ouKAu61vObNsHJaGQO0TikaIhy8",
      authDomain:        "apex-command-center-4b038.firebaseapp.com",
      projectId:         "apex-command-center-4b038",
      storageBucket:     "apex-command-center-4b038.firebasestorage.app",
      messagingSenderId: "894743550437",
      appId:             "1:894743550437:web:45041f841f7e8196db770c"
    };

    var auth        = null;
    var currentUser = null;

    function getToken() {
      if (!currentUser) { return Promise.reject(new Error("Not authenticated")); }
      return currentUser.getIdToken();
    }

    function handleSignOut() {
      if (auth) { auth.signOut(); }
      window.location.href = "index.html";
    }

    function populateHeaderUser(email, displayName, avatarUrl) {
      var emailEl = document.getElementById("headerEmail");
      if (emailEl) { emailEl.textContent = displayName || email || ""; }
    }

    function isEn() { return document.body.classList.contains("lang-en"); }
    function t(pt, en) { return isEn() ? en : pt; }
    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function apiFetch(path, opts) {
      opts = opts || {};
      return getToken().then(function(token) {
        var headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
        var fetchOpts = { method: opts.method || "GET", headers: headers };
        if (opts.body) { headers["Content-Type"] = "application/json"; fetchOpts.body = JSON.stringify(opts.body); }
        return fetch(WORKER_URL + path, fetchOpts);
      });
    }

    // ── Activity tab ──────────────────────────────────────────────────────
    var ACT_KIND_LABELS = {
      finance_view: { pt: "Visualizou financeiro", en: "Viewed finance" },
      data_change:  { pt: "Alterou dados", en: "Data change" }
    };
    var actFilterTimer = null;
    function actFilterChanged() {
      clearTimeout(actFilterTimer);
      actFilterTimer = setTimeout(loadActivity, 300);
    }
    function actKindLabel(kind) {
      var lbl = ACT_KIND_LABELS[kind];
      return lbl ? t(lbl.pt, lbl.en) : escHtml(kind || "");
    }
    function actDetailLine(detailStr) {
      if (!detailStr) { return ""; }
      var d;
      try { d = JSON.parse(detailStr); } catch (e) { return ""; }
      var bits = [];
      if (d && d.group) { bits.push(d.group); }
      if (d && d.method) { bits.push(d.method); }
      return escHtml(bits.join(" \u00b7 "));
    }
    function loadActivity() {
      var wrap = document.getElementById("actActivityTableWrap");
      if (!wrap) { return; }
      var person = (document.getElementById("actPersonFilter") || {}).value || "";
      var date = (document.getElementById("actDateFilter") || {}).value || "";
      var qs = [];
      if (person.trim()) { qs.push("person=" + encodeURIComponent(person.trim())); }
      if (date) { qs.push("date=" + encodeURIComponent(date)); }
      apiFetch("/api/diagnostics/login-activity" + (qs.length ? "?" + qs.join("&") : ""))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var rows = data.activity || [];
          if (!rows.length) {
            wrap.innerHTML = '<div class="table-empty">' +
              '<span class="show-pt">Nenhum registro.</span><span class="show-en">No rows.</span></div>';
            return;
          }
          var html = '<table class="act-table"><thead><tr>' +
            '<th>' + t("Pessoa", "Person") + '</th>' +
            '<th>' + t("A&ccedil;&atilde;o", "Action") + '</th>' +
            '<th>' + t("Caminho / m&eacute;todo", "Path / method") + '</th>' +
            '<th>' + t("Quando", "When") + '</th>' +
            '</tr></thead><tbody>';
          rows.forEach(function(r) {
            html += '<tr>' +
              '<td>' + escHtml(r.display_name || r.username || "") + '</td>' +
              '<td>' + actKindLabel(r.kind) + '</td>' +
              '<td>' + actDetailLine(r.detail) + '</td>' +
              '<td>' + escHtml(window.formatDateTimeUTC ? formatDateTimeUTC(r.at) : (r.at || "")) + '</td>' +
              '</tr>';
          });
          html += '</tbody></table>';
          wrap.innerHTML = html;
        })
        .catch(function() {
          wrap.innerHTML = '<div class="table-empty">' +
            '<span class="show-pt">N&atilde;o foi poss&iacute;vel carregar.</span><span class="show-en">Could not load.</span></div>';
        });
    }

    // ── Loss reviews tab ──────────────────────────────────────────────────
    function loadLossReviews() {
      var wrap = document.getElementById("actLossTableWrap");
      if (!wrap) { return; }
      var statusSel = document.getElementById("actLossStatusFilter");
      var status = statusSel ? statusSel.value : "open";
      var qs = status === "all" ? "" : ("?status=" + encodeURIComponent(status));
      apiFetch("/api/gm/loss-reviews" + qs)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var rows = data.reviews || [];
          if (!rows.length) {
            wrap.innerHTML = '<div class="table-empty">' +
              '<span class="show-pt">Nenhuma revis&atilde;o.</span><span class="show-en">No reviews.</span></div>';
            return;
          }
          var html = '<table class="act-table"><thead><tr>' +
            '<th>' + t("Pessoa", "Person") + '</th>' +
            '<th>' + t("Empresa", "Business") + '</th>' +
            '<th>' + t("Perdido em", "Lost at") + '</th>' +
            '<th>' + t("Reportado em", "Reported at") + '</th>' +
            '<th>' + t("Status", "Status") + '</th>' +
            '</tr></thead><tbody>';
          rows.forEach(function(r) {
            html += '<tr>' +
              '<td>' + escHtml(r.display_name || r.person_id || "") +
                (r.flagged ? ' <span class="flag-pill">' + t("Sinalizado", "Flagged") + '</span>' : "") + '</td>' +
              '<td>' + escHtml(r.client_name || "") + '</td>' +
              '<td>' + escHtml(window.formatDateTimeUTC ? formatDateTimeUTC(r.reported_loss_at) : (r.reported_loss_at || "")) + '</td>' +
              '<td>' + escHtml(window.formatDateTimeUTC ? formatDateTimeUTC(r.reported_at) : (r.reported_at || "")) + '</td>' +
              '<td><span class="status-pill">' + escHtml(r.status || "") + '</span></td>' +
              '</tr>';
          });
          html += '</tbody></table>';
          wrap.innerHTML = html;
        })
        .catch(function() {
          wrap.innerHTML = '<div class="table-empty">' +
            '<span class="show-pt">N&atilde;o foi poss&iacute;vel carregar.</span><span class="show-en">Could not load.</span></div>';
        });
    }

    // The 3 status options are built in JS (an <option> cannot hold
    // .show-pt/.show-en spans -- the browser strips the markup and shows
    // both languages as text, same reason clients.html's package dropdown
    // uses data-opt-pt/data-opt-en instead). Rebuilt on every call so a
    // language toggle re-renders it correctly too.
    function actRenderLossStatusOptions() {
      var sel = document.getElementById("actLossStatusFilter");
      if (!sel) { return; }
      var cur = sel.value || "open";
      sel.innerHTML =
        '<option value="open">' + t("Aberta", "Open") + '</option>' +
        '<option value="reviewed">' + t("Revisada", "Reviewed") + '</option>' +
        '<option value="all">' + t("Todas", "All") + '</option>';
      sel.value = cur;
    }

    var actCurrentTab = "activity";
    function actSetTab(tab) {
      actCurrentTab = tab;
      var activityBtn = document.getElementById("actTabActivityBtn");
      var lossBtn = document.getElementById("actTabLossBtn");
      var activityPane = document.getElementById("actTabActivity");
      var lossPane = document.getElementById("actTabLoss");
      if (activityBtn) { activityBtn.className = "act-tab-btn" + (tab === "activity" ? " active" : ""); }
      if (lossBtn) { lossBtn.className = "act-tab-btn" + (tab === "loss" ? " active" : ""); }
      if (activityPane) { activityPane.hidden = tab !== "activity"; }
      if (lossPane) { lossPane.hidden = tab !== "loss"; }
      if (tab === "activity") { loadActivity(); } else { actRenderLossStatusOptions(); loadLossReviews(); }
    }

    // ── Page setup ──────────────────────────────────────────────────────────
    function setupPage(role) {
      var roleEl  = document.getElementById("headerRole");
      var email = sessionStorage.getItem("apex_email") || (currentUser ? currentUser.email : "");
      var displayName = sessionStorage.getItem("apex_display_name") || null;
      var avatarUrl = sessionStorage.getItem("apex_avatar_url") || null;
      populateHeaderUser(email, displayName, avatarUrl);
      if (roleEl)  { roleEl.textContent  = role; }

      document.getElementById("loadingScreen").hidden = true;

      if (role !== "developer") {
        document.getElementById("forbiddenScreen").hidden = false;
        window.initNav && window.initNav();
        return;
      }

      document.getElementById("appMain").hidden = false;
      window.initNav && window.initNav();
      actSetTab("activity");
    }

    function fetchAndApplyRole() {
      return getToken().then(function(token) {
        return fetch(WORKER_URL + "/api/role", {
          headers: { "Authorization": "Bearer " + token },
          cache: "no-store"
        });
      }).then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      }).then(function(data) {
        sessionStorage.setItem("apex_role",         data.role);
        sessionStorage.setItem("apex_email",        data.email);
        sessionStorage.setItem("apex_display_name", data.display_name || "");
        sessionStorage.setItem("apex_avatar_url",   data.avatar_url   || "");
        if (window.apexApplyRoleLanguage) { window.apexApplyRoleLanguage(data); }
        var roleEl = document.getElementById("headerRole");
        if (roleEl) { roleEl.textContent = data.role; }
        populateHeaderUser(data.email, data.display_name || null, data.avatar_url || null);
        return data;
      });
    }

    // ── Bootstrap ────────────────────────────────────────────────────────────
    function init() {
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();

      auth.onAuthStateChanged(function (user) {
        if (!user) { window.location.href = "index.html"; return; }
        currentUser = user;
        var cached = sessionStorage.getItem("apex_role");
        if (cached) {
          setupPage(cached);
        }

        fetchAndApplyRole().then(function(data) {
          if (!cached) {
            setupPage(data.role);
          }
        }).catch(function () {
          if (!cached) { window.location.href = "index.html"; }
        });
      });

      window.addEventListener("pageshow", function(evt) {
        if (evt.persisted && currentUser) {
          fetchAndApplyRole().catch(function() {});
        }
      });
    }

    window.onload = function () { init(); };

    // The tables and the status dropdown build their bilingual text with
    // t() at render time (not .show-pt/.show-en spans), so a language
    // toggle needs an explicit re-render, same as every other gm.js-style
    // screen's own language-change listener.
    document.addEventListener("apex:langchange", function () {
      if (actCurrentTab === "activity") { loadActivity(); }
      else { actRenderLossStatusOptions(); loadLossReviews(); }
    });
  </script>
  <div id="mobile-tab-bar"></div>
  <div id="mobile-more-menu"></div>
</body>
</html>
